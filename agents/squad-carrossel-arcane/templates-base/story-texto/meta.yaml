name: "Story Texto"
slug: "story-texto"
type: "story"
dimensions: "1080x1920"
font: "Lato (corpo) + Inter (headline/números) + Bree Serif (destaques em <strong>)"
description: >
  Fundo escuro + texto, formato vertical Stories (9:16). Variante do Card Tweet Dark
  (mesma identidade: fundo preto, texto branco, laranja como destaque) adaptada pra
  Stories em vez de carrossel/feed. Criada 13/08/2026 a pedido do Gestor de Infra Arcane
  pro worker Expert-Stories (docs/producao-conteudo/karol/rotina-stories-formatos.md) —
  cobre os formatos "texto em fundo escuro" do catálogo (Levantada de Mão, Pico de
  Engajamento, Sequência, Isca Digital, Gerar Valor, Inimigo Comum, Dominando a Mente,
  Cantinho do Pensamento).
created_at: "2026-08-13T00:00:00Z"
author_name: "Karol Senna"
bg: "#000000"
text_color: "#FFFFFF"
accent_color: "#FF6B00"
text_size_headline: "64"
text_size_corpo: "44"
text_size_cta: "48"

safe_zone: >
  Padding vertical de 260px topo/rodapé — Instagram cobre essa área com a UI nativa
  (nome/hora no topo, campo de resposta embaixo). Conteúdo sempre dentro dessa margem.

slots:
  - id: "headline"
    type: "text"
    placeholder: "{{HEADLINE}}"
    bold_strategy: "auto"
    description: "Título/abertura do slide. <strong> renderiza em laranja (Bree Serif) pra destacar número/conceito-chave"

  - id: "corpo"
    type: "text"
    placeholder: "{{CORPO}}"
    optional: true
    description: "Lista numerada, parágrafo corrido, ou pergunta de quiz — varia por modifier"

  - id: "cta_final"
    type: "text"
    placeholder: "{{CTA}}"
    optional: true
    description: "Linha final de CTA (ex: Comenta 'X'), destaque em laranja"

modifiers:
  - "numerada"       # lista numerada 1/2/3 com número em laranja — Levantada de Mão, Isca Digital
  - "texto-corrido"  # parágrafo contínuo, sem lista — Cantinho do Pensamento, Dominando a Mente
  - "quiz"           # 2 opções empilhadas ("1 ou 2?") — Pico de Engajamento
  - "cta-grande"     # CTA como elemento dominante, texto de apoio menor — Sequência, Gerar Valor, Inimigo Comum

pendencias:
  - "Sem sticker nativo do Instagram (caixinha de pergunta, enquete) — não aplicável a este
    template. Formatos com sticker nativo (Caixinha, Enquete Positiva, Teste de Demanda)
    usam este template só pro texto de fundo; o sticker em si é colado manualmente no app."
