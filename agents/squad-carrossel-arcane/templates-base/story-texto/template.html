<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    background: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 64px;
    padding: 260px 90px;
    position: relative;
    overflow: hidden;
  }

  .headline {
    font-weight: 700;
    font-size: 64px;
    line-height: 1.28;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }

  .headline strong, .headline b {
    font-weight: 800;
    color: #FF6B00;
  }

  .corpo {
    font-weight: 400;
    font-size: 44px;
    line-height: 1.4;
    color: #FFFFFF;
  }

  .corpo strong, .corpo b {
    font-weight: 700;
    color: #FF6B00;
  }

  .cta {
    font-weight: 700;
    font-size: 48px;
    line-height: 1.35;
    color: #FFFFFF;
  }

  .cta strong, .cta b {
    font-weight: 800;
    color: #FF6B00;
  }

  /* modifier: numerada — lista numerada 1/2/3, número em laranja */
  .corpo .intro {
    margin-bottom: 40px;
  }

  .corpo ol.lista-numerada {
    list-style: none;
  }

  .corpo ol.lista-numerada li {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    font-size: 42px;
    line-height: 1.35;
  }

  .corpo ol.lista-numerada li:last-child {
    margin-bottom: 0;
  }

  .corpo ol.lista-numerada .num {
    flex-shrink: 0;
    font-weight: 800;
    color: #FF6B00;
  }

  /* modifier: texto-corrido — parágrafo único, sem lista */
  .slide.texto-corrido .corpo {
    font-size: 46px;
    line-height: 1.4;
  }

  /* modifier: quiz — 2 opções empilhadas */
  .corpo .quiz-opcoes {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .corpo .quiz-opcoes .opcao {
    font-size: 44px;
    font-weight: 600;
  }

  .corpo .quiz-opcoes .opcao .num {
    font-weight: 800;
    color: #FF6B00;
  }

  /* modifier: cta-grande — CTA como elemento dominante */
  .slide.cta-grande .cta {
    font-size: 60px;
  }

  .slide.cta-grande .corpo {
    font-size: 40px;
    color: #D9D9D6;
  }
</style>
</head>
<body>
<div class="slide {{MODIFIER}}">

  <div class="headline">{{HEADLINE}}</div>
  <div class="corpo">{{CORPO}}</div>
  <div class="cta">{{CTA}}</div>

</div>
</body>
</html>
