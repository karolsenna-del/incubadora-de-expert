name: "Publicador de GPT"
slug: "gpt-publisher"
slash_prefix: "gpt-publisher"
version: "1.0.0"
type: "worker"
forged_by: "worker-forge"
description: "Converte mentes forjadas no Auroq (formato Mind Forge) em Custom GPTs publicados no ChatGPT — Instructions compactadas, Knowledge organizado, conversation starters. Publica via automação de navegador (Playwright), sempre com aprovação antes de publicar."

agents:
  - id: "gpt-publisher"
    path: "agents/gpt-publisher.md"

tasks:
  - id: "start"
    path: "tasks/start.md"
  - id: "execute-mission"
    path: "tasks/execute-mission.md"
  - id: "research-tool"
    path: "tasks/research-tool.md"
  - id: "document-process"
    path: "tasks/document-process.md"
  - id: "diagnose-issue"
    path: "tasks/diagnose-issue.md"
  - id: "extract-mind"
    path: "tasks/extract-mind.md"
  - id: "compact-instructions"
    path: "tasks/compact-instructions.md"
  - id: "prepare-knowledge"
    path: "tasks/prepare-knowledge.md"
  - id: "generate-starters"
    path: "tasks/generate-starters.md"
  - id: "publish-gpt"
    path: "tasks/publish-gpt.md"
  - id: "audit-published"
    path: "tasks/audit-published.md"

knowledge_base:
  - id: "gpt-publisher-rules"
    path: "data/gpt-publisher-rules.md"
    priority: "critical"
    loading: "always"
  - id: "gpt-publisher-kb"
    path: "data/gpt-publisher-kb.md"
    priority: "high"
    loading: "on-demand"
  - id: "gpt-publisher-playbook"
    path: "data/gpt-publisher-playbook.md"
    priority: "high"
    loading: "on-demand"
  - id: "gpt-publisher-missions"
    path: "data/gpt-publisher-missions.md"
    priority: "normal"
    loading: "on-demand"

domains:
  - "chatgpt-gpt-builder"
  - "browser-automation"
  - "mind-forge-format"
  - "knowledge-compaction"

modes:
  - id: "mission"
    label: "Missao"
    trigger: "*mission"
  - id: "research"
    label: "Pesquisa"
    trigger: "*research"
  - id: "documentation"
    label: "Documentacao"
    trigger: "*document"
  - id: "diagnose"
    label: "Diagnostico"
    trigger: "*diagnose"
  - id: "audit"
    label: "Auditoria"
    trigger: "*audita"

tools_required:
  - "websearch"
  - "playwright"
  - "bash"

created: "2026-08-06"
language: "pt-BR"
target_user: "karol-senna"
