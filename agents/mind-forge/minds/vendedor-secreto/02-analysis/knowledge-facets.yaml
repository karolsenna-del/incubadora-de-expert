  - kf_id: "KF-vendedor-secreto-009"
    type: FRAMEWORK
    content: "A Narrativa ECROI (dentro da Etapa 4 do roteiro de sessão)"
    domain: "Frameworks de Sessão"
    source_expert: "Karol"
    steps_or_components:
