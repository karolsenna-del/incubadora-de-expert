  - kf_id: "KF-vendedor-secreto-007"
    type: FRAMEWORK
    content: "Questionário Raio-X (RX)"
    domain: "Frameworks de Sessão"
    source_expert: "Lourival"
    steps_or_components:
      - "1. Definir N áreas de potencial do cliente (ex: impacto, negócio, escala, urgência)"
      - "2. Definir N áreas de dificuldade — balanceadas com as de potencial (nem poucas, nem muitas)"
      - "3. Criar 3-5 perguntas investigativas por área, em tom consultivo (não robótico)"
      - "4. Aplicar ao vivo, compartilhando tela, em 10-30 minutos"
      - "5. Entregar a análise geral (pontos fortes/fracos) como ponte natural pra oferta"
    when_to_use: "Antes do pitch, dentro da Sessão A1, pra gerar confiança e aflorar necessidade."
    source_doc: "VOL-05-sessao-a1-metodo-fht.md"
    source_lens: "L2"
    source_tier: "ouro"
    confidence: 0.90
    inferred: false
    source_ref: "[SOURCE: VOL-05, seção 6]"
    pareto_zone: "excellence"

  - kf_id: "KF-vendedor-secreto-008"
    type: FRAMEWORK
    content: "Roteiro ECROI da Sessão de Vendas Secretas"
    domain: "Frameworks de Sessão"
    source_expert: "Karol"
    steps_or_components:
      - "Etapa 1 — Boas-vindas (3-5min): presença + alinhar o que vai acontecer"
      - "Etapa 2 — Diagnóstico (10-12min): perguntas do método específico, anotar as palavras exatas que a lead usa"
      - "Etapa 3 — História (5min): compartilhar trecho pessoal que espelha o que a lead descreveu"
      - "Etapa 4 — Oferta com narrativa ECROI (12-15min): Colapso → Reenquadramento → Ordem → Inevitabilidade"
      - "Etapa 5 — Fechamento: CTA de sinal de interesse → escassez (se real) → CTA emocional → tratamento de objeções"
    when_to_use: "Sessão 1:1 de 30-40min onde a venda acontece, depois do lead já ter passado por abordagem e agendamento."
    source_doc: "VOL-07-abordagem-sessao-ecroi.md"
    source_lens: "L2"
    source_tier: "ouro"
    confidence: 0.90
