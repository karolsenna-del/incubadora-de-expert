convergences:
  - topic: "Diagnóstico sempre antes da oferta"
    experts: ["Tomas", "Lourival", "Karol"]
    kf_ref: "KF-vendedor-secreto-010"
    descricao: "Os 3 frameworks de sessão, apesar de nomes e estruturas diferentes, seguem exatamente a mesma lógica: ouvir/diagnosticar primeiro, construir ponte, só então apresentar a oferta. É a convergência mais forte da mente — candidata a virar o Princípio Universal #1."

  - topic: "Venda ética / não manipular"
    experts: ["Tomas", "Lourival", "Karol"]
    kf_ref: "KF-vendedor-secreto-001, KF-vendedor-secreto-004"
    descricao: "Tomás ('seja justo, não empurre goela abaixo'), Lourival ('100% integridade') e Karol ('vender é servir quem já tem o problema') convergem em tratar a venda ética como pré-requisito, cada um com sua própria formulação."

  - topic: "Nunca sair da call sem resolver o próximo passo concreto"
    experts: ["Tomas", "Karol"]
    kf_ref: "KF-vendedor-secreto-025, KF-vendedor-secreto-028"
    descricao: "Tomás foca em fechar o pagamento ainda na câmera; Karol foca em confirmar 3 pontos (pagamento/data/canal) antes do tchau. Mesma lógica de fundo, formulações complementares."

  - topic: "Gravar as sessões"
    experts: ["Tomas", "Karol"]
    kf_ref: "KF-vendedor-secreto-029"
    descricao: "Tomás por proteção jurídica/contratual, Karol por revisão e prova de autoridade — motivos diferentes, mesma prática recomendada."

