atualizacao_22_09_dani_martins:
  contexto: "Usuária concluiu via ETLmaker a KB 'Os 7 Passos da Venda' (Dani Martins, aula Prosperus Club) e pediu para incorporá-la ao Vendedor Secreto como 4º expert fundido, não como enriquecimento pontual."
  natureza_da_fonte: "IMPORTANTE: Dani Martins não tem um framework de SESSÃO nomeado como os outros 3 (4 Blocos / RX / ECROI) — ela ensina uma filosofia e um conjunto de técnicas de venda consultiva GENÉRICAS (não desenhadas especificamente pra uma call 1:1 de diagnóstico de alto ticket). Por isso ela NÃO entra como uma 4ª opção em 'framework_de_sessao_fundido' abaixo — ela entra como CAMADA TRANSVERSAL de técnica que enriquece os passos que já existem dentro de qualquer um dos 3 frameworks de sessão."
  kfs_adicionados: 14
  novo_total_kfs: 55

  tensoes_resolvidas_no_playback_22_09:
    - topic: "Dois sistemas de perfil de cliente coexistindo"
      experts: ["Karol", "Dani Martins"]
      kf_ref: "KF-vendedor-secreto-011 (Conectora/Analista/Diretiva) + KF-vendedor-secreto-042 (ritmo, versão simplificada do DISC)"
      decisao_usuaria: "DISC completo (4 perfis) rejeitado por ser difícil de aplicar ao vivo. Simplificado para só o eixo de ritmo — checagem leve durante a conversa (acelera/desacelera), que reforça (não substitui) a leitura de lead pré-sessão de Karol. Os dois convivem por MOMENTO: KF-011 antes da sessão (pesquisa), KF-042 durante a sessão (ajuste ao vivo)."

    - topic: "Duas formas de reagir à objeção do cliente"
      experts: ["Karol", "Dani Martins"]
      kf_ref: "KF-vendedor-secreto-023 (pergunta investigativa) + KF-vendedor-secreto-048 (acolher/validar)"
      decisao_usuaria: "Aprovada a fusão em sequência: 1) acolher a preocupação como legítima (Dani) → 2) devolver com pergunta investigativa pra achar a objeção real por trás da declarada (Karol) → 3) responder com a tabela de objeções já existente (KF-024). Essa sequência de 3 passos é a técnica oficial de objeções da mente a partir de agora."

    - topic: "SPIN Selling vs. Questionário Raio-X — dois sistemas de perguntas de diagnóstico"
      experts: ["Lourival", "Dani Martins"]
      kf_ref: "KF-vendedor-secreto-007 (RX) + KF-vendedor-secreto-044 (SPIN)"
      decisao_usuaria: "SPIN adotado como técnica-padrão de diagnóstico (substitui o papel de sequenciamento que KF-015 tinha). Questionário Raio-X (KF-007) permanece intacto como um dos 3 frameworks de sessão nomeados — não foi descartado, só deixou de ser a técnica-padrão de sequenciar perguntas."

  vocabulario_decidido_22_09: "'SPIN' pode ser usado ativamente pela mente — termo padrão de mercado, não gíria proprietária. 'ZOPA', 'DISC' (como sistema de 4 letras) e 'dissonância cognitiva' foram EXCLUÍDOS do vocabulário ativo por decisão explícita da usuária ('não use o vocabulário da Dani') — os princípios por trás desses termos continuam na mente (KF-042, KF-050), só sem os nomes técnicos originais."

  convergencias_novas_ou_reforcadas:
    - "Nunca sair sem combinar próximo passo — agora com 3/4 experts (ver convergences acima)."
    - "Diagnóstico sempre antes da oferta — SPIN de Dani reforça independentemente o Princípio Universal já existente (KF-010)."
    - "Vender é servir / não empurrar goela abaixo — regra de 'não seja ansioso' de Dani (KF-053) reforça o limite ético já compartilhado pelos 3 experts originais, com um mecanismo psicológico novo (bloqueio de confiança) que os outros não articulam."

  vocabulario_a_decidir: "Dani traz vocabulário técnico de mercado geral (SPIN, ZOPA, DISC) diferente do vocabulário proprietário dos outros 3 (Cara de PIX, Sessão A1, ECROI, seeding). Perguntar à usuária: a mente adota esses termos técnicos como parte do vocabulário ativo, ou só reconhece/traduz quando a usuária os usar primeiro (mesmo tratamento dos termos cruzados entre os 3 experts originais)?"

  pendente_de_confirmacao_no_playback:
    - "Aprovar as 3 sínteses de tensão propostas acima (perfil de cliente, sequência de objeção, SPIN+RX)"
    - "Confirmar que Dani entra como camada transversal de técnica, não como 4º framework de sessão nomeado"
    - "Decidir tratamento do vocabulário técnico dela (adotar vs. só traduzir)"
    - "Validar se algum KF novo deveria ser rejeitado/ajustado antes da Forja"
