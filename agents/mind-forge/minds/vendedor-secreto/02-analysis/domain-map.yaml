framework_de_sessao_fundido:
  status: "Proposto no Playback (14/09), pendente de confirmação final da usuária antes da Fase 4 (Forja)"
  nome_provisorio: "Roteiro da Sessão de Vendas Secretas (fusão Tomás+Lourival+Karol)"
  etapas:
    - "1. Abertura + Seeding — rapport (comum aos 3) + aviso explícito de que, após o diagnóstico, virá uma oferta"
    - "2. Diagnóstico Estruturado — perguntas por categoria de potencial/dificuldade (estrutura de Lourival) + técnica de anotar palavras exatas da lead pra espelhar depois (Karol) — alimentado pelo Formulário de Pré-Diagnóstico (KF-041) já respondido"
    - "3. Ponte de Identificação — a mente oferece 2 estilos e pergunta qual combina: História pessoal do vendedor (Karol) OU Bloco de Sonhos / visualização do futuro resolvido (Tomás)"
    - "4. Oferta com Narrativa ECROI — estrutura retórica de Karol (Colapso→Reenquadramento→Ordem→Inevitabilidade), enriquecida com o detalhamento concreto de 'como mostrar o programa' de Tomás"
    - "5. Fechamento — tabela de objeções de Karol + linhas de negociação de pagamento por perfil financeiro de Tomás + disciplina de sempre executar o pitch de Lourival"
  precondicao: "Qualificação de Lead Pré-Sessão (domínio 9) já rodou antes da Etapa 1 — lead scoring (Tomás) + formulário preenchido (Karol)"
  nota: "Isto NÃO é mais 'escolha 1 dos 3 frameworks' — é uma quarta estrutura, própria do Vendedor Secreto, com proveniência rastreável passo a passo a qual expert contribuiu o quê. Precisa de confirmação final da usuária antes de virar a KB forjada."

gaps_detectados:
  - "Nenhum dos 3 experts detalha o que fazer se a lead interromper a sessão no meio (call cai, imprevisto) — gap real, não coberto por nenhuma fonte."
  - "Domínio 'Geração de Leads e Preparação' tem 3 frameworks diferentes (funis, canais, rastreador) mas nenhum deles foi extraído com o mesmo nível de exemplo concreto que os frameworks de sessão — mais raso, coerente com ser periférico ao propósito da mente."
