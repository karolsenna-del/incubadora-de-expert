    - "4. Oferta com Narrativa ECROI — estrutura retórica de Karol (Colapso→Reenquadramento→Ordem→Inevitabilidade), enriquecida com o detalhamento concreto de 'como mostrar o programa' de Tomás"
    - "5. Fechamento — tabela de objeções de Karol + linhas de negociação de pagamento por perfil financeiro de Tomás + disciplina de sempre executar o pitch de Lourival"
  precondicao: "Qualificação de Lead Pré-Sessão (domínio 9) já rodou antes da Etapa 1 — lead scoring (Tomás) + formulário preenchido (Karol)"
  nota: "Isto NÃO é mais 'escolha 1 dos 3 frameworks' — é uma quarta estrutura, própria do Vendedor Secreto, com proveniência rastreável passo a passo a qual expert contribuiu o quê. Precisa de confirmação final da usuária antes de virar a KB forjada."

