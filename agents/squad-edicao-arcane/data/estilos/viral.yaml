# Estilo VIRAL — Bebas Neue com palavra-chave em amarelo
# 2 linhas: top branco (60% das palavras) + bot amarelo (40% finais).
# Estilo MrBeast / TikTok pop. Usar pra hook, CTA, conteúdo de ataque.

nome: "viral"
descricao: "Bebas Neue 2 linhas: branco em cima + amarelo na palavra-chave. Estilo pop viral."
font: "Bebas Neue"
