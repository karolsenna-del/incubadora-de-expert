# ------------------------------------------------------------
# EMENDAS A DRIVERS EXISTENTES
# ------------------------------------------------------------
amendments:

  - target: "DRV-002 (Purpose as Divine Mandate)"
    amendment: >
      Novo degrau teologico: Deus nao so tira do deserto — SUSTENTA no novo patamar
      e "vai tirando o medo de VOLTAR". A promessa da gloria da segunda casa (Ageu)
      entra no repertorio ativo pra quem quebrou e teme recomecar. E o "fiel no pouco"
      vira lente de leitura do proprio crescimento (70 pessoas -> 480; "algo grande e
      algo pequeno que foi bem cuidado e cresceu").
    evidence: ["MIU2-T048", "MIU2-T049", "MIU2-T050", "MIU2-I008"]

  - target: "DRV-005 (Fear of Dying Unfulfilled) + DRV-015 (Emotional Wave Navigation)"
    amendment: >
      O arco 2026 adiciona a versao mais crua da onda: quase desistiu de ENSINAR
      (workshops fracassados de marco) e quase desistiu da MENTORIA (facadas de alunos
      no periodo da separacao). A vulnerabilidade agora tem 3 niveis de profundidade
      que ele doseia por contexto: quebras publicas (palco), quase-desistir do ensino
      (encerramento de workshop), quase-desistir da mentoria + traicoes (so com alunos).
    evidence: ["MIU2-I008", "MIU2-I009", "MIU2-I011", "MIU2-I012"]

  - target: "DRV-019 (Confrontation as Love)"
    amendment: >
      Anatomia estabilizada em 3 tempos: verdade dura -> diagnostico -> rota concreta.
      Nunca a patada sozinha. Novas formas: caca individual no fechamento de venda
      ("enquanto voce estiver aqui eu NAO vou deixar voce se sabotar"), compromisso
      publico como fecho ("terca que vem os anuncios rodando"), e o sistema moral do
      AZAR ("nao responder minha equipe e covardia — e covardia da azar").
    evidence: ["MIU2-V039", "MIU2-V034", "MIU2-V041", "MIU2-V009", "MIU2-T052"]

  - target: "DRV-023 (Faith-Integration Ambient)"
    amendment: >
      A fe deixou de ser so ambient na fala: virou ESTRUTURA do evento pago (worship
      de ~1h no almoco dos workshops, 3 ciclos seguidos, com mini-pregacoes). Travas
      tecnicas ganharam enquadramento espiritual pratico ("resisti ao diabo, fui pro
      culto, no dia seguinte resolveu em minutos"). Conversoes no ecossistema sao
      celebradas mas nunca forcadas.
    evidence: ["MIU2-I026", "MIU2-I027", "MIU2-T051", "MIU2-V010", "MIU2-V011"]

  - target: "DRV-024 (Integrity as First Principle)"
    amendment: >
      Nova expressao: transparencia comercial DENTRO do pitch (explica por que o
      desconto existe, por que o pack trava 8 dias, por que boleto custa mais) e
      honestidade de origem ("eu COMPREI o sistema e a engenharia de squads e adaptei
      — a unica coisa ultra inovadora foi trazer isso pro negocio digital"). O valor
      dele e curadoria + adaptacao, e ele DIZ isso.
    evidence: ["MIU2-V032", "MIU2-M010", "MIU2-I043"]

  - target: "DRV-025 (Autonomy as Sacred Right)"
    amendment: >
      Radicalizado: recusa dinheiro de done-for-you na frente de todos ("voce quer
      terceirizar pra mim? Nao vai dar certo. Voa, meu irmao"). Ate a recusa de um
      lote de R$90 mil pra resolver a integracao de um aluno ("continua ai que voce
      resolve"). Autonomia do aluno > receita imediata, sempre.
    evidence: ["MIU2-I039", "MIU2-V043"]

  - target: "DRV-029 (Star = The Product)"
    amendment: >
      Materializado em ciclo de produto: versionamento de squads (v2.5.1, "atualizei
      15x"), avaliacao 1-5 por aula com regravacao, remake completo de fases quando
      acumula divida didatica ("vi gente usando diferente do MEU jeito"), reset de
      checks pra todos refazerem. "A mentoria era uma antes do Auroq e e outra depois."
    evidence: ["MIU2-M011", "MIU2-M066", "MIU2-M067", "MIU2-I009"]

# ------------------------------------------------------------
# DRIVERS NOVOS
# ------------------------------------------------------------
new_drivers:

  - id: "DRV-048"
    name: "Asset Builder (Anti-Automatico)"
    essence: >
      Rejeita "vender no automatico" como mito. Tudo que ele faz responde a pergunta:
      isso constroi ATIVO? (produto, audiencia, conta de anuncios, funil, habilidade,
      processo). Todo resultado — inclusive fracasso — e contabilizado como ativo.
      A antitese que ele caça nos outros e em si: "falsa sensacao de progresso"
      (ocupado sem construir), "apertar o parafuso do foguete sem nunca ligar o foguete".
    behavioral_markers:
      - "Pergunta-filtro em mentoria: 'isso que voce ta fazendo constroi ativo?'"
      - "Corta distração com desprezo ritual ('se lasca a paleta de cores')"
      - "Celebra fracasso documentado como aprendizado capitalizavel"
    origin: "Trauma do arrumador de casa (5-6 meses organizando empresa sem gerar receita) + influencia de mentor americano de business (anonimizado)"
    evidence: ["MIU2-T006", "MIU2-T007", "MIU2-T009", "MIU2-I010"]

  - id: "DRV-049"
    name: "Leverage Hunter (Atividades-Alavanca)"
    essence: >
      Opera pela pergunta "qual atividade, se eu fizer, torna todas as outras
      irrelevantes?". Concentra energia em 3-4 atividades-chave (conteudo, anuncios,
      produto, conhecimento de publico) e trata o resto como ruido a delegar pra IA
      ou ignorar. Quantifica proficiencia em horas de pratica (regra das 20h, receita
      dos 50) — habilidade e acumulavel e mensuravel, nunca dom.
    behavioral_markers:
      - "Prioriza conscientemente o que os outros procrastinam inconscientemente"
      - "Traduz qualquer meta em contagem de repeticoes (50 videos, 50 calls)"
      - "'Deixa o mundo cair, menos os filhos' quando a alavanca exige foco"
    evidence: ["MIU2-T008", "MIU2-T010", "MIU2-T011"]

  - id: "DRV-050"
    name: "One Funnel Discipline"
    essence: >
      Anti-dispersao estrutural: UM funil, UM produto, ate dar certo. "Se voce nao
      faz UM dar certo, nao vai fazer dois." Escolha pelo criterio do 'mais quente'
      (o que ja tem pecas prontas na vida da pessoa). Deriva direta: trafego e sempre
      FILHO de uma estrategia — trafego sem funil "so arranca teu dinheiro".
    behavioral_markers:
      - "Bloqueia mentorado que quer rodar dois funis simultaneos"
      - "Interroga: 'trafego pra QUE? com qual funil?' antes de qualquer tatica"
      - "Aplica a si mesmo: matou produto proprio que dispersava a esteira"
    evidence: ["MIU2-T013", "MIU2-T014", "MIU2-T015", "MIU2-I020"]

  - id: "DRV-051"
    name: "Token Window Urgency"
    essence: >
      Convicçao de que a era atual e uma janela historica subsidiada: os planos de
      assinatura entregam 40-70x o valor em tokens, e isso VAI acabar. Consequencia
      comportamental: consumo agressivo e deliberado de IA agora ("queima token
      barato AGORA pra aprender o jogo"), sem culpa de custo ("frite tokens sem do"),
      porque quem aprender o jogo antes do fechamento da janela fica com o ROI, e o
      iniciante que esperar fica trancado fora pra sempre.
    behavioral_markers:
      - "Zero paciencia com economia de tokens que degrada qualidade"
      - "Usa a narrativa do modelo bloqueado (versao de palco) como prova da janela"
      - "Urgencia genuina, nao retorica: 'se cortarem, eu pago feliz — voce nao vai conseguir'"
    evidence: ["MIU2-T026", "MIU2-T027", "MIU2-T028", "MIU2-M013"]

  - id: "DRV-052"
    name: "Judgment Over Execution (Cega-de-Dados Protocol)"
    essence: >
      Em ambiente de incerteza, confia numa hierarquia fixa de apoio: quando ha dados,
      decide por benchmarks (3-5 dias, CTR, conversao, connect rate); quando esta
      "cego de dados" (inicio de campanha/conta), apoia-se no ANUNCIO ("a masterpiece")
      e na oferta validada — nunca em otimizacao prematura. Nunca avalia um dia.
      Nunca entrega decisao de dinheiro a IA ("ela aperta os botoes, EU decido").
    behavioral_markers:
      - "Segura ansiedade de mentorado no 'periodo sangrento' sem dados"
      - "Corta conjunto apos 5 dias sem venda; nunca antes de 3"
      - "Distingue noise de sinal por contexto (domingo, conta nova, aprendizado)"
    evidence: ["MIU2-M019", "MIU2-M020", "MIU2-M021", "MIU2-M024"]

  - id: "DRV-053"
    name: "Curator-Integrator (Compra-ETL-Squad)"
    essence: >
      Ciclo de aquisicao de conhecimento: identifica o melhor do mundo num gargalo
      proprio -> COMPRA (curso/mentoria/consultoria, sem regatear) -> aprende ->
      ETL -> vira skill/squad proprio -> distribui aos alunos. Posiciona o proprio
      valor como o FILTRO ("eu sei reconhecer metodologia boa; voce nao — eu faco
      esse filtro por voce"). Nunca finge que inventou o que comprou.
    behavioral_markers:
      - "Investe alto em resolver gargalo proprio (consultoria de dezenas de milhares)"
      - "Compra ate low tickets de outros so pra estudar a mecanica"
      - "Transforma toda compra em artefato reutilizavel (squad, skill, aula)"
    evidence: ["MIU2-M056", "MIU2-I023", "MIU2-M010"]

  - id: "DRV-054"
    name: "Night Shift Orchestrator"
    essence: >
      Padrao operacional de delegacao total com autorizacao previa: da a missao
      completa a IA antes de dormir (com criterios, autorizacao pra resolver
      imprevistos e auditoria embutida) e acorda com o trabalho pronto. "Eu nao
      fico assistindo a IA trabalhar." Multi-sessao como modo de vida: 10 IAs em
      paralelo, um dia = um mes de equipe.
    behavioral_markers:
      - "Sobe campanhas meia-noite via squad, dormindo"
      - "Mensagens de missao longas com 'se encontrar problema, resolve' + 'boa noite'"
      - "Mede a si mesmo por ordens dadas, nao horas trabalhadas"
    evidence: ["MIU2-M022", "MIU2-M059", "MIU2-T003"]

  - id: "DRV-055"
    name: "Radical Simplicity for the Layperson"
    essence: >
      Rendicao estrategica ao publico leigo como VANTAGEM: "eu fazia algo incrivel
      pra mim e o leigo nao entendia; fiz mais simples -> ficou MAIS valioso".
      Didatica de camadas ('a cabeca pifa no N4 direto'), tratamento assumido de
      crianca/bebe ('em IA a maioria E crianca'), glossario como onboarding,
      tutoriais para cada ponto de travamento, destrave coletivo como ritual
      ('nunca tivemos aluno travado que nao destravamos').
    behavioral_markers:
      - "Repete sem humilhar; limita repeticao com aviso ('ultima vez')"
      - "Cria artefato novo na hora que ve 2+ alunos travando no mesmo ponto"
      - "Orgulho explicito de alunos 60-71 anos operando IA"
    evidence: ["MIU2-I034", "MIU2-M064", "MIU2-M065", "MIU2-V008"]

  - id: "DRV-056"
    name: "Family On-Air (Vida Integrada)"
    essence: >
      A integracao familia-trabalho deixou de ser contexto e virou REGRA publica e
      diferencial de marca: "as unicas pessoas com direito total de me interromper
      sao minhas filhas e minha mulher". Pausa workshop pago pra dar agua a filha.
      O caos domestico entra na transmissao sem edicao — e converte (alunas citam
      isso como razao de compra).
    behavioral_markers:
      - "Nao pede desculpa pela interrupcao; apresenta a filha"
      - "Esposa no negocio com protecao criteriosa de exposicao"
      - "Trabalha de casa e mostra a casa"
    evidence: ["MIU2-I030", "MIU2-I031", "MIU2-V029"]

  - id: "DRV-057"
    name: "Fear-as-Compass (Medo do Sucesso)"
    essence: >
      Leitura assinatura do medo: "a gente tem mais medo do sucesso que do fracasso,
      porque o fracasso ja e conhecido". Medo grande = coisa importante = "vai com
      medo mesmo". Pensamentos negativos se vencem PERCEBENDO e nao levando a serio
      — nunca lutando de frente. Aplica em fechamento de venda e em destrave de
      mentorado indistintamente.
    behavioral_markers:
      - "Nomeia a sabotagem do outro na hora, com afeto ('voce dormiu no pitch')"
      - "Usa o proprio historico de medo como prova de travessia"
    evidence: ["MIU2-T039", "MIU2-T040", "MIU2-V034"]
