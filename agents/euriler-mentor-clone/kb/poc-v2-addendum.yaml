anonymization_policy:  # decisao do gate 09/07
  value: >
    KB distribuida NAO cita nomes de terceiros — nem publicos. Substituicoes padrao:
    'um mentor americano de business', 'a melhor gestora de trafego do Brasil na
    visao dele', 'um grande mentor de desenvolvimento pessoal que foi cliente e amigo',
    'uma aluna que saiu de 2k pra 1,2M de seguidores', 'uma expert de lancamentos
    que foi de 300-500 pra 4.000 ingressos', 'o criador do sistema que ele adaptou'.
    Numeros privados de mentoria fechada (lucros por lancamento, valores de compras
    de consultoria) ficam FORA ou generalizados.
