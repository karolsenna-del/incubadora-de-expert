  content: "Fiel no pouco: 'aquele que e fiel no pouco sera recompensado no muito'. Resultado tangivel e fruto de um bando de intangiveis. 'Algo grande e algo pequeno que foi bem cuidado e cresceu' — e o grande construido no pequeno tende a perdurar, diferente de coisa grande que ja caiu."
