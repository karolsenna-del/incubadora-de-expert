- id: "MIU2-T037"
  content: "Sindrome do cavalo branco: 95% dos experts viram a noiva esperando o principe encantado — alguem que vai acreditar, abracar e fazer o negocio dar certo. Esse principe nunca vem; quando vem, e um de tres: o FALSO (labia, toma o dinheiro), o INUTIL (boa intencao, zero resultado) ou o DESTRUIDOR (da certo por um tempo e leva embora o negocio, os leads e a autoestima). Dai vem o ciclo: exaustao -> desanimo -> descrenca -> amargura (a pessoa vira critica do digital que chama todo mundo de mentiroso)."
  category: "METHODOLOGICAL"
  tags: ["FRAMEWORK", "STORYTELLING"]
  source_id: "ws-2026-04-25"
  location: "bloco central; repetido em todos os workshops"
  confidence: 0.99
  delta: "NOVO"
  note: "O framework de dor mais poderoso do pitch atual. Solucao: ser professor + marqueteiro + empresario ao mesmo tempo, com IA resolvendo o braco."

- id: "MIU2-T038"
  content: "Peso e diferente de desconforto. O caminho do sucesso PRECISA de desconforto (medo, exposicao, ansiedade do novo). Mas existe coisa que nem e desconfortavel e PESA A ALMA — isso e sinal de base errada, de fuga do chamado. Desconforto se atravessa; peso se abandona."
  category: "OPINION"
  tags: ["FRAMEWORK", "VALUES", "TACIT"]
  source_id: "ws-2026-06-20"
  location: "~01:14"
  confidence: 0.97
  delta: "NOVO"

- id: "MIU2-T039"
  content: "A gente tem mais medo do sucesso do que do fracasso — porque o fracasso ja e conhecido: nada muda se voce ficar onde esta. O sucesso exige mudanca desconhecida, e todo desconhecido da medo. 'Quanto maior o medo, mais importante aquela coisa e pra voce. Vai com medo mesmo.'"
  category: "OPINION"
  tags: ["FRAMEWORK", "VALUES"]
  source_id: "ws-2026-06-21"
  location: "~08:56-08:57"
  confidence: 0.98
  delta: "NOVO"

- id: "MIU2-T040"
  content: "Contra pensamentos negativos ('e dificil pra mim', 'sou velho', 'nao sou da tecnologia'): a unica batalha que se vence nos pensamentos e PERCEBER o pensamento e nao levar ele a serio. Voce nao esta perdendo pra tecnologia nem pra concorrencia — esta perdendo pros seus proprios pensamentos."
  category: "METHODOLOGICAL"
  tags: ["FRAMEWORK", "TACIT"]
  source_id: "ws-2026-06-21"
