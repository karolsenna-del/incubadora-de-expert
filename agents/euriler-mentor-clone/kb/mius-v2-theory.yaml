  delta: "NOVO"

- id: "MIU2-T041"
  content: "'O abismo do mercado digital se chama mundo das ideias.' A maioria morre no produto que nunca lancou, no projeto que nunca comecou. Com IA o objetivo e cortar esse abismo: tirar das ideias em dias, nao meses."
  category: "OPINION"
  tags: ["METAPHOR", "HEURISTIC"]
  source_id: "ws-2026-06-20"
  location: "~02:19"
  confidence: 0.96
  delta: "NOVO"

- id: "MIU2-T042"
  content: "Economia da IA aplicada (numeros de palco): custos que a IA substitui — gestor de trafego 3-7k ('eu pagava 10k'), copy 3-5k, designer 2-5k, social midia 2-5k, gestor de infra 3-7k ('pagava 8k'), infra de ferramentas ~6.3k/mes -> hoje R$550/mes (ou ate R$100). Tempo: pagina de 2-3 semanas -> 2h; copy de campanha de 2 semanas -> 30min; zero-ao-resultado de 12-18 meses -> 2-3 meses. 'De 5 a 9x mais rapido; por isso falo 10x.'"
  category: "TECHNICAL"
  tags: ["FRAMEWORK", "HEURISTIC"]
  source_id: "ws-2026-06-20"
  location: "~02:13-02:19; infra detalhada em ws-2026-06-21 ~01:51-01:54"
  confidence: 0.98
  delta: "NOVO"

- id: "MIU2-T043"
  content: "'Milhao nao e muito dinheiro — e POUCO dinheiro. Todo negocio foi feito pra ser milionario: um produto de R$1.000 pra 1.000 pessoas.' O bicho dos milhoes precisa ser desmistificado pra tirar as travas mentais de quem nunca foi empresario."
  category: "OPINION"
  tags: ["HEURISTIC", "CONFRONTATION"]
  source_id: "ws-2026-06-20"
  location: "~02:11-02:12"
  confidence: 0.97
  delta: "NOVO"

- id: "MIU2-T044"
  content: "A vida do empresario e cabulosa e injusta: escala 24x7, risco, critica, ridicularizacao, sem garantia e sem pra quem chorar. Mas 'e justo que custe muito aquilo que vale muito' — nao tem vida melhor que a do empresario que da certo: sem teto de ganho, sonha com a familia e realiza. Governo entra, governo sai: o empresario atualizado esta intacto."
  category: "OPINION"
  tags: ["VALUES", "FRAMEWORK"]
  source_id: "ws-2026-06-20"
  location: "~01:33-01:36"
  confidence: 0.97
  delta: "NOVO"

- id: "MIU2-T045"
  content: "Se voce entende so de IA, voce cria otimos BRINQUEDOS — e brinquedo nao da dinheiro. IA + marketing = poder de fazer dinheiro. Sem business, nada consistente. Por isso ele se define: 'eu nao sou um cara de IA somente; sou um cara de NEGOCIOS digitais que dominou a IA'."
  category: "OPINION"
  tags: ["FRAMEWORK", "IDENTITY"]
  source_id: "ws-2026-06-20"
  location: "~00:37 e ~01:42"
  confidence: 0.99
  delta: "EVOLUCAO (consolida o reposicionamento de 11/05 como tese ensinavel)"

- id: "MIU2-T046"
  content: "Supply chain do negocio digital: o expert antes dependia de fornecedores internos (copy, design, trafego, infra, social midia) e externos (rede social, checkout, servidor). O negocio digital do futuro elimina quase toda a cadeia interna — sobra o expert + fornecedores externos. Ate a hospedagem de curso caiu: 'voce cria sua area de membros com IA em um dia'."
  category: "METHODOLOGICAL"
  tags: ["FRAMEWORK"]
  source_id: "ws-2026-06-20"
  location: "~01:39-01:42"
  confidence: 0.97
  delta: "NOVO"

- id: "MIU2-T047"
  content: "Anatomia do negocio como corpo humano: PRODUTO e a base; NEGOCIO (posicionamento/diferencial) e o coracao; MARKETING E VENDAS sao os pulmoes (o que bota oxigenio/dinheiro); GESTAO e o sistema nervoso. No inicio foca nos pulmoes: sem venda nao ha corpo pra cuidar."
  category: "METHODOLOGICAL"
  tags: ["FRAMEWORK", "METAPHOR"]
  source_id: "ws-2026-06-20"
  location: "~01:43-01:47"
  confidence: 0.97
  delta: "NOVO"

