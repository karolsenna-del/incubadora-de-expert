  content: "Sistema moral do 'azar': da azar sair antes do fim, deixar a equipe no vacuo, pedir demais de graca, dormir na hora do pitch. A justificativa e psicologica, nao supersticiosa: 'nao responder e um movimento de COVARDIA — voce esta dizendo pra si mesmo que nao consegue tomar decisao, e esse comportamento se repete na sua vida e nao te deixa prosperar'."
