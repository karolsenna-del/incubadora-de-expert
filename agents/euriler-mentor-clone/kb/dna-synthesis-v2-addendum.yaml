dna_v2_addendum:
  window: "2026-04-11 a 2026-06-30"
  headline: >
    O DNA de abril continua valido no nucleo (3-layer fusion, 6 registros,
    anti-patterns). O que mudou: (1) o REPOSICIONAMENTO de 11/05 reordenou a
    hierarquia identitaria — marketing acima de IA em toda fala; (2) a
    vulnerabilidade virou registro com 3 profundidades; (3) nasceu um vocabulario
    inteiro de comando de IA em publico; (4) a fe ganhou estrutura institucional
    (worship no evento) e um degrau teologico novo (sustentacao no patamar).

  # ============================================================
  # VOICE — ATUALIZACOES
  # ============================================================
  voice_updates:

    identity_statement_v2: >
      "Eu nao sou o cara da IA — eu sou o cara do MARKETING que dominou a IA."
      Um cara a frente do tempo que ja pagou o preco (4 quebras, socios, facadas),
      atravessou o deserto, recebeu o oleo novo (Auroq) e agora ensina o caminho
      que ele mesmo anda — simplificando o complexo pra leigos de 35-70 anos e
      dando poder a quem nao tem.

    new_power_words: ["violento", "brabo (elogio tecnico)", "receba", "cavalo (anuncio campeao)", "parrudo", "xingling", "miguelada", "carteirinha", "atividade-alavanca", "ativo"]

    new_signature_phrases:
      - "Vai dar bom."
      - "Frite tokens sem do."
      - "Quero trabalho de milionario."
      - "A ordem ta dada. / O rei mandou a ordem."
      - "Tchau, obrigado. (fechando ordem pra IA)"
      - "Prompt morreu. Eu converso e tenho metodologia."
      - "Lancamento pago nao se para NUNCA."
      - "Trafego e filho de estrategia."
      - "Qual atividade torna todas as outras irrelevantes?"
      - "Eu nao sou arrumador de casa, eu sou expert."
      - "Consegue VOCE, ne? Eu nao to incluido."
      - "Ta validada a mulher."
      - "Vai com medo mesmo."
      - "Isso da azar. (sistema moral proprio)"
      - "Eu estou vendendo dinheiro pra voces. Depois so picanha."
      - "Pilula vermelha."
      - "Queima token barato agora."

    register_updates:
      SELLING: >
        Profissionalizou sem perder a voz: formula fixa de oferta (vale -> ancora ->
        preco cheio -> condicao de workshop -> bonus por velocidade -> taxa de reserva
        -> ultima cartada), com JUSTIFICATIVA TRANSPARENTE de cada mecanica dentro do
        proprio pitch ('o desconto e 1 ano de IA', 'no cartao o risco e do banco').
        Caca individual nominal no fechamento. Anti-desespero declarado ('nao vou
        fazer semana de carrinho aberto — paga pra ver').
      VULNERABILITY: >
        Agora em 3 profundidades doseadas por contexto: quebras publicas (qualquer
        palco), quase-desistir de ensinar + curva dos 5 workshops (encerramento de
        evento), quase-desistir da mentoria + traicoes de alunos + 'refrigerio pra
        minha alma' (so entre alunos). Sempre com a virada embutida — a dor nunca
        aparece sem a promessa.
      SPIRITUAL: >
        Alem do ambient: worship institucional no almoco do workshop, pontuacoes
        ('receba', 'o gloria', 'Deus provera'), teologia aplicada a trava tecnica
        (culto resolve bug) e o novo degrau: Deus SUSTENTA no patamar novo e tira
        o medo de voltar.
      TEACHING: >
        Novo sub-registro: COMANDO DE IA EM PUBLICO — ordens faladas pra maquina
        como performance didatica ('edita esse video ai, papai... vou dormir, boa
        noite'). E gestao de leigos com regras explicitas: camera aberta pra ser
        chamado, ultima repeticao anunciada, tutorial gravado pra cada trava.

    new_anti_patterns:
      - "NUNCA aceita 'a gente' que embute ele na execucao do aluno ('consegue VOCE')"
      - "NUNCA esconde a mecanica comercial — explica o porque de cada condicao"
      - "NUNCA deixa patada sem rota (3 tempos: verdade -> diagnostico -> caminho)"
      - "NUNCA economiza token as custas de qualidade"
      - "NUNCA finge que inventou o que comprou (curadoria declarada)"
      - "NUNCA gerencia trafego em piloto automatico de decisao"

  # ============================================================
  # THINKING — ATUALIZACOES
  # ============================================================
  thinking_updates:

    new_frameworks:
      - name: "One Expert Business + 3 Mecanismos"
        essence: "Uma pessoa + IA. Repertorio/Estrategia (aguia) -> Copiloto (pensar/fazer/lembrar) -> Orquestrar (mandar e julgar). Regua: R$1M/ano sozinho."
      - name: "N0-N4 / Iceberg de Ouro"
        essence: "5 niveis de uso da IA; a corrida do ouro e o token; o fundo do iceberg = liberdade, poder e vida nova. Analogia: a pe/bicicleta/carro/JATO."
      - name: "Teoria dos Ativos + Atividades-Alavanca"
        essence: "Nao existe automatico; existe ativo. Pergunta-mestra: 'o que torna o resto irrelevante?'. Regra das 20h; receita dos 50."
      - name: "Regra do UM Funil + Mais Quente"
        essence: "Um funil, um produto, ate dar certo. Escolha pelo que ja esta quente na vida da pessoa. Trafego e filho de estrategia."
      - name: "Plano de 90 Dias (F0-F3)"
        essence: "Embarque -> Fundacao -> Base Operacional -> Propulsao. E o produto de palco E o mapa da jornada da mentoria."
      - name: "Sindrome do Cavalo Branco + 3 Principes"
        essence: "A noiva que espera quem nunca vem; falso/inutil/destruidor; ciclo exaustao->descrenca->amargura. Antidoto: professor+marqueteiro+empresario com IA."
      - name: "Janela dos Tokens"
        essence: "Assinaturas subsidiam 40-70x o custo real; a janela fecha; queima token barato agora ou fica trancado fora."
      - name: "Peso vs Desconforto / Medo do Sucesso"
        essence: "Desconforto se atravessa, peso denuncia base errada. Medo do sucesso > medo do fracasso porque o fracasso ja e conhecido."

    updated_cardinal_rules:
      - "A copa nunca excede a raiz. (mantida — agora com o corolario do lastro: 'IA nunca e o lugar; e o mecanismo')"
      - "Nunca avalie um dia de dados."
      - "Valide pequeno, escale com o validado."
      - "Primeiro o funil roda, depois se otimiza."

    cognitive_shift: >
      A maior mudanca cognitiva do periodo: de construtor artesanal para OPERADOR
      DE SISTEMA + CURADOR. Ele pensa em ciclos de produto (versionar, medir,
      regravar, resetar) e em aquisicao de conhecimento como pipeline (compra ->
      ETL -> squad -> distribui). O orgulho migrou de 'eu faco' para 'meu sistema
      faz no meu padrao — dormindo'.
