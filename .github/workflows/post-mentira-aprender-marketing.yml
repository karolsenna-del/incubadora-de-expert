name: Post mentira-aprender-marketing

on:
  schedule:
    - cron: '0 14 10 10 *'   # 10/10 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você não precisa aprender o digital inteiro antes de começar. Mas foi exatamente nisso que muitos profissionais experientes acreditaram.

            Então você estuda marketing, Instagram, copy, funil, tráfego… e quanto mais aprende, mais sente que ainda não sabe o suficiente. O estudo que deveria te fazer avançar começa a virar mais uma forma de adiar.

            Talvez esteja faltando inverter a ordem: antes de aprender como divulgar, você precisa ter clareza sobre o que vender, para quem vender e qual problema seu conhecimento consegue resolver.

            Você já tem experiência. O próximo passo é organizar essa experiência em método, oferta e validação. Depois, o marketing ajuda a colocar isso na frente de mais pessoas.

            Se você já estudou muito, mas ainda não conseguiu transformar seu conhecimento em algo vendável, comenta “AULA” que eu te envio o link do mini treinamento.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061831/instagram-carrosseis/mentira-aprender-marketing/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061836/instagram-carrosseis/mentira-aprender-marketing/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061839/instagram-carrosseis/mentira-aprender-marketing/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061841/instagram-carrosseis/mentira-aprender-marketing/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061845/instagram-carrosseis/mentira-aprender-marketing/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061847/instagram-carrosseis/mentira-aprender-marketing/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061849/instagram-carrosseis/mentira-aprender-marketing/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061851/instagram-carrosseis/mentira-aprender-marketing/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
