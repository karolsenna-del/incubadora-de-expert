name: Post quanto-mais-estudou

on:
  schedule:
    - cron: '0 15 3 7 *'   # 03/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Quanto mais você estudou, mais difícil fica vender no digital.

            Não é provocação. É o paradoxo que ninguém fala.

            O especialista sabe de mais. Quer falar de tudo. Mas a audiência não quer aprender tudo que ele sabe — quer o caminho mais curto para o resultado dela.

            E aí o digital parece ingrato. Parece que quem sabe menos vende mais.

            Às vezes vende mesmo. Porque clareza vende mais que conhecimento.

            O problema não é o quanto você estudou. É que você ainda não transformou o que viveu em método.

            Método não vem do que você aprendeu. Vem do que você viveu.

            Manda pra aquele especialista que você conhece — que sabe muito, mas ainda não transformou isso em produto.

            #incubadoradeexpert #expertdigital #metodoonline #posicionamentodigital #autoridadedigital #marcapessoal #cursoonline
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926869/instagram-carrosseis/quanto-mais-estudou/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926885/instagram-carrosseis/quanto-mais-estudou/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926887/instagram-carrosseis/quanto-mais-estudou/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926889/instagram-carrosseis/quanto-mais-estudou/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926891/instagram-carrosseis/quanto-mais-estudou/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926893/instagram-carrosseis/quanto-mais-estudou/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926896/instagram-carrosseis/quanto-mais-estudou/slide-07.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
