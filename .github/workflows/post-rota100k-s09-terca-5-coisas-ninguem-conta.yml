name: Post rota100k-s09-terca-5-coisas-ninguem-conta

on:
  schedule:
    - cron: '0 23 29 9 *'   # 29/09 às 23:00 UTC = 20h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Eu vivi as cinco. E por muito tempo achei que era só comigo.
            Não era: é o caminho de quase todo mundo que resolve transformar o que sabe em negócio.
            Marca quem precisa saber que não está sozinho.
            Me segue que eu conto o que eu fiz depois de cada uma.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571017/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571019/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571020/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571022/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571025/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571027/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571029/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1790571032/instagram-carrosseis/rota100k-s09-terca-5-coisas-ninguem-conta/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
