name: Post medo-como-calendario

on:
  schedule:
    - cron: '0 14 27 9 *'   # 27/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            "Ainda não é o momento certo." Essa frase parece racional. Você tem trabalho, filhos, responsabilidades, pouco tempo, ainda precisa organizar algumas coisas.

            Então decide esperar. Só mais um pouco.

            O problema é quando "mais um pouco" vira meses. E, durante esses meses, você continua pensando naquela ideia. Continua salvando conteúdos. Continua observando outras pessoas transformando conhecimento em produtos, métodos e ofertas.

            Continua dizendo para si mesma: "Quando eu estiver mais preparada, eu começo."

            Mas talvez exista uma pergunta mais desconfortável: Preparada para quê?

            Para ter certeza de que vai funcionar?

            Para não correr risco de perder dinheiro?

            Para não ouvir um "não"?

            Para não sentir novamente a frustração de tentar alguma coisa e não dar certo?

            Porque, se for isso… talvez você esteja esperando uma segurança que nenhuma quantidade de planejamento consegue entregar.

            E aqui está a armadilha: você espera confiança para agir, quando parte da confiança nasce justamente da ação.

            Não estou falando de apostar tudo. Nem de abandonar seu trabalho. Nem de gastar meses criando um produto inteiro. Estou falando de diminuir o tamanho do risco. Escolher um problema que você sabe resolver. Transformar seu conhecimento em uma solução simples. Conversar com pessoas que vivem esse problema. Fazer uma oferta.

            Porque uma conversa real pode ensinar mais sobre sua oferta do que semanas imaginando como ela deveria ser. Um primeiro interessado muda sua percepção. Uma primeira venda muda ainda mais.

            Você não precisa provar hoje que consegue construir um grande negócio digital.

            Precisa começar a produzir pequenas evidências de que existe um caminho.

            Se você já disse "ainda não é o momento certo", mas sabe que existe uma ideia esperando por você há tempo demais…

            comenta "AGORA".

            Você não precisa dar um salto. Só precisa parar de usar o medo como calendário.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793768/instagram-carrosseis/medo-como-calendario/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793770/instagram-carrosseis/medo-como-calendario/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793771/instagram-carrosseis/medo-como-calendario/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793772/instagram-carrosseis/medo-como-calendario/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793774/instagram-carrosseis/medo-como-calendario/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793775/instagram-carrosseis/medo-como-calendario/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793776/instagram-carrosseis/medo-como-calendario/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789793778/instagram-carrosseis/medo-como-calendario/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
