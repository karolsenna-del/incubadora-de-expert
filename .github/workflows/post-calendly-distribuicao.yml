name: Post calendly-distribuicao

on:
  schedule:
    - cron: '0 14 28 9 *'   # 28/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você não precisa virar influencer para vender na internet. Precisa construir um jeito de ser encontrado, lembrado e indicado.

            O Calendly cresceu assim. Cada vez que alguém enviava um link para marcar uma reunião, outra pessoa conhecia o produto. O próprio uso gerava distribuição.

            Essa é a parte que muita gente ignora: audiência é uma forma de distribuição. Não é a única.

            Você pode crescer por: indicação, produto, aula bônus em outros produtos, parcerias, prova social,

            comunidade e grupos que participa como aluno/cliente.

            O erro é achar que, para vender, você precisa transformar sua vida inteira em postagem. Você não precisa ser famoso. Precisa ser fácil de recomendar. Fácil de explicar. Fácil de lembrar.

            A pergunta não é: "Como eu apareço mais?"

            Mas: "Como faço meu trabalho chegar em mais pessoas sem depender só de mim?"

            Salve este post e compartilhe com quem acha que precisa virar influencer para vender no digital.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794375/instagram-carrosseis/calendly-distribuicao/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794377/instagram-carrosseis/calendly-distribuicao/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794378/instagram-carrosseis/calendly-distribuicao/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794379/instagram-carrosseis/calendly-distribuicao/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794381/instagram-carrosseis/calendly-distribuicao/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794382/instagram-carrosseis/calendly-distribuicao/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794383/instagram-carrosseis/calendly-distribuicao/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794384/instagram-carrosseis/calendly-distribuicao/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794386/instagram-carrosseis/calendly-distribuicao/slide-09.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789794387/instagram-carrosseis/calendly-distribuicao/slide-10.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
