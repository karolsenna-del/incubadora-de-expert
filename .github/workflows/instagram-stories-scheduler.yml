name: Instagram Stories Scheduler

on:
  workflow_dispatch:   # continua disponivel pra disparo manual/teste
  schedule:
    - cron: '30 13 * * *'   # 09h30 America/Cuiaba (13h30 UTC) — 2h30 de folga apos o gatilho
                             # do Expert-Stories (07h America/Cuiaba, rotina trig_01KbSchvgTKq46LyG26SCM1a),
                             # ainda dentro da janela 8h-10h da Levantada de Mao. Habilitado 23/08/2026
                             # apos teste manual completo (texto+imagem+push+publicacao real validados).

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Publicar Story(s) do dia
        env:
          META_TOKEN:              ${{ secrets.META_TOKEN }}
          IG_USER_ID:              ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME:   ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:      ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:   ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python .github/scripts/publicar_story.py

      - name: Commit log e pasta agendados
        run: |
          git config user.name "insta-scheduler[bot]"
          git config user.email "bot@incubadoradeexpert.com.br"
          git add business/instagram/stories/
          git diff --staged --quiet || git commit -m "campanha: story publicada automaticamente pelo insta-scheduler"
          git push
