name: Instagram Stories Scheduler

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug exato da pasta em stories/fila (opcional)"
        required: false
        type: string
  schedule:
    - cron: '30 13 * * *'   # 09h30 America/Cuiaba (13h30 UTC) — 2h30 de folga apos o gatilho
                             # do Expert-Stories (07h America/Cuiaba, rotina trig_01KbSchvgTKq46LyG26SCM1a),
                             # ainda dentro da janela 8h-10h da Levantada de Mao. Habilitado 23/08/2026
                             # apos teste manual completo (texto+imagem+push+publicacao real validados).
    - cron: '30 21 * * 3'   # 17h30 America/Cuiaba (21h30 UTC), so quarta — cobre a Story da live
                             # Expert360o (compromisso 15h-16h Brasilia = 14h-15h Cuiaba), que so
                             # nasce na fila depois do fim da live, fora da janela do cron matinal.
                             # Adicionado 27/08/2026 apos gap real: Story da Live 27 (26/08) so foi
                             # publicada via disparo manual porque a rodada das 9h30 rodou vazia.
                             # Script sai limpo (sys.exit(0)) se a fila ja estiver vazia — seguro
                             # rodar mesmo em quartas sem Story pendente.

permissions:
  contents: write

concurrency:
  group: instagram-stories-publisher
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          # workflow_dispatch fica preso ao SHA do disparo; usar master aqui faz
          # execucoes enfileiradas pela concurrency enxergarem a fila atualizada.
          ref: master
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Publicar Story(s) do dia
        env:
          STORY_SLUG:             ${{ inputs.slug }}
          META_TOKEN:              ${{ secrets.META_TOKEN }}
          IG_USER_ID:              ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME:   ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:      ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:   ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python .github/scripts/publicar_story.py

      - name: Commit log e pasta agendados
        run: |
          git config user.name "insta-scheduler[bot]"
          git config user.email "bot@incubadoradeexpert.com.br"
          git add -f business/instagram/stories/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança de Story para enviar."
            exit 0
          fi

          git commit -m "campanha: story publicada automaticamente pelo insta-scheduler"

          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3 de sincronizar e enviar..."
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort
              echo "ERRO: rebase com origin/master falhou; push cancelado." >&2
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "ERRO: push falhou após 3 tentativas." >&2
          exit 1
