name: Post bottura-metodo-incopiavel

on:
  schedule:
    - cron: '0 15 2 8 *'   # 02/08 às 15:00 UTC = 12h BRT (reagendado — falhou em 20/07 com erro 9007, mesma corrida assíncrona do RULE-2, fix aplicado agora)
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            A receita mais famosa dele está na internet, de graça. E o restaurante continua sendo um dos mais premiados do mundo.

            Porque nunca foi sobre a receita.

            Milhares de chefs dominam as mesmas técnicas. O que ninguém tem é a briga com a irmã pela borda crocante da lasanha, a torta de limão que caiu — a vida que virou assinatura dentro de cada prato.

            Com o teu conhecimento é igual: o que você estudou, qualquer concorrente estuda também. O que você viveu — os erros, os casos, as viradas de 15 anos de prática — é matéria-prima de um método que não existe cópia.

            Você não precisa de estrela Michelin. Precisa estruturar o que só você viveu.

            Comente GRUPO aqui embaixo que eu te adiciono nas lives semanais do meu WhatsApp fechado — é exatamente isso que eu ensino lá.

            #metodoautoral #expertdigital #autoridadedigital #incubadoradeexpert
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080485/instagram-carrosseis/bottura-metodo-incopiavel/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080487/instagram-carrosseis/bottura-metodo-incopiavel/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080488/instagram-carrosseis/bottura-metodo-incopiavel/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080489/instagram-carrosseis/bottura-metodo-incopiavel/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080491/instagram-carrosseis/bottura-metodo-incopiavel/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080492/instagram-carrosseis/bottura-metodo-incopiavel/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080493/instagram-carrosseis/bottura-metodo-incopiavel/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080495/instagram-carrosseis/bottura-metodo-incopiavel/slide-08.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
