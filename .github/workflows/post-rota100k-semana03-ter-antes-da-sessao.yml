name: Post rota100k-semana03-ter-antes-da-sessao

on:
  schedule:
    - cron: '0 23 18 8 *'   # 18/08 às 23:00 UTC = 20h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            O que eu gostaria que todo mundo soubesse antes da primeira sessão de mentoria: quem é a sua persona, e o que você pode prometer a ela de verdade. Persona e promessa formam a dupla da comunicação — a base de todo o seu posicionamento como expert. É delas que nasce o método, o conteúdo, as páginas e a copy inteira, tudo construído em cima de dor, desejo, contexto e urgência oculta. Inclui a ruminação: o pensamento que a persona repete sozinha antes de decidir. Com essa clareza — de quem você serve e do que promete no final do método — cada sessão já sai com direção. Me segue que eu te ensino a estruturar seu conhecimento em método.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934005/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934006/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934007/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934009/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934010/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934012/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934013/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786934015/instagram-carrosseis/rota100k-semana03-ter-antes-da-sessao/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
