name: Post metodo-vendavel

on:
  schedule:
    - cron: '0 14 21 9 *'   # 21/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Tem uma sensação difícil de admitir.

            Você abre o Instagram e encontra alguém ensinando algo que você domina há anos.

            A pessoa tem um método.
            Uma oferta.
            Clientes.

            E você tem experiência.

            Muita experiência.

            Só que ela continua espalhada entre anos de trabalho, histórias de clientes, anotações, processos que você criou intuitivamente e coisas que hoje parecem "óbvias" porque você já fez centenas de vezes.

            Então vem aquele pensamento:

            "Eu sei muito mais sobre isso…"

            Talvez saiba mesmo.

            Mas existe uma diferença entre saber fazer e transformar aquilo que você sabe em algo que outra pessoa consegue entender, desejar e comprar.

            E é aí que muita gente boa fica presa.

            Não porque falta conhecimento.

            Mas porque ainda não transformou experiência em uma solução clara.

            Enquanto isso, continua trabalhando, pesquisando, refinando…

            e assistindo outras pessoas ocuparem aquele espaço.

            Você não precisa virar influencer.

            Não precisa fingir uma autoridade que não tem.

            E muito menos inventar um método milagroso.

            Você precisa olhar para tudo que aprendeu e perguntar:

            Qual problema eu consigo resolver melhor hoje porque passei anos fazendo isso?

            Depois, organizar esse caminho.

            Dar estrutura.

            Dar nome.

            Transformar em oferta.

            E colocar diante de pessoas reais.

            Porque o mercado não consegue comprar tudo aquilo que está na sua cabeça.

            Primeiro, você precisa tornar o seu conhecimento comprável.

            Se você sabe que tem algo valioso, mas ainda não conseguiu transformar isso em um método claro, comenta "MÉTODO".

            E envie para aquela pessoa extremamente competente que ainda não percebeu que aquilo que ela chama de "experiência" pode se transformar em algo próprio.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790376/instagram-carrosseis/metodo-vendavel/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790377/instagram-carrosseis/metodo-vendavel/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790379/instagram-carrosseis/metodo-vendavel/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790380/instagram-carrosseis/metodo-vendavel/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790381/instagram-carrosseis/metodo-vendavel/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790383/instagram-carrosseis/metodo-vendavel/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790384/instagram-carrosseis/metodo-vendavel/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790385/instagram-carrosseis/metodo-vendavel/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
