name: Publicar 5 sinais — Vendas Secretas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publicar carrossel e verificar no Instagram
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, unicodedata
          from pathlib import Path
          import requests

          META_ROOT = "https://graph.facebook.com/v21.0"
          TOKEN = os.environ["META_TOKEN"]
          IG_ID = os.environ["IG_USER_ID"]
          CLOUD = os.environ["CLOUDINARY_CLOUD_NAME"]
          CLOUD_KEY = os.environ["CLOUDINARY_API_KEY"]
          CLOUD_SECRET = os.environ["CLOUDINARY_API_SECRET"]
          ROOT = Path("docs/producao-conteudo/karol/posts/5-sinais-ordem-errada-vendas-secretas")
          SLIDES = [ROOT / "laminas" / f"slide-{i:02}.png" for i in range(1, 8)]
          CAPTION = (ROOT / "legenda.txt").read_text(encoding="utf-8").strip()
          EXPECTED_USER = "karolsenna._"

          def norm(s):
              return unicodedata.normalize("NFKC", s or "").strip()

          def get(path, **params):
              params["access_token"] = TOKEN
              r = requests.get(f"{META_ROOT}/{path}", params=params, timeout=60)
              r.raise_for_status()
              return r.json()

          def post(path, data):
              data = dict(data)
              data["access_token"] = TOKEN
              r = requests.post(f"{META_ROOT}/{path}", data=data, timeout=60)
              if not r.ok:
                  raise RuntimeError(f"Meta {path}: HTTP {r.status_code} {r.text[:500]}")
              return r.json()

          account = get(IG_ID, fields="username")
          if account.get("username") != EXPECTED_USER:
              raise RuntimeError(f"Conta incorreta: {account.get('username')}")
          print(f"Conta confirmada: @{EXPECTED_USER}")

          recent = get(f"{IG_ID}/media", fields="id,caption,permalink", limit=25).get("data", [])
          for item in recent:
              if norm(item.get("caption")) == norm(CAPTION):
                  print("JÁ PUBLICADO")
                  print(f"PERMALINK={item.get('permalink')}")
                  raise SystemExit(0)

          if len(SLIDES) != 7 or any(not p.is_file() or p.stat().st_size == 0 for p in SLIDES):
              raise RuntimeError("Lote inválido: são necessários 7 PNGs não vazios")

          stamp = str(int(time.time()))
          urls = []
          for i, path in enumerate(SLIDES, 1):
              public_id = f"instagram-carrosseis/5-sinais-ordem-errada-vendas-secretas-{stamp}/slide-{i:02}"
              ts = int(time.time())
              sig_src = f"public_id={public_id}&timestamp={ts}{CLOUD_SECRET}"
              signature = hashlib.sha1(sig_src.encode()).hexdigest()
              with path.open("rb") as fh:
                  r = requests.post(
                      f"https://api.cloudinary.com/v1_1/{CLOUD}/image/upload",
                      data={"public_id": public_id, "api_key": CLOUD_KEY, "timestamp": ts, "signature": signature},
                      files={"file": fh}, timeout=120)
              r.raise_for_status()
              urls.append(r.json()["secure_url"])
              print(f"Slide {i}/7 hospedado")

          child_ids = []
          for i, url in enumerate(urls, 1):
              child_ids.append(post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})["id"])
              print(f"Container {i}/7 criado")
              time.sleep(2)

          carousel_id = post(f"{IG_ID}/media", {
              "media_type": "CAROUSEL",
              "children": ",".join(child_ids),
              "caption": CAPTION,
          })["id"]

          for _ in range(30):
              status = get(carousel_id, fields="status_code").get("status_code")
              if status == "FINISHED":
                  break
              if status in {"ERROR", "EXPIRED"}:
                  raise RuntimeError(f"Container terminou com {status}")
              time.sleep(5)
          else:
              raise RuntimeError("Container não ficou pronto no prazo")

          media_id = post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})["id"]
          published = get(media_id, fields="id,caption,media_type,permalink,username,children{media_url}")
          if published.get("id") != media_id:
              raise RuntimeError("ID publicado não confere")
          if published.get("username") != EXPECTED_USER:
              raise RuntimeError("Usuário publicado não confere")
          if norm(published.get("caption")) != norm(CAPTION):
              raise RuntimeError("Legenda publicada não confere")
          if published.get("media_type") != "CAROUSEL_ALBUM":
              raise RuntimeError(f"Tipo inesperado: {published.get('media_type')}")
          children = published.get("children", {}).get("data", [])
          if len(children) != 7:
              raise RuntimeError(f"Instagram devolveu {len(children)} lâminas, esperado 7")
          if not published.get("permalink"):
              raise RuntimeError("Publicação sem permalink")

          print("PUBLICADO E VERIFICADO")
          print(f"MEDIA_ID={media_id}")
          print(f"SLIDES={len(children)}")
          print(f"PERMALINK={published['permalink']}")
          PY
