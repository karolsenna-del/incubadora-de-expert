name: Post matheus-carmo-valida-antes-de-vender

on:
  schedule:
    - cron: '0 15 24 7 *'   # 24/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Até o mercado de lançamento — que vive de exposição — já descobriu o que eu ensino há anos: validar vem antes de aparecer.

            A maioria não fracassa por falta de conhecimento. Fracassa por vender o que ACHA que o público quer, sem validar antes.

            Um método de lançamento (o PQV) disse, com outras palavras, exatamente isso: valide o produto antes de produzir em volume, antes de se expor em escala.

            É a mesma lógica das Vendas Secretas — validação em ambiente controlado, sem plateia, antes de qualquer exposição pública.

            A ordem certa não é aparecer, criar audiência, e só depois vender. É validar primeiro, e escalar só o que já provou que funciona. Se você tá adiando lançar porque acha que precisa de mais seguidores — não precisa.

            Comenta AULA que eu te mando o caminho.

            #incubadoradeexpert #expertdigital #vendassecretas #posicionamentodigital #metodoonline
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653629/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653630/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653633/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653634/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653636/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653638/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653639/instagram-carrosseis/matheus-carmo-valida-antes-de-vender/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
