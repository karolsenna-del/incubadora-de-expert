name: Post rolex-preco-posiciona

on:
  schedule:
    - cron: '0 14 11 10 *'   # 11/10 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Cobrar barato nem sempre facilita a venda.

            Às vezes, só enfraquece a percepção de valor.

            Se sua solução é especializada, personalizada e resolve um problema importante, mas o preço parece de commodity, existe uma contradição.

            Por isso eu não começo pelo preço.

            Primeiro vem a persona. Depois o método. Depois a oferta.

            Quando você entende exatamente para quem é, qual problema resolve e por que sua solução é diferente, cobrar deixa de parecer um chute.

            Preço não cria autoridade sozinho.

            Mas precisa estar coerente com o valor que você construiu.

            Você não precisa ser barato para ser escolhido. Precisa fazer o cliente entender por que vale.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061867/instagram-carrosseis/rolex-preco-posiciona/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061873/instagram-carrosseis/rolex-preco-posiciona/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061882/instagram-carrosseis/rolex-preco-posiciona/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061888/instagram-carrosseis/rolex-preco-posiciona/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061892/instagram-carrosseis/rolex-preco-posiciona/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061895/instagram-carrosseis/rolex-preco-posiciona/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061899/instagram-carrosseis/rolex-preco-posiciona/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061902/instagram-carrosseis/rolex-preco-posiciona/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061908/instagram-carrosseis/rolex-preco-posiciona/slide-09.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
