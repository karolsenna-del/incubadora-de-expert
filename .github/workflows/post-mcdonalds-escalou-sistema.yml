name: Post mcdonalds-escalou-sistema

on:
  schedule:
    - cron: '0 14 9 10 *'   # 09/10 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Seu conhecimento pode ser excelente e ainda assim ser difícil de vender.

            Isso acontece quando tudo depende de você: da sua intuição, da sua experiência e do que você decide na hora.

            O McDonald’s cresceu quando transformou execução em sistema.

            Com especialistas acontece a mesma coisa.

            Quando você organiza o que sabe em etapas, critérios e ferramentas, seu conhecimento deixa de ser improviso e começa a virar método.

            E método é mais fácil de explicar, vender, aplicar e melhorar.

            Experiência resolve. Método replica.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061781/instagram-carrosseis/mcdonalds-escalou-sistema/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061787/instagram-carrosseis/mcdonalds-escalou-sistema/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061791/instagram-carrosseis/mcdonalds-escalou-sistema/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061794/instagram-carrosseis/mcdonalds-escalou-sistema/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061798/instagram-carrosseis/mcdonalds-escalou-sistema/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061800/instagram-carrosseis/mcdonalds-escalou-sistema/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061802/instagram-carrosseis/mcdonalds-escalou-sistema/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061805/instagram-carrosseis/mcdonalds-escalou-sistema/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061808/instagram-carrosseis/mcdonalds-escalou-sistema/slide-09.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
