name: Post carol-diniz-metodo-proprio

on:
  schedule:
    - cron: '0 15 22 7 *'   # 22/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Ela prometeu ensinar 2 anos de inglês em 2 meses. E fez R$6 milhões de faturamento em cima disso — não de fama, de método.

            Ela não sabe mais inglês do que qualquer outra professora formada. O que ela fez foi diferente: uniu o idioma com Programação Neurolinguística e inteligência emocional, e transformou isso numa promessa específica, batizada, mensurável.

            Não foi mais conteúdo. Foi um ângulo próprio virando estrutura.

            Conhecimento parado na sua cabeça vale R$0. Método — o que você sabe, mais o seu jeito de aplicar, mais uma promessa clara — vale muito mais que isso.

            Você também tem um jeito próprio de fazer o que faz. Só nunca deu nome a ele.

            Comenta MÉTODO que eu te mostro por onde começar.

            #incubadoradeexpert #expertdigital #metodoautoral #posicionamentodigital #metodoonline
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653596/instagram-carrosseis/carol-diniz-metodo-proprio/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653598/instagram-carrosseis/carol-diniz-metodo-proprio/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653600/instagram-carrosseis/carol-diniz-metodo-proprio/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653602/instagram-carrosseis/carol-diniz-metodo-proprio/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653604/instagram-carrosseis/carol-diniz-metodo-proprio/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653608/instagram-carrosseis/carol-diniz-metodo-proprio/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653610/instagram-carrosseis/carol-diniz-metodo-proprio/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
