name: Post desperdicio-mais-caro-carreira

on:
  schedule:
    - cron: '0 14 6 10 *'   # 06/10 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você passou anos aprendendo, trabalhando, errando, acertando e ficando cada vez melhor no que faz.

            Mas existe uma pergunta desconfortável:

            Quanto desse conhecimento já virou algo realmente seu?

            Talvez o maior desperdício não seja tentar uma ideia e ela precisar de ajustes.

            Talvez seja passar mais alguns anos acumulando experiência enquanto aquilo que poderia virar um método, uma oferta e uma nova fonte de receita continua apenas na sua cabeça.

            Você não precisa transformar tudo o que sabe em um produto.

            Precisa começar por um problema, uma transformação e uma oferta que possa ser validada.

            Seu conhecimento já existe.

            Agora ele precisa de estrutura.

            Comenta “AULA” que eu te envio o link do mini treinamento para entender como começar a transformar o que você sabe em algo seu.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061665/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061670/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061672/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061674/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061676/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061678/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061681/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791061683/instagram-carrosseis/desperdicio-mais-caro-carreira/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
