name: Post primeiras-vendas-simplificar-metodo

on:
  schedule:
    - cron: '0 15 10 8 *'   # 10/08 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Todo aluno que chega até mim quer o método completo antes de vender qualquer coisa. Cheio, redondo, sem furo.

            Minha primeira função como mentora nunca é ajudar a deixar mais completo. É simplificar.

            Porque enquanto ele constrói o método perfeito, ele não vendeu nada — e é a primeira venda (não o produto pronto) que mantém alguém no digital.

            Dinheiro não traz felicidade. Mas é o único sinal real de que seu propósito tá dando certo. Sem esse sinal, a maioria desiste antes de descobrir se estava no caminho certo.

            Comenta VENDER 👇 se você tem um método guardado na cabeça e ainda não vendeu a primeira versão dele — pra quem já confia em você, sem precisar esperar audiência.

            #incubadoradeexpert #expertdigital #metodoautoral #primeirasvendas #mentoriaindividual #feitoemelhorqueperfeito
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727093/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727094/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727096/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727097/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727099/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727102/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727103/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785727105/instagram-carrosseis/primeiras-vendas-simplificar-metodo/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
