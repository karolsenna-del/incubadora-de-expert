name: Post metodo-explicado-10-anos

on:
  schedule:
    - cron: '0 23 5 8 *'   # 05/08 às 23:00 UTC = 20h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Ontem alguém me perguntou a diferença entre conhecimento e método — e percebi que quase ninguém aprendeu isso de verdade, mesmo depois de anos estudando.

            Conhecimento é tudo que você já sabe: os cursos, as mentorias, os diplomas, a experiência acumulada. Método é outra coisa — é o caminho organizado (de preferência o atalho) que leva outra pessoa do problema dela até o resultado que ela quer.

            A confusão entre os dois é o motivo pelo qual gente com anos de bagagem ainda trava na hora de estruturar um curso, uma mentoria, um produto. Não falta conhecimento. Falta transformar esse conhecimento em caminho pra outra pessoa seguir.

            Diploma é o que você estudou. Método é o que você viveu — e organizou.

            Se você quer aprender a fazer esse corte, me segue.

            #incubadoradeexpert #expertdigital #metodoautoral #estruturademetodo #posicionamentodigital
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955318/instagram-carrosseis/metodo-explicado-10-anos/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955320/instagram-carrosseis/metodo-explicado-10-anos/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955322/instagram-carrosseis/metodo-explicado-10-anos/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955323/instagram-carrosseis/metodo-explicado-10-anos/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955325/instagram-carrosseis/metodo-explicado-10-anos/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955327/instagram-carrosseis/metodo-explicado-10-anos/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785955329/instagram-carrosseis/metodo-explicado-10-anos/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
