name: Post 6-motivos-nao-comecar-pelo-curso

on:
  schedule:
    - cron: '0 15 4 8 *'   # 04/08 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Eu sempre falei isso: não grave seu curso antes de validar o método.

            Hoje eu tô gravando o meu. E não é contradição — é a ordem certa. Meu método foi validado ano após ano, mentoria individual, sessão a sessão, aluna a aluna. Só agora que ele tá redondo é que faz sentido escalar com um produto mais barato — o curso.

            Se você ainda não passou por essa validação, pular direto pro curso não é ousadia. É gravar um palpite achando que é método.

            Comenta MENTORIA que eu te mostro por onde realmente começar.

            #incubadoradeexpert #expertdigital #mentoriaindividual #metodoonline #validaçãodemétodo #cursoonline
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630296/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630298/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630300/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630302/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630303/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630305/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630306/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630308/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630310/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-09.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785630312/instagram-carrosseis/6-motivos-nao-comecar-pelo-curso/slide-10.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
