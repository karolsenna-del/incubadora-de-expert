name: Post circo-mercado-saturado-cem-anos

on:
  schedule:
    - cron: '0 15 30 7 *'   # 30/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            O mercado de circo estava saturado. Mais de 100 anos de história, ninguém apostaria em "mais um" ali. Foi exatamente onde nasceu o Cirque du Soleil.

            Eles não inventaram uma categoria nova. Não criaram "circo 2.0". Tiraram o que sobrava — os animais, o picadeiro tradicional, o formato de sempre — e entregaram o que faltava: experiência, narrativa, estética.

            Resultado: virou um dos negócios de entretenimento mais valiosos do mundo, no mesmo mercado que todo mundo achava saturado e ultrapassado. Hoje é sinônimo de experiência premium. Ingresso high-ticket.

            "Mercado saturado" não existe. Existe gente competindo toda no mesmo nível — a técnica de sempre. Quem entrega o que falta encontra espaço, mesmo em mercado maduro.

            Quer saber exatamente o que tirar e o que entregar no seu nicho? Comenta EXPERT que eu entro em contato.

            #incubadoradeexpert #expertdigital #posicionamentodigital #metodoautoral #altoticket
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293736/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293737/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293739/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293741/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293743/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293745/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293746/instagram-carrosseis/circo-mercado-saturado-cem-anos/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
