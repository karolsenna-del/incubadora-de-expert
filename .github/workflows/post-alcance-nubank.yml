name: Post alcance-nubank

on:
  schedule:
    - cron: '0 14 23 11 *'   # 23/11 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            O Nubank tem mais de 130 milhões de clientes e começou com um produto só.

            Em 2014, enquanto os bancos ofereciam de tudo, ele lançou um cartão sem anuidade controlado pelo aplicativo. A primeira leva teve 6 mil cartões. Conta, empréstimo e investimento vieram depois.

            Muito especialista faz o caminho inverso: oferece consultoria, curso, mentoria e palestra ao mesmo tempo. E o cliente, confuso, não compra nenhum.

            Se você tivesse que escolher um único problema pra resolver muito bem, qual seria?

            Toda quarta, às 15h, eu mostro na live como escolher o primeiro problema que o seu método vai resolver. Comente LIVE que te envio o link no Direct.

            Foto: Nubank / Wikimedia Commons (CC BY-SA 4.0).
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966492/instagram-carrosseis/alcance-nubank/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966493/instagram-carrosseis/alcance-nubank/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966495/instagram-carrosseis/alcance-nubank/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966496/instagram-carrosseis/alcance-nubank/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966498/instagram-carrosseis/alcance-nubank/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966499/instagram-carrosseis/alcance-nubank/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966500/instagram-carrosseis/alcance-nubank/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966501/instagram-carrosseis/alcance-nubank/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966504/instagram-carrosseis/alcance-nubank/slide-09.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
