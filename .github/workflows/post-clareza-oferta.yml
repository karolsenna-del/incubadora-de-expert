name: Post clareza-oferta

on:
  schedule:
    - cron: '0 14 25 9 *'   # 25/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você sabe explicar seu trabalho. O problema é que talvez precise de 20 minutos para fazer isso.

            Você fala da sua experiência, dos anos de prática, das técnicas que domina, dos problemas que já resolveu, das diferentes formas como consegue ajudar. E tudo isso pode ser verdade, mas, no final, a pessoa ainda fica com uma dúvida:

            "Tá… mas o que exatamente eu compro de você?"

            Essa é uma armadilha comum de quem acumulou muito conhecimento.

            Quanto mais você sabe, mais nuances enxerga. Você vê exceções, possibilidades, caminhos diferentes, problemas conectados. Só que seu cliente não está dentro da sua cabeça. Ele não precisa compreender a dimensão inteira do seu conhecimento para tomar uma decisão.

            Ele precisa conseguir enxergar:

            "Esse é o meu problema."

            "Essa pessoa entende esse problema."

            "Existe um caminho claro para me levar até o resultado que eu quero."

            É por isso que transformar conhecimento em método não significa colocar tudo o que você sabe dentro de um produto.

            Significa organizar o que você sabe em torno de uma transformação.

            Pense numa biblioteca. Você passou anos enchendo as prateleiras.

            Agora imagine alguém entrando nessa biblioteca procurando uma resposta específica.

            Ela não precisa que você derrube todos os livros sobre a mesa.

            Ela precisa que você mostre o caminho.

            É isso que uma oferta clara faz. Ela transforma:

            "Eu sei muitas coisas" em "Eu resolvo este problema, para esta pessoa, através deste caminho."

            Talvez você não precise estudar mais para começar a vender seu conhecimento.

            Talvez precise organizar melhor aquilo que já levou anos para aprender.

            Porque conhecimento escondido na sua cabeça demonstra potencial.

            Conhecimento organizado em uma transformação clara começa a construir uma oferta.

            Se você sente que sabe muito, mas ainda não consegue explicar de forma simples o que vende e por que alguém deveria comprar, comenta "CLAREZA".

            Pode estar faltando menos conhecimento do que você imagina. E mais estrutura do que você percebe.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792922/instagram-carrosseis/clareza-oferta/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792923/instagram-carrosseis/clareza-oferta/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792924/instagram-carrosseis/clareza-oferta/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792925/instagram-carrosseis/clareza-oferta/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792927/instagram-carrosseis/clareza-oferta/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792928/instagram-carrosseis/clareza-oferta/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792930/instagram-carrosseis/clareza-oferta/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792931/instagram-carrosseis/clareza-oferta/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
