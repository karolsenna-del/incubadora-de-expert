name: Post mariana-rios-metodo-sem-lastro

on:
  schedule:
    - cron: '0 15 1 8 *'   # 01/08 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Mariana Rios lançou um curso de R$297 sobre como atrair prosperidade. A internet não reclamou do preço. Reclamou de uma coisa bem mais específica.

            Ela é casada com o herdeiro do Grupo Pão de Açúcar. E a web fez a conta: "Tudo que eu tenho, eu atraí" virou piada — porque existe uma explicação bem mais óbvia pro resultado dela.

            Resultado não prova método. Prova só que a pessoa chegou lá — o caminho pode ter sido outro.

            Autoridade não vem de mostrar resultado. Vem de mostrar o processo que qualquer pessoa, em qualquer ponto de partida, consegue repetir.

            Comenta AULA que eu te ensino a blindar teu resultado assim — mostrando processo, não só o resultado.

            #incubadoradeexpert #expertdigital #metodoautoral #posicionamentodigital #autoridadedigital
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293761/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293763/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293765/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293766/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293768/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293770/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785293772/instagram-carrosseis/mariana-rios-metodo-sem-lastro/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
