name: Post nigro-parceria-que-completa

on:
  schedule:
    - cron: '0 18 11 8 *'   # 11/08 às 18:00 UTC = 15h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Thiago Nigro não lança sozinho. Junta quem sabe lançar (Érico Rocha) com quem sabe gerir o que entra (G4, com o Grupo Primo) — cada um na própria especialidade.

            Isso não é exclusividade de quem já fatura milhões. É arquitetura de parceria — e funciona em qualquer escala.

            Na Incubadora, a gente já aplica isso na prática: tem parceiro pra tráfego, pra imagem, pra gravação. Nenhuma expert precisa dominar tudo pra entregar um método completo. Só precisa saber quem chamar pra área que não é dela.

            Se você ainda tá tentando aprender tráfego, edição e imagem pra "não depender de ninguém" — repensa. Isso não te deixa mais completa. Te deixa mais devagar.

            Comenta GRUPO 👇 que eu te levo pra rede de parceiros da Incubadora. Quem sabe rola parceria com outro expert de lá.

            #incubadoradeexpert #expertdigital #parceriaestrategica #modelodenegocio #posicionamentodigital
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330220/instagram-carrosseis/nigro-parceria-que-completa/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330222/instagram-carrosseis/nigro-parceria-que-completa/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330224/instagram-carrosseis/nigro-parceria-que-completa/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330226/instagram-carrosseis/nigro-parceria-que-completa/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330228/instagram-carrosseis/nigro-parceria-que-completa/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330230/instagram-carrosseis/nigro-parceria-que-completa/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1786330232/instagram-carrosseis/nigro-parceria-que-completa/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
