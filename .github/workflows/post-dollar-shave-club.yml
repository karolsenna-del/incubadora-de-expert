name: Post dollar-shave-club

on:
  schedule:
    - cron: '0 14 24 9 *'   # 24/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você pode ter mais experiência, mais formação, mais repertório, mais anos de mercado e ainda assim perder vendas para alguém que sabe menos.

            Isso incomoda. Mas também revela uma verdade importante: o mercado não compra automaticamente quem sabe mais.

            Ele compra quem consegue deixar claro, rápido e de forma desejável, por que aquilo importa.

            Foi isso que a Dollar Shave Club fez em um mercado dominado pela Gillette.

            Ela não tentou parecer mais sofisticada. Não tentou competir em número de patentes. Não tentou provar que entendia mais de lâminas.

            Ela simplificou a mensagem.

            É aqui que muito especialista trava: sabe muito, mas explica demais. Fala de processo, metodologia, ferramenta, experiência, certificação e esquece de responder aquilo que o cliente realmente quer saber:

            "O que isso muda para mim?"

            Clareza não diminui sua autoridade. Clareza REVELA sua autoridade.

            Porque quando você domina de verdade um assunto, consegue traduzir o complexo sem transformar sua comunicação em uma palestra.

            Talvez seu concorrente não seja melhor que você. Talvez ele só tenha aprendido a tornar o próprio valor mais fácil de entender. E no digital, quem não é entendido… raramente é escolhido.

            Salve este post e faça um teste: Tente explicar o que você vende em uma única frase. Se ficar difícil, talvez o problema não seja sua oferta, seja a forma como ela está sendo comunicada.

            Compartilhe com aquele especialista que sabe muito, mas ainda precisa aprender a mostrar isso.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792495/instagram-carrosseis/dollar-shave-club/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792497/instagram-carrosseis/dollar-shave-club/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792498/instagram-carrosseis/dollar-shave-club/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792499/instagram-carrosseis/dollar-shave-club/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792500/instagram-carrosseis/dollar-shave-club/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792502/instagram-carrosseis/dollar-shave-club/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792503/instagram-carrosseis/dollar-shave-club/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792504/instagram-carrosseis/dollar-shave-club/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792505/instagram-carrosseis/dollar-shave-club/slide-09.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789792507/instagram-carrosseis/dollar-shave-club/slide-10.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
