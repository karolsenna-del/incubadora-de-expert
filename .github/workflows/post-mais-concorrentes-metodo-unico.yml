name: Post mais-concorrentes-metodo-unico

on:
  schedule:
    - cron: '0 15 5 7 *'   # 05/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            "Já tem muita gente ensinando isso."

            Essa é a frase que para mais especialistas antes de começar.

            Mas pensa o contrário: se tem muita gente ensinando, é porque tem muita gente querendo aprender.

            Concorrência não é ameaça. É prova de que o mercado existe.

            O que diferencia não é o tema. É o método que só você poderia ter construído. Seus casos. Seus erros. Sua forma de enxergar e resolver o problema.

            Diploma é o que você estudou. Método é o que você viveu.

            E o que você viveu — ninguém viveu igual.

            Isso não tem concorrente.

            Tenho um mini treinamento mostrando como estruturar o método que só você poderia ter criado.

            Comente AULA que mando o link.

            #incubadoradeexpert #expertdigital #metodoonline #posicionamentodigital #autoridadedigital #marcapessoal #cursoonline
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926916/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926919/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926921/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926923/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926925/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926927/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782926930/instagram-carrosseis/mais-concorrentes-metodo-unico/slide-07.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
