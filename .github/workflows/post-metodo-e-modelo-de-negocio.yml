name: Post metodo-e-modelo-de-negocio

on:
  schedule:
    - cron: '0 15 9 8 *'   # 09/08 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Influencers estão desistindo de viver só de parceria paga. E o motivo prova algo que você já desconfiava: seguidor nunca foi o ativo — método é.

            Em 2026, apenas 49% ainda dependem de patrocínio de marca pra pagar conta — dez pontos a menos que em 2023.

            Pra onde foi o resto? Virou negócio próprio. 45% dos influencers em tempo integral já lançaram produto ou marca própria, faturando perto de US$100 mil por ano.

            Influência é aluguel. Você paga com atenção, mas o imóvel nunca é seu — depende do patrocinador pagar, do algoritmo entregar, da plataforma continuar existindo.

            Método é modelo de negócio. Produto, funil de vendas, autoridade — coisas que transcendem o digital e não dependem de like de ninguém.

            "Mas eu não tenho seguidores pra vender" — nem quem TEM milhões de seguidores tá apostando só nisso mais. Quem tem método sobrevive a qualquer queda de algoritmo. Quem só tem alcance, cai junto com a plataforma.

            Alcance ou método: qual dos dois você tá construindo hoje? Comenta aqui embaixo, quero ler a real da tua conta.

            #incubadoradeexpert #expertdigital #metodoautoral #modelodenegocio #autoridadedigital
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721515/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721517/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721518/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721519/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721521/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721522/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721523/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721524/instagram-carrosseis/metodo-e-modelo-de-negocio/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
