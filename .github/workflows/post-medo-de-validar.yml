name: Post medo-de-validar

on:
  schedule:
    - cron: '0 14 23 9 *'   # 23/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            "E se ninguém comprar?" Talvez essa seja a pergunta que você evita dizer em voz alta. Porque criar você consegue.

            Você consegue estudar, organizar as ideias, montar as aulas, escolher uma plataforma, criar um nome bonito.

            O problema começa quando existe a possibilidade de colocar tudo isso na frente de alguém… e ouvir um não.

            Então você tenta eliminar o risco antes de começar.

            Pesquisa mais, refina mais, planeja mais... Como se fosse possível chegar ao ponto em que você finalmente tivesse certeza: "Agora vai vender."

            Só que essa certeza não existe antes do mercado.

            E talvez você esteja tentando resolver o problema errado.

            Em vez de perguntar:

            "Como eu crio um produto tão bom que as pessoas vão comprar?"

            experimente começar por:

            "Existe alguém tentando resolver esse problema agora?"

            Converse com essas pessoas. Entenda o que elas já tentaram. Descubra como elas descrevem o problema. Faça uma oferta menor. Observe a resposta. Ajuste. E só então aumente a aposta.

            Você pode buscar sinais de demanda antes de construir tudo.

            Porque sua primeira oferta não precisa nascer gigante.

            Precisa nascer perto o suficiente do mercado para que você consiga aprender com pessoas reais — e não apenas com as hipóteses dentro da sua cabeça.

            O medo de ninguém comprar talvez nunca desapareça completamente.

            Mas existe uma diferença enorme entre apostar no escuro…e testar antes de apostar grande.

            Se você tem conhecimento para vender, mas ainda pensa "e se ninguém comprar?", comenta "VALIDAR".

            Talvez seu próximo passo não seja criar mais. Seja descobrir se alguém quer comprar.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791810/instagram-carrosseis/medo-de-validar/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791811/instagram-carrosseis/medo-de-validar/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791813/instagram-carrosseis/medo-de-validar/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791814/instagram-carrosseis/medo-de-validar/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791815/instagram-carrosseis/medo-de-validar/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791816/instagram-carrosseis/medo-de-validar/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791818/instagram-carrosseis/medo-de-validar/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789791819/instagram-carrosseis/medo-de-validar/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
