name: Post instagram-juiz-da-competencia

on:
  schedule:
    - cron: '0 23 27 10 *'   # 27/10 às 23:00 UTC = 20h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você passou anos estudando, trabalhando e construindo uma carreira. Mas basta publicar um conteúdo que quase ninguém vê para começar a questionar sua própria competência.

            Desde quando o número de visualizações virou medida do seu valor profissional?

            O problema é que muitos especialistas entram no digital acreditando que precisam conquistar milhares de seguidores antes de começar a vender. E acabam esquecendo que já possuem algo valioso: experiência real para resolver problemas reais.

            Você não precisa esperar o algoritmo reconhecer sua autoridade. Precisa transformar seu conhecimento em uma oferta clara e encontrar pessoas que precisam da sua solução.

            Poucos seguidores não significam pouco potencial de vendas. Nas Vendas Secretas, por exemplo, você pode começar criando oportunidades de conversas no 1 a 1, sem depender de uma grande audiência.

            Se você quer aprender a transformar sua experiência em um método vendável e descobrir como começar mesmo com poucos seguidores, comenta “AULA” que eu te envio o link do mini treinamento.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959504/instagram-carrosseis/instagram-juiz-da-competencia/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959505/instagram-carrosseis/instagram-juiz-da-competencia/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959506/instagram-carrosseis/instagram-juiz-da-competencia/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959507/instagram-carrosseis/instagram-juiz-da-competencia/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959509/instagram-carrosseis/instagram-juiz-da-competencia/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959510/instagram-carrosseis/instagram-juiz-da-competencia/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959512/instagram-carrosseis/instagram-juiz-da-competencia/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959513/instagram-carrosseis/instagram-juiz-da-competencia/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
