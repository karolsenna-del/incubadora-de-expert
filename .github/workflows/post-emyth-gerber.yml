name: Post emyth-gerber

on:
  schedule:
    - cron: '0 14 20 9 *'   # 20/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você pode ter 10 anos de experiência e ainda assim parecer "igual a todo mundo" no digital.

            Não porque falta conhecimento.

            Mas porque o mercado ainda não consegue enxergar como o seu conhecimento funciona.

            Existe uma diferença enorme entre saber fazer algo e transformar aquilo em um processo que outra pessoa consegue entender, desejar e comprar.

            Quando sua experiência está apenas na sua cabeça, você vende horas, sessões, consultorias e acompanhamento.

            Quando você organiza essa experiência em etapas, princípios, mecanismos e uma lógica própria…

            você começa a construir um método autoral.

            E isso muda a percepção.

            Você deixa de ser:

            "mais um profissional que sabe fazer."

            E começa a ser:

            "a pessoa que criou uma forma específica de chegar naquele resultado."

            Talvez o próximo passo da sua carreira não seja fazer outro curso.

            Talvez seja sentar, olhar para tudo o que você aprendeu nos últimos anos e perguntar:

            "Qual é o processo que eu faço naturalmente e ainda nunca transformei em método?"

            Porque experiência gera resultado.

            Mas experiência organizada pode gerar propriedade intelectual, posicionamento e negócio.

            Salve este post para revisitar quando estiver estruturando sua oferta.

            E compartilhe com alguém que sabe MUITO, mas ainda não percebeu o valor comercial do próprio conhecimento.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790024/instagram-carrosseis/emyth-gerber/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790025/instagram-carrosseis/emyth-gerber/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790026/instagram-carrosseis/emyth-gerber/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790027/instagram-carrosseis/emyth-gerber/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790029/instagram-carrosseis/emyth-gerber/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790030/instagram-carrosseis/emyth-gerber/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790031/instagram-carrosseis/emyth-gerber/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790032/instagram-carrosseis/emyth-gerber/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1789790033/instagram-carrosseis/emyth-gerber/slide-09.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
