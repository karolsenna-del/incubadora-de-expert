name: Instagram Scheduler

on:
  schedule:
    - cron: '0 15 25 6 *'   # 25/06 12h BRT — diploma-vs-vivencia
    - cron: '0 15 26 6 *'   # 26/06 12h BRT — duas-pos-graduacoes
    - cron: '0 15 27 6 *'   # 27/06 12h BRT — medo-parecer-amadora
    - cron: '0 15 28 6 *'   # 28/06 12h BRT — nao-precisa-seguidores
    - cron: '0 15 29 6 *'   # 29/06 12h BRT — sabe-demais-paralisando
  workflow_dispatch:          # permite disparar manualmente para testar

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Publicar carrossel do dia
        env:
          META_TOKEN:              ${{ secrets.META_TOKEN }}
          IG_USER_ID:              ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME:   ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:      ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:   ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python .github/scripts/publicar.py

      - name: Commit log e pasta agendados
        run: |
          git config user.name "insta-scheduler[bot]"
          git config user.email "bot@incubadoradeexpert.com.br"
          git add business/instagram/
          git diff --staged --quiet || git commit -m "campanha: carrossel publicado automaticamente pelo insta-scheduler"
          git push
