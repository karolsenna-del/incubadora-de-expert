name: Post cinco-perguntas-travada

on:
  schedule:
    - cron: '0 15 11 7 *'   # 11/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            5 perguntas rápidas. Se você responder SIM pra 2 ou mais, o problema nunca foi
            falta de competência — foi nunca ter estruturado o que você já sabe em método.

            Comenta AULA que eu te envio o primeiro passo pra sair do ciclo de "quase comecei".

            #metododevida #conhecimentoinvisivel #expertdigital #incubadoradeexpert
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560735/instagram-carrosseis/cinco-perguntas-travada/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560736/instagram-carrosseis/cinco-perguntas-travada/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560738/instagram-carrosseis/cinco-perguntas-travada/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560740/instagram-carrosseis/cinco-perguntas-travada/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560741/instagram-carrosseis/cinco-perguntas-travada/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560743/instagram-carrosseis/cinco-perguntas-travada/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560745/instagram-carrosseis/cinco-perguntas-travada/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783560746/instagram-carrosseis/cinco-perguntas-travada/slide-08.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
