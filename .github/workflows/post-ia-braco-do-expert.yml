name: Post ia-braco-do-expert

on:
  schedule:
    - cron: '0 15 13 7 *'   # 13/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            O gargalo do especialista nunca foi criar conteúdo. Foi estruturar conhecimento em método.

            Eu uso IA pra isso — pra acelerar o raciocínio, não pra substituir o que eu sei.

            Uma aluna me disse: "Fiquei conversando com teu agente e estou sentindo o esclarecimento que desejava há 9 anos."

            9 anos de dúvida resolvidos numa conversa bem estruturada.

            Comenta AULA que eu te mostro como uso IA pra estruturar método — não pra fingir que você não precisa de um.

            #incubadoradeexpert #expertdigital #inteligenciaartificial #iaparaempreender #metodoonline #estruturadeconhecimento
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813462/instagram-carrosseis/ia-braco-do-expert/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813465/instagram-carrosseis/ia-braco-do-expert/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813467/instagram-carrosseis/ia-braco-do-expert/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813470/instagram-carrosseis/ia-braco-do-expert/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813473/instagram-carrosseis/ia-braco-do-expert/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813476/instagram-carrosseis/ia-braco-do-expert/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813478/instagram-carrosseis/ia-braco-do-expert/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783813481/instagram-carrosseis/ia-braco-do-expert/slide-08.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
