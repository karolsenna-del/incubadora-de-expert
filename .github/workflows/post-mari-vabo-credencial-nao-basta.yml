name: Post mari-vabo-credencial-nao-basta

on:
  schedule:
    - cron: '0 15 23 7 *'   # 23/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Duas pessoas com o mesmo diploma. Uma ganha a média da profissão — na casa dos R$4 mil por mês. A outra construiu um negócio de milhões.

            A diferença não tá no diploma.

            Ela é bióloga, estuda comportamento humano com base científica — mesma formação de milhares de colegas. O que ela fez diferente foi dar nome ao próprio método: "Instinto Primitivo" não é termo de neurociência, é dela.

            Resultado: mais de 180 mil alunas. Não foi a formação que trouxe esse número. Foi o método com nome.

            Credencial dá lastro. Método com nome dá negócio. E isso não vale só pra biologia — vale pra qualquer especialista: psicóloga, advogada, contadora, nutricionista. Diploma não é o teto. Também não devia ser.

            Comenta MÉTODO que eu te mostro por onde começar.

            #incubadoradeexpert #expertdigital #metodoautoral #posicionamentodigital #autoridadedigital
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653612/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653616/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653619/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653620/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653622/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653624/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784653626/instagram-carrosseis/mari-vabo-credencial-nao-basta/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
