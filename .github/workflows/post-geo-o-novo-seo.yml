name: Post geo-o-novo-seo

on:
  schedule:
    - cron: '0 15 7 8 *'   # 07/08 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            A OpenAI já lançou uma plataforma de anúncio dentro do próprio ChatGPT. Se empresa já paga pra aparecer lá dentro, você devia estar preocupada em aparecer de graça.

            Você passou anos brigando por posição no Google. Essa briga já mudou de forma — e quase ninguém percebeu. A busca não devolve mais lista de link. Devolve 1 resposta pronta, gerada por IA. E só quem é citável aparece dentro dela.

            35% dos consumidores já usam IA pra descobrir o que comprar. Só 13,6% ainda fazem do jeito antigo, digitando no Google.

            Citável é quem tem método com nome. Genérico não é citado — nem por humano, nem por máquina.

            O mercado de otimização pra IA vai crescer 43% ao ano até 2026. Quem entrar agora, entra sem concorrência. Quem esperar, compete com todo mundo de uma vez.

            Testa agora, rapidinho: pergunta pra uma IA sobre o teu nicho. Ela te citou? Comenta aqui o resultado.

            #incubadoradeexpert #expertdigital #geo #buscaporia #posicionamentodigital
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721492/instagram-carrosseis/geo-o-novo-seo/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721494/instagram-carrosseis/geo-o-novo-seo/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721495/instagram-carrosseis/geo-o-novo-seo/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721496/instagram-carrosseis/geo-o-novo-seo/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721498/instagram-carrosseis/geo-o-novo-seo/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721499/instagram-carrosseis/geo-o-novo-seo/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1785721501/instagram-carrosseis/geo-o-novo-seo/slide-07.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
