name: Post nao-quero-ser-amadora

on:
  schedule:
    - cron: '0 15 19 7 *'   # 19/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            "Não quero me sentir iniciante e amadora novamente."

            Se essa frase já passou pela tua cabeça, presta atenção: isso não é medo de câmera. É o peso de ter uma reputação inteira construída no offline — e a sensação de que um passo em falso no digital coloca tudo em risco.

            O mercado te empurra pro palco: "grava, aparece, lança". Mas ninguém te conta que existe uma etapa antes.

            Validar em ambiente controlado. Testar o preço, treinar o pitch, ouvir objeção real, fazer as primeiras vendas — sem algoritmo, sem plateia, sem risco pra imagem que você levou anos pra construir.

            Valida primeiro. Aparece depois. Nessa ordem.

            Comente GRUPO aqui embaixo que eu te adiciono nas lives semanais do meu WhatsApp fechado.

            #expertdigital #especialistas #autoridadedigital #incubadoradeexpert
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080497/instagram-carrosseis/nao-quero-ser-amadora/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080499/instagram-carrosseis/nao-quero-ser-amadora/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080500/instagram-carrosseis/nao-quero-ser-amadora/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080502/instagram-carrosseis/nao-quero-ser-amadora/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080503/instagram-carrosseis/nao-quero-ser-amadora/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080505/instagram-carrosseis/nao-quero-ser-amadora/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080506/instagram-carrosseis/nao-quero-ser-amadora/slide-07.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
