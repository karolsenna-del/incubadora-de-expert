name: Post julia-child

on:
  schedule:
    - cron: '0 15 2 7 *'   # 02/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:         # permite acionar manualmente se necessário

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Dez anos. Em silêncio.

            Sem audiência. Sem câmera. Sem ninguém validando.

            Só ela, as receitas e as parceiras — testando, errando, ajustando.

            O mundo conheceu Julia Child em 1963, na TV.

            Pensaram que ela sempre soube o que estava fazendo.

            Não soube. Ela construiu antes de aparecer.

            Existe algo sendo construído em você há anos. Consultas acumuladas. Atendimentos. Casos. Sabedoria que ainda não tem nome nem estrutura.

            Você não é invisível porque falta algo.

            É porque o que você viveu ainda não virou método.

            Tenho um mini treinamento mostrando como fazer isso em 90 dias.

            Comente AULA que mando o link.

            #incubadoradeexpert #expertdigital #metodoonline #posicionamentodigital #autoridadedigital #marcapessoal #cursoonline
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN     = os.environ["META_TOKEN"]
          IG_ID     = os.environ["IG_USER_ID"]
          CAPTION   = os.environ["CAPTION"].strip()
          BASE      = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846080/instagram-carrosseis/julia-child/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846082/instagram-carrosseis/julia-child/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846084/instagram-carrosseis/julia-child/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846085/instagram-carrosseis/julia-child/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846087/instagram-carrosseis/julia-child/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846088/instagram-carrosseis/julia-child/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1782846091/instagram-carrosseis/julia-child/slide-07.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          # 1. Item containers
          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          # 2. Carousel container
          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          # 3. Publicar
          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
