name: Post alcance-cacau-show

on:
  schedule:
    - cron: '0 14 19 11 *'   # 19/11 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            A Cacau Show passou mais de 12 anos sem uma loja própria. E talvez seja por isso que ela tem mais de 4,6 mil hoje.

            Em 1988, um garoto de 17 anos aceitou um pedido de 2 mil ovos de Páscoa sem ter fábrica. Entregou, aprendeu fazendo e continuou vendendo de pessoa em pessoa por anos, antes de abrir a primeira porta.

            Muito especialista faz o caminho inverso: grava o curso, monta o site, cria a logo e só depois descobre se alguém quer comprar. A estrutura vira desculpa para não ouvir o primeiro “não”.

            Quantos meses você já passou preparando algo que ainda não ofereceu para ninguém?

            Toda quarta, às 15h, eu mostro na live como validar o seu método antes de investir em estrutura. Comente LIVE que te envio o link no Direct.

            Foto: Eduardo P / Wikimedia Commons (CC BY-SA 4.0).
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966442/instagram-carrosseis/alcance-cacau-show/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966444/instagram-carrosseis/alcance-cacau-show/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966446/instagram-carrosseis/alcance-cacau-show/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966447/instagram-carrosseis/alcance-cacau-show/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966449/instagram-carrosseis/alcance-cacau-show/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966450/instagram-carrosseis/alcance-cacau-show/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966451/instagram-carrosseis/alcance-cacau-show/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966452/instagram-carrosseis/alcance-cacau-show/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1794966454/instagram-carrosseis/alcance-cacau-show/slide-09.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
