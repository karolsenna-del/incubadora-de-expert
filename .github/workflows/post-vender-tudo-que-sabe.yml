name: Post vender-tudo-que-sabe

on:
  schedule:
    - cron: '0 23 31 10 *'   # 31/10 às 23:00 UTC = 20h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Você passou anos acumulando conhecimento. Mas, quando tenta transformar tudo isso em um produto, quer ensinar absolutamente tudo. E é aí que trava.

            Seu cliente não quer comprar uma enciclopédia. Quer resolver um problema.

            Quanto mais aulas, módulos e bônus você acrescenta sem uma direção clara, mais distante pode ficar de lançar sua primeira oferta.

            O segredo não é ensinar tudo que você sabe. É selecionar o que realmente importa e organizar sua experiência em um método que conduza alguém a uma transformação específica.

            Você não precisa criar o produto mais completo do mercado. Precisa criar uma solução clara, relevante e que as pessoas estejam dispostas a comprar.

            Comenta “AULA” que eu te envio o link do mini treinamento para aprender a transformar seu conhecimento em um método autoral e vendável.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959546/instagram-carrosseis/vender-tudo-que-sabe/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959547/instagram-carrosseis/vender-tudo-que-sabe/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959549/instagram-carrosseis/vender-tudo-que-sabe/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959550/instagram-carrosseis/vender-tudo-que-sabe/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959551/instagram-carrosseis/vender-tudo-que-sabe/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959552/instagram-carrosseis/vender-tudo-que-sabe/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959554/instagram-carrosseis/vender-tudo-que-sabe/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1792959555/instagram-carrosseis/vender-tudo-que-sabe/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
