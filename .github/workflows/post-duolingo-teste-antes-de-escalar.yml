name: Post duolingo-teste-antes-de-escalar

on:
  schedule:
    - cron: '0 14 11 9 *'   # 11/09 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            O mercado não premia quem planeja mais. Premia quem aprende mais rápido.

            Teste pequeno, observe a resposta e escale o que já provou funcionar.
            Validar antes de crescer não é cautela. É inteligência.
            E muita gente ainda está fazendo o caminho ao contrário. Compartilhe com alguém que está tentando construir tudo antes de validar.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898904/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898906/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898908/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898910/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898911/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898914/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898916/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898918/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-08.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1788898920/instagram-carrosseis/duolingo-teste-antes-de-escalar/slide-09.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
