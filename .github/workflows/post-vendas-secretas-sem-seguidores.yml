name: Post vendas-secretas-sem-seguidores

on:
  schedule:
    - cron: '0 14 14 10 *'   # 14/10 às 14:00 UTC = 11h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Talvez você esteja culpando o número de seguidores pela falta de vendas. “Quando minha audiência crescer, eu vendo.” Mas existe algo que você pode fazer antes disso: conversar diretamente com pessoas que têm o problema que você resolve.

            Eu chamo isso de Vendas Secretas. No 1 a 1, você conquista algo que o feed dificilmente entrega: tempo e atenção exclusiva do potencial cliente. Você pode ouvir, entender a dor, descobrir objeções e apresentar sua solução dentro daquele contexto.

            Você não precisa esperar 10 mil pessoas prestarem atenção em você. Pode começar conquistando a atenção das pessoas certas, uma de cada vez.

            E essas conversas ainda ajudam você a validar sua oferta e entender melhor o mercado antes de investir energia tentando construir uma grande audiência.

            Se você quer aprender a transformar seu conhecimento em uma oferta e começar a vender mesmo sem milhares de seguidores, comenta “AULA” que eu te envio o link do mini treinamento.
        run: |
          python3 - <<'EOF'
          import os, time, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062027/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062034/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062037/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062041/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062043/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062045/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062047/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1791062049/instagram-carrosseis/vendas-secretas-sem-seguidores/slide-08.png"
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for i, url in enumerate(SLIDES):
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
            if i < len(SLIDES) - 1:
              time.sleep(2)
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Aguardando container ficar pronto...")
          for tentativa in range(20):
            r = requests.get(f"{BASE}/{carousel_id}", params={"fields": "status_code", "access_token": TOKEN})
            status = r.json().get("status_code", "UNKNOWN")
            if status == "FINISHED":
              print(f"container pronto ({tentativa+1} checagens)")
              break
            if status == "ERROR":
              raise RuntimeError("Container falhou com status ERROR")
            time.sleep(5)
          else:
            raise RuntimeError("Container não ficou FINISHED após 100s")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
