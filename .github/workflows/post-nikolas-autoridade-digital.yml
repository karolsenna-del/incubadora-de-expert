name: Post nikolas-autoridade-digital

on:
  schedule:
    - cron: '0 15 15 7 *'   # 15/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Fui ver de perto o político mais seguido do Brasil falar sobre posicionamento no digital.

            E antes de qualquer coisa: esse post não é sobre política — é sobre comunicação. Concordando ou não com ele, o fenômeno é um estudo de caso.

            O que mais me marcou: ele não venceu por credencial. Venceu por clareza e consistência. Sabia o que defendia e comunicou isso todo dia, do jeito dele, até virar referência.

            É o mesmo jogo do especialista que quer sair da invisibilidade — e você começa com mais bagagem do que ele tinha.

            Se você quer estruturar teu método autoral e comunicar com essa clareza, comenta INCUBADORA que eu te chamo na DM.

            #posicionamentodigital #autoridadedigital #expertdigital #incubadoradeexpert
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080472/instagram-carrosseis/nikolas-autoridade-digital/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080473/instagram-carrosseis/nikolas-autoridade-digital/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080475/instagram-carrosseis/nikolas-autoridade-digital/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080476/instagram-carrosseis/nikolas-autoridade-digital/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080478/instagram-carrosseis/nikolas-autoridade-digital/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080480/instagram-carrosseis/nikolas-autoridade-digital/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080481/instagram-carrosseis/nikolas-autoridade-digital/slide-07.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1784080482/instagram-carrosseis/nikolas-autoridade-digital/slide-08.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
