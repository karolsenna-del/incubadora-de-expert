name: Post renda-presa-ao-tempo

on:
  schedule:
    - cron: '0 15 14 7 *'   # 14/07 às 15:00 UTC = 12h BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar carrossel via Meta Graph API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841437530973593"
          CAPTION: |
            Tem um tipo de cansaço que não passa com férias.

            É o cansaço de saber que, se você parar, tudo para junto. A renda, a entrega, o negócio — tudo depende de você estar lá, presente, dando o corpo.

            E aí vem aquela culpa esquisita: "mas eu ganho bem, do que eu tô reclamando?"

            Você não tá reclamando. Você tá percebendo um teto. E perceber é o primeiro passo pra romper com ele.

            O que vira o jogo não é trabalhar mais, nem cobrar mais caro até o mercado não aguentar. É deixar de ser a única peça que faz a máquina girar.

            👉 Comenta AULA que eu te mostro o primeiro passo pra transformar o que você já sabe num ativo — em vez de mais uma sessão na sua agenda.
        run: |
          python3 - <<'EOF'
          import os, requests, urllib.parse as up

          TOKEN   = os.environ["META_TOKEN"]
          IG_ID   = os.environ["IG_USER_ID"]
          CAPTION = os.environ["CAPTION"].strip()
          BASE    = "https://graph.facebook.com/v21.0"

          SLIDES = [
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814620/instagram-carrosseis/renda-presa-ao-tempo/slide-01.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814623/instagram-carrosseis/renda-presa-ao-tempo/slide-02.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814626/instagram-carrosseis/renda-presa-ao-tempo/slide-03.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814629/instagram-carrosseis/renda-presa-ao-tempo/slide-04.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814632/instagram-carrosseis/renda-presa-ao-tempo/slide-05.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814635/instagram-carrosseis/renda-presa-ao-tempo/slide-06.png",
            "https://res.cloudinary.com/drvy4cz5x/image/upload/v1783814637/instagram-carrosseis/renda-presa-ao-tempo/slide-07.png",
          ]

          def meta_post(path, data):
            r = requests.post(f"{BASE}/{path}", params={"access_token": TOKEN},
                              data=up.urlencode(data).encode("utf-8"),
                              headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"{path}: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
            return r.json()

          print("Criando item containers...")
          item_ids = []
          for url in SLIDES:
            resp = meta_post(f"{IG_ID}/media", {"image_url": url, "is_carousel_item": "true"})
            item_ids.append(resp["id"])
          print(f"{len(item_ids)} containers criados")

          print("Criando carousel container...")
          resp = meta_post(f"{IG_ID}/media", {
            "media_type": "CAROUSEL",
            "children":   ",".join(item_ids),
            "caption":    CAPTION,
            "published":  "false",
          })
          carousel_id = resp["id"]
          print(f"carousel_id: {carousel_id}")

          print("Publicando...")
          resp = meta_post(f"{IG_ID}/media_publish", {"creation_id": carousel_id})
          print(f"PUBLICADO: {resp}")
          EOF
