<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefing do Agente de IA — Incubadora de Expert</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap');

:root{
  --ink:#0B0B0C;
  --ink-2:#151517;
  --ink-3:#1C1C1F;
  --paper:#FFFFFF;
  --fog:#F4F4F5;
  --mist:#D4D4D8;
  --ash:#71717A;
  --line:#3F3F46;
  --ember:#FF6B1A;
  --ember-dark:#E85A0D;
  --ember-wash: rgba(255,107,26,0.10);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --dur:220ms;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.progress-track{
  position:fixed;
  top:0;left:0;right:0;
  height:2px;
  background:var(--line);
  z-index:20;
}
.progress-fill{
  height:100%;
  width:0%;
  background:var(--ember);
  transition:width .45s ease;
}

.chrome{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:clamp(16px,3vw,28px) clamp(20px,5vw,56px) 0;
  flex-shrink:0;
}
.wordmark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:0.8125rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--mist);
}
.chrome-right{
  display:flex;
  align-items:center;
  gap:16px;
}
.stepcount{
  font-variant-numeric:tabular-nums;
  font-size:0.75rem;
  letter-spacing:0.06em;
  color:var(--ash);
}
.restart{
  font-size:0.75rem;
  color:var(--ash);
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0;
  text-decoration:underline;
  text-decoration-color:transparent;
  transition:text-decoration-color var(--dur) ease, color var(--dur) ease;
}
.restart:hover{color:var(--mist);text-decoration-color:var(--ash);}

main#stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px clamp(20px,5vw,56px) 64px;
}

.screen{
  width:100%;
  max-width:640px;
  animation:enter var(--dur) ease-out;
}
@keyframes enter{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@media (prefers-reduced-motion:reduce){
  .screen{animation:none;}
  .progress-fill{transition:none;}
}

.eyebrow{
  font-family:var(--font-display);
  font-weight:600;
  font-size:0.75rem;
  letter-spacing:0.10em;
  text-transform:uppercase;
  color:var(--ember);
  margin-bottom:14px;
}
.qmeta{
  font-size:0.8125rem;
  letter-spacing:0.04em;
  color:var(--ash);
  margin-bottom:14px;
  font-variant-numeric:tabular-nums;
}
.qhelp{
  font-size:0.9375rem;
  font-style:italic;
  line-height:1.6;
  color:var(--ash);
  max-width:56ch;
  margin-bottom:22px;
}

.screen.intro h1, .screen.outro h1{
  font-size:clamp(2rem,4.4vw + 1rem,3.125rem);
  font-weight:700;
  line-height:1.08;
  color:var(--paper);
  margin-bottom:22px;
}
.screen.section h2, .screen.question h2{
  font-size:clamp(1.5rem,2.6vw + 1rem,2.125rem);
  font-weight:600;
  line-height:1.2;
  color:var(--paper);
  margin-bottom:28px;
}

.lede{
  font-size:1.0625rem;
  line-height:1.65;
  color:var(--mist);
  max-width:52ch;
}
.lede.small{
  font-size:0.9375rem;
  color:var(--ash);
  margin-top:14px;
}

.btn-primary{
  display:inline-block;
  font-family:var(--font-display);
  font-weight:600;
  font-size:0.9375rem;
  letter-spacing:0.01em;
  color:var(--ink);
  background:var(--ember);
  border:1px solid var(--ember);
  border-radius:3px;
  padding:15px 26px;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  transition:background var(--dur) ease, border-color var(--dur) ease, opacity var(--dur) ease, transform var(--dur) ease;
}
.btn-primary:hover:not(:disabled){background:var(--ember-dark);border-color:var(--ember-dark);}
.btn-primary:active:not(:disabled){transform:translateY(1px);}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;}

.btn-ghost{
  display:inline-block;
  font-family:var(--font-body);
  font-weight:500;
  font-size:0.875rem;
  color:var(--mist);
  background:none;
  border:1px solid var(--line);
  border-radius:3px;
  padding:13px 22px;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  transition:border-color var(--dur) ease, color var(--dur) ease;
}
.btn-ghost:hover{border-color:var(--ash);color:var(--paper);}

.screen.intro .btn-primary{margin-top:34px;}

.actions{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:34px;
  flex-wrap:wrap;
}

.hint{
  margin-top:16px;
  font-size:0.75rem;
  color:var(--ash);
}

.field-text, .field-textarea{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1.5px solid var(--line);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:1.25rem;
  line-height:1.5;
  padding:8px 2px 14px;
  transition:border-color var(--dur) ease;
  resize:vertical;
}
.field-text:focus, .field-textarea:focus{
  border-color:var(--ember);
  outline:none;
}
.field-text::placeholder, .field-textarea::placeholder{color:var(--ash);}
.field-textarea{min-height:110px;}
.field-textarea.essay{min-height:200px;}

.choices{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.choice{
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  width:100%;
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:3px;
  color:var(--fog);
  font-size:1rem;
  padding:16px 18px;
  cursor:pointer;
  transition:border-color var(--dur) ease, background var(--dur) ease, color var(--dur) ease;
}
.choice:hover{border-color:var(--ash);}
.choice .mark{
  flex-shrink:0;
  width:18px;height:18px;
  border-radius:50%;
  border:1.5px solid var(--ash);
  position:relative;
  transition:border-color var(--dur) ease;
}
.choice.selected{border-color:var(--ember);background:var(--ember-wash);color:var(--paper);}
.choice.selected .mark{border-color:var(--ember);}
.choice.selected .mark::after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--ember);
}

.files-wrap{display:flex; flex-direction:column; gap:12px;}
.file-btn{align-self:flex-start; padding:12px 20px; font-size:0.875rem;}
.file-list{display:flex; flex-direction:column; gap:6px;}
.file-row{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--ink-2); border:1px solid var(--line); border-radius:3px; padding:9px 13px; font-size:0.85rem; color:var(--fog);}
.file-remove{background:none; border:none; color:var(--ash); font-size:0.75rem; cursor:pointer; text-decoration:underline; padding:0;}
.file-remove:hover{color:var(--ember);}

.review{
  margin-top:40px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.review summary{
  cursor:pointer;
  font-size:0.875rem;
  color:var(--ash);
  letter-spacing:0.02em;
}
.review summary:hover{color:var(--mist);}
.review dl{
  margin-top:18px;
  display:grid;
  gap:14px;
}
.review dt{
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ash);
  margin-bottom:4px;
}
.review dd{
  margin:0;
  font-size:0.9375rem;
  color:var(--fog);
  line-height:1.5;
}

.status-msg{
  font-size:0.8125rem;
  color:var(--ash);
  margin-top:10px;
}
.status-msg.ok{color:var(--ember);}

.error-msg{
  font-size:0.8125rem;
  color:var(--ember);
  margin-top:10px;
  min-height:1em;
}

@media (max-width:520px){
  .actions{flex-direction:column;align-items:stretch;}
  .btn-primary, .btn-ghost{width:100%;text-align:center;}
}
</style>
</head>
<body>
<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <header class="chrome">
    <span class="wordmark">Incubadora de Expert</span>
    <div class="chrome-right">
      <span class="stepcount" id="stepCount"></span>
      <button class="restart" id="restartBtn" type="button">recomeçar</button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<script>
(function(){
  "use strict";

  var SHEETS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxSaQmv0MMiNgNP_8--rd1P3jzFmXQKiyZ0ztlKzKbcD9cKHsr3IM105ioLvHpzlcAvwQ/exec";
  var STORAGE_KEY = "agente-ia-briefing-v1";

  var SECTIONS = [
    {num:"01", title:"Sobre você", note:"Pra eu te chamar certo e te responder no WhatsApp."},
    {num:"02", title:"Sobre o agente", note:"O que ele é e pra quem ele existe."},
    {num:"03", title:"O que ele precisa saber", note:"O conhecimento que vai virar a base dele."},
    {num:"04", title:"Como ele conduz a conversa", note:"O fluxo que ele segue quando alguém fala com ele."},
    {num:"05", title:"Tom de voz", note:"Como ele deve soar pra parecer seu, não genérico."},
    {num:"06", title:"Regras e limites", note:"Onde ele para e o que ele nunca faz."},
    {num:"07", title:"Exemplos reais", note:"O que mais ajuda a acertar de primeira. Pode pular o que não tiver à mão agora."}
  ];

  var MAX_FILE_SIZE = 15 * 1024 * 1024;

  var QUESTIONS = [
    {id:"nome", section:0, type:"text", required:true,
      label:"Qual seu nome?", placeholder:"Ex: Ana Souza"},
    {id:"whats", section:0, type:"text", required:true,
      label:"Seu WhatsApp?", placeholder:"Ex: (11) 91234-5678"},
    {id:"nicho", section:0, type:"text", required:true,
      label:"Qual seu nicho?", placeholder:"Ex: nutrição esportiva, marketing jurídico, produtividade para mães"},

    {id:"nome_agente", section:1, type:"text", required:true,
      label:"Qual vai ser o nome do agente?", placeholder:"Ex: Agente do Método [nome do seu método]"},
    {id:"proposito", section:1, type:"essay", required:true,
      label:"Pra que ele serve, em uma frase?",
      help:"O problema que ele resolve. Ex: \"Ajuda o cliente a entender o que falta antes de fechar comigo.\""},
    {id:"quem_usa", section:1, type:"choice", required:true,
      label:"Quem vai usar esse agente?",
      options:["Só eu","Meus alunos ou mentorados","Os clientes finais deles","Mais de um desses"]},
    {id:"produto", section:1, type:"text", required:true,
      label:"Ele existe dentro de qual produto ou programa seu?", placeholder:"Ex: nome do seu curso, mentoria ou programa"},

    {id:"documentos", section:2, type:"files", required:true,
      label:"Que documentos ou materiais seus ele precisa conhecer de cor?",
      help:"Método, PDFs, planilhas, scripts — anexa os arquivos abaixo. Se não tiver a mão agora, descreve pelo menos quais são."},
    {id:"perguntas_frequentes", section:2, type:"essay", required:true,
      label:"Que perguntas frequentes ele precisa saber responder?",
      help:"Ex: \"Quanto custa? Quanto tempo demora? Preciso de algum pré-requisito?\""},
    {id:"fora_do_escopo", section:2, type:"essay", required:true,
      label:"Existe alguma coisa que ele NÃO deve saber ou falar?",
      help:"Assunto fora do escopo, concorrência, dado sensível. Ex: \"Não falar de preço de concorrente, não dar orientação fora da minha área.\""},
    {id:"terminologia", section:2, type:"essay", required:true,
      label:"Tem alguma terminologia própria sua que ele precisa usar do jeito certo?",
      help:"Nome de framework, sigla, nomenclatura do seu método. Ex: \"Sempre usar o nome do método por extenso, nunca abreviar.\""},

    {id:"abertura", section:3, type:"essay", required:true,
      label:"Como a conversa deve começar?",
      help:"A primeira coisa que ele diz ou pergunta. Ex: \"Oi! Pra te ajudar, me conta rapidinho qual é a sua maior dificuldade hoje.\""},
    {id:"fluxo", section:3, type:"choice", required:true,
      label:"Ele segue um passo a passo fixo, ou é mais livre?",
      options:["Passo a passo fixo","Mais livre / consultivo","Uma mistura dos dois"]},
    {id:"etapas", section:3, type:"essay", required:true,
      label:"Se tem passo a passo, quais são as etapas, na ordem?",
      help:"Pode ser rascunho — a gente lapida junto depois. Ex: \"1) Entende a situação 2) Aponta o que falta 3) Explica os riscos 4) Propõe o próximo passo.\""},
    {id:"confirmacoes", section:3, type:"essay", required:true,
      label:"Em algum momento ele deve parar e pedir confirmação antes de seguir?",
      help:"Como isso deve soar? Ex: \"Antes de fechar, confirma: isso bateu com a sua situação?\""},
    {id:"entrega_final", section:3, type:"essay", required:true,
      label:"O que ele entrega no final da conversa?",
      help:"Um documento, uma resposta, um plano, uma decisão. Ex: \"Um resumo com o diagnóstico e os próximos passos recomendados.\""},

    {id:"estilo", section:4, type:"text", required:true,
      label:"Como você quer que ele soe?", placeholder:"Ex: acolhedor, direto, técnico, provocador"},
    {id:"frases_proprias", section:4, type:"essay", required:true,
      label:"Tem alguma frase, expressão ou jeito de falar seu que ele deveria imitar?",
      help:"Ex: \"Eu sempre falo: resultado bom é resultado sustentável.\""},
    {id:"nunca_fazer", section:4, type:"essay", required:true,
      label:"Tem algo que ele NUNCA deveria fazer?",
      help:"Ex: \"Dar desconto, prometer resultado, ser informal demais.\""},

    {id:"fora_do_assunto", section:5, type:"essay", required:true,
      label:"Se perguntarem algo fora do assunto, o que ele deve responder?",
      help:"Ex: \"Fala que isso foge do que eu posso ajudar aqui, mas te chama no WhatsApp.\""},
    {id:"quem_pode_usar", section:5, type:"choice", required:true,
      label:"Ele pode ser usado por qualquer pessoa?",
      options:["Sim, qualquer pessoa","Só quem já é aluno ou cliente meu","Não sei ainda"]},
    {id:"sigilo", section:5, type:"essay", required:true,
      label:"Existe algo sigiloso que ele nunca pode revelar?",
      help:"Preço interno, processo interno, dado de terceiro. Ex: \"Nunca falar o valor da mentoria, nem citar nome de outro cliente.\""},

    {id:"conversa_real", section:6, type:"essay", required:false,
      label:"Cola aqui uma conversa real que mostra como esse atendimento acontece hoje",
      help:"Ex: um print transcrito ou um trecho de conversa real com um cliente."},
    {id:"teste_chatgpt", section:6, type:"essay", required:false,
      label:"Se já testou algo parecido no ChatGPT (mesmo que malfeito), cola aqui",
      help:"Ex: o texto da conversa que você teve testando, ou o link se ainda estiver salvo."}
  ];

  var steps = [{type:"intro"}];
  SECTIONS.forEach(function(sec, si){
    steps.push({type:"section", section:si});
    QUESTIONS.filter(function(q){return q.section===si;}).forEach(function(q){
      steps.push({type:"question", q:q});
    });
  });
  steps.push({type:"outro"});

  var totalQuestions = QUESTIONS.length;

  var state = {stepIndex:0, answers:{}};
  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(saved && typeof saved.stepIndex === "number"){ state = saved; }
  }catch(e){}

  var pendingFiles = {};

  var stage = document.getElementById("stage");
  var progressFill = document.getElementById("progressFill");
  var stepCount = document.getElementById("stepCount");
  var restartBtn = document.getElementById("restartBtn");

  restartBtn.addEventListener("click", function(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = {stepIndex:0, answers:{}};
    render();
  });

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === "class") node.className = attrs[k];
      else if(k === "text") node.textContent = attrs[k];
      else if(k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) node.appendChild(c); });
    return node;
  }

  function questionIndexOf(step){
    var qOnly = steps.filter(function(s){return s.type==="question";});
    return qOnly.indexOf(step) + 1;
  }

  function go(delta){
    var next = state.stepIndex + delta;
    if(next < 0) next = 0;
    if(next > steps.length - 1) next = steps.length - 1;
    state.stepIndex = next;
    saveState();
    render();
  }

  function updateChrome(step){
    var answeredQ = QUESTIONS.filter(function(q){
      var a = state.answers[q.id];
      return a !== undefined && a !== null && String(a).trim() !== "";
    }).length;
    var pct = Math.round((answeredQ / totalQuestions) * 100);
    if(step.type === "intro") pct = 0;
    if(step.type === "outro") pct = 100;
    progressFill.style.width = pct + "%";

    if(step.type === "question"){
      var n = questionIndexOf(step);
      stepCount.textContent = String(n).padStart(2,"0") + " / " + String(totalQuestions).padStart(2,"0");
    } else if(step.type === "section"){
      stepCount.textContent = "PARTE " + SECTIONS[step.section].num;
    } else {
      stepCount.textContent = "";
    }
  }

  function isAnswered(q){
    if(q.type === "files"){
      var a = state.answers[q.id];
      var hasFiles = pendingFiles[q.id] && pendingFiles[q.id].length > 0;
      var hasText = a && a.text && a.text.trim() !== "";
      return !!(hasFiles || hasText);
    }
    var a2 = state.answers[q.id];
    return a2 !== undefined && a2 !== null && String(a2).trim() !== "";
  }

  function buildIntro(){
    var s = el("div", {class:"screen intro"});
    s.appendChild(el("p", {class:"eyebrow", text:"Incubadora de Expert · Agente de IA"}));
    s.appendChild(el("h1", {text:"Vamos criar seu Agente de IA"}));
    s.appendChild(el("p", {class:"lede", text:"Um agente de IA bem feito começa com um bom briefing. Eu preciso entender exatamente o que ele precisa saber e como ele deve se comportar antes de montar a primeira linha do prompt."}));
    s.appendChild(el("p", {class:"lede small", text:"Não precisa escrever bonito — quanto mais detalhe e exemplo real você der, melhor ele sai. Pode ir aos poucos: o que você escrever fica salvo sozinho."}));
    var btn = el("button", {class:"btn-primary", type:"button", text:"Começar meu briefing →"});
    btn.addEventListener("click", function(){ go(1); });
    s.appendChild(btn);
    return s;
  }

  function buildSection(step){
    var sec = SECTIONS[step.section];
    var s = el("div", {class:"screen section"});
    s.appendChild(el("p", {class:"eyebrow", text:"Parte " + sec.num + " de " + String(SECTIONS.length).padStart(2,"0")}));
    s.appendChild(el("h2", {text:sec.title}));
    s.appendChild(el("p", {class:"lede", text:sec.note}));
    var actions = el("div", {class:"actions"});
    var backBtn = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    backBtn.addEventListener("click", function(){ go(-1); });
    actions.appendChild(backBtn);
    var btn = el("button", {class:"btn-primary", type:"button", text:"Seguir →"});
    btn.addEventListener("click", function(){ go(1); });
    actions.appendChild(btn);
    s.appendChild(actions);
    return s;
  }

  function buildQuestion(step){
    var q = step.q;
    var sec = SECTIONS[q.section];
    var s = el("div", {class:"screen question"});
    s.appendChild(el("p", {class:"qmeta", text:sec.title.toUpperCase() + (q.required ? "" : " · OPCIONAL")}));
    s.appendChild(el("h2", {text:q.label}));
    if(q.help){ s.appendChild(el("p", {class:"qhelp", text:q.help})); }

    var input;
    var errorMsg = el("p", {class:"error-msg"});

    function refreshButton(){
      nextBtn.disabled = q.required && !isAnswered(q);
    }

    if(q.type === "text"){
      input = el("input", {class:"field-text", type:q.inputType || "text", placeholder:q.placeholder || "Sua resposta"});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      input.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){ ev.preventDefault(); if(!nextBtn.disabled) advance(); }
      });
      s.appendChild(input);
    } else if(q.type === "essay"){
      input = el("textarea", {class:"field-textarea essay", rows:"8", placeholder:q.placeholder || "Escreva sem filtro..."});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      s.appendChild(input);
      s.appendChild(el("p", {class:"hint", text:"Sem pressa — escreva o que vier. Enter quebra linha normalmente aqui."}));
    } else if(q.type === "files"){
      if(typeof state.answers[q.id] !== "object" || !state.answers[q.id]){
        state.answers[q.id] = {text:"", fileNames:[]};
      }
      var filesWrap = el("div", {class:"files-wrap"});
      var fileListEl = el("div", {class:"file-list"});
      var fileInputId = "filein-" + q.id;
      var fileInput = el("input", {type:"file", id:fileInputId, multiple:"multiple", style:"display:none"});
      var fileBtn = el("label", {class:"btn-ghost file-btn", "for":fileInputId, text:"Escolher arquivos"});
      var noteInput = el("textarea", {class:"field-textarea", rows:"3", placeholder:"Descreve rapidamente o que são (opcional se já anexou os arquivos)"});
      noteInput.value = state.answers[q.id].text || "";
      noteInput.addEventListener("input", function(){
        state.answers[q.id].text = noteInput.value;
        saveState();
        refreshButton();
      });

      function renderFileList(){
        fileListEl.innerHTML = "";
        (pendingFiles[q.id] || []).forEach(function(f, idx){
          var row = el("div", {class:"file-row"});
          row.appendChild(el("span", {text: f.name + " (" + Math.round(f.size/1024) + " KB)"}));
          var rm = el("button", {type:"button", class:"file-remove", text:"remover"});
          rm.addEventListener("click", function(){
            pendingFiles[q.id].splice(idx, 1);
            state.answers[q.id].fileNames = pendingFiles[q.id].map(function(x){return x.name;});
            saveState();
            renderFileList();
            refreshButton();
          });
          row.appendChild(rm);
          fileListEl.appendChild(row);
        });
      }

      fileInput.addEventListener("change", function(){
        pendingFiles[q.id] = pendingFiles[q.id] || [];
        Array.prototype.forEach.call(fileInput.files, function(f){
          if(f.size > MAX_FILE_SIZE){
            errorMsg.textContent = "\"" + f.name + "\" passou de 15MB — manda um arquivo menor ou compacta.";
            return;
          }
          pendingFiles[q.id].push(f);
        });
        state.answers[q.id].fileNames = pendingFiles[q.id].map(function(x){return x.name;});
        saveState();
        renderFileList();
        refreshButton();
        fileInput.value = "";
      });

      renderFileList();
      filesWrap.appendChild(fileBtn);
      filesWrap.appendChild(fileInput);
      filesWrap.appendChild(fileListEl);
      filesWrap.appendChild(noteInput);
      s.appendChild(filesWrap);
      s.appendChild(el("p", {class:"hint", text:"Aceita PDF, Word, Excel, imagem — até 15MB por arquivo. Não fica salvo se você recarregar a página, então evita fechar a aba antes de terminar."}));
    } else if(q.type === "choice"){
      var wrap = el("div", {class:"choices"});
      function renderChoices(){
        wrap.innerHTML = "";
        q.options.forEach(function(opt){
          var btn = el("div", {class:"choice" + (state.answers[q.id]===opt ? " selected" : "")});
          btn.appendChild(el("span", {class:"mark"}));
          btn.appendChild(el("span", {text:opt}));
          btn.addEventListener("click", function(){
            state.answers[q.id] = opt;
            saveState();
            renderChoices();
            refreshButton();
          });
          wrap.appendChild(btn);
        });
      }
      renderChoices();
      s.appendChild(wrap);
    }

    var actions = el("div", {class:"actions"});
    var backBtn2 = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    backBtn2.addEventListener("click", function(){ go(-1); });
    actions.appendChild(backBtn2);
    var nextBtn = el("button", {class:"btn-primary", type:"button", text:"Continuar →"});
    nextBtn.addEventListener("click", advance);
    actions.appendChild(nextBtn);
    if(!q.required){
      var skipBtn = el("button", {class:"btn-ghost", type:"button", text:"Pular"});
      skipBtn.addEventListener("click", function(){ go(1); });
      actions.appendChild(skipBtn);
    }
    s.appendChild(actions);
    s.appendChild(errorMsg);
    if(q.type === "text"){
      s.appendChild(el("p", {class:"hint", text:"pressione Enter ↵"}));
    }

    function advance(){
      if(q.required && !isAnswered(q)){
        errorMsg.textContent = "Essa aqui eu preciso saber pra montar o agente direito.";
        return;
      }
      go(1);
    }

    refreshButton();
    setTimeout(function(){ if(input && input.focus) input.focus(); }, 10);
    return s;
  }

  function answerText(q){
    if(!isAnswered(q)) return "";
    if(q.type === "files"){
      var a = state.answers[q.id] || {};
      var names = (pendingFiles[q.id] || []).map(function(f){return f.name;});
      var parts = [];
      if(a.text && a.text.trim()) parts.push(a.text.trim());
      if(names.length) parts.push("Arquivos anexados: " + names.join(", "));
      return parts.join(" — ");
    }
    return String(state.answers[q.id]).trim();
  }

  function sectionsText(){
    var lines = [];
    SECTIONS.forEach(function(sec, si){
      var qs = QUESTIONS.filter(function(q){return q.section===si;});
      var any = qs.some(isAnswered);
      if(!any) return;
      lines.push("— " + sec.title.toUpperCase() + " —");
      qs.forEach(function(q){
        if(!isAnswered(q)) return;
        lines.push(q.label);
        lines.push(answerText(q));
        lines.push("");
      });
    });
    return lines.join("\n").trim();
  }

  function formatAnswersText(){
    return "Briefing do Agente de IA — Incubadora de Expert\n\n" + sectionsText();
  }

  function buildSheetRow(){
    var today = new Date();
    var dd = String(today.getDate()).padStart(2,"0");
    var mm = String(today.getMonth()+1).padStart(2,"0");
    var yyyy = today.getFullYear();
    var row = [dd + "/" + mm + "/" + yyyy];
    QUESTIONS.forEach(function(q){ row.push(answerText(q)); });
    return row;
  }

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result).split(",")[1] || "";
        resolve({name:file.name, mimeType:file.type || "application/octet-stream", base64:base64});
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function sendToSheet(){
    if(!SHEETS_ENDPOINT_URL || SHEETS_ENDPOINT_URL.indexOf("COLE_AQUI") === 0) return;
    var allFiles = [];
    Object.keys(pendingFiles).forEach(function(qid){
      (pendingFiles[qid] || []).forEach(function(f){ allFiles.push(f); });
    });
    Promise.all(allFiles.map(fileToBase64)).catch(function(){ return []; }).then(function(encoded){
      fetch(SHEETS_ENDPOINT_URL, {
        method:"POST",
        body: JSON.stringify({row: buildSheetRow(), files: encoded || []})
      }).catch(function(){});
    });
  }

  function slug(s){
    var base = (s || "briefing").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
    return base || "briefing";
  }

  function buildOutro(){
    var s = el("div", {class:"screen outro"});
    s.appendChild(el("p", {class:"eyebrow", text:"Prontinho"}));
    s.appendChild(el("h1", {text:"Recebido. Seu briefing está com a Karol."}));
    s.appendChild(el("p", {class:"lede", text:"Suas respostas e os arquivos que você anexou já foram registrados. Eu vou analisar tudo e te chamo no WhatsApp pra alinhar os próximos passos da criação do seu agente."}));

    var actions = el("div", {class:"actions"});
    var outroBackBtn = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    outroBackBtn.addEventListener("click", function(){ go(-1); });
    actions.appendChild(outroBackBtn);

    var dlStatus = el("p", {class:"status-msg"});
    var dlBtn = el("button", {class:"btn-ghost", type:"button", text:"Baixar uma cópia pra mim"});
    dlBtn.addEventListener("click", function(){
      if(!window.claude || !window.claude.downloads){
        dlStatus.textContent = "Download não disponível aqui.";
        return;
      }
      window.claude.downloads.save({
        filename:"briefing-agente-ia-" + slug(state.answers.nome) + ".txt",
        data: formatAnswersText()
      }).then(function(){
        dlStatus.textContent = "Baixado.";
        dlStatus.className = "status-msg ok";
      }).catch(function(err){
        if(err && err.code === "declined"){ dlStatus.textContent = ""; return; }
        dlStatus.textContent = "Não consegui baixar agora.";
      });
    });
    actions.appendChild(dlBtn);

    s.appendChild(actions);
    s.appendChild(dlStatus);

    var review = el("details", {class:"review"});
    var summary = el("summary", {text:"Ver minhas respostas"});
    var dl = el("dl");
    QUESTIONS.forEach(function(q){
      if(!isAnswered(q)) return;
      dl.appendChild(el("dt", {text:q.label}));
      dl.appendChild(el("dd", {text:answerText(q)}));
    });
    review.appendChild(summary);
    review.appendChild(dl);
    s.appendChild(review);

    return s;
  }

  function render(){
    var step = steps[state.stepIndex];
    updateChrome(step);
    stage.innerHTML = "";
    var screen;
    if(step.type === "intro") screen = buildIntro();
    else if(step.type === "section") screen = buildSection(step);
    else if(step.type === "question") screen = buildQuestion(step);
    else {
      if(!state.submitted){
        sendToSheet();
        state.submitted = true;
        saveState();
      }
      screen = buildOutro();
    }
    stage.appendChild(screen);
  }

  render();
})();
</script>
</body>
</html>
