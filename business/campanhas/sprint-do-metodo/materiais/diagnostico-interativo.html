:root{
  --ink:#0B0B0C;
  --ink-2:#151517;
  --ink-3:#1C1C1F;
  --paper:#FFFFFF;
  --fog:#F4F4F5;
  --mist:#D4D4D8;
  --ash:#71717A;
  --line:#3F3F46;
  --ember:#FF6B1A;
  --ember-dark:#E85A0D;
  --ember-wash: rgba(255,107,26,0.10);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --dur:220ms;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.progress-track{
  position:fixed;
  top:0;left:0;right:0;
  height:2px;
  background:var(--line);
  z-index:20;
}
.progress-fill{
  height:100%;
  width:0%;
  background:var(--ember);
  transition:width .45s ease;
}

.chrome{
  display:flex;
  align-items:center;
  justify-content:space-between;

<script>
(function(){
  "use strict";

  var WHATSAPP_NUMBER = "556792324690";
  var SHEETS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbycg_1F6ZqnHkfjRrJ3LAs4fULFhG1VahNRAT1JyKLyB00w_WE4QnN1_YXAOwBodTfX9w/exec";
  var STORAGE_KEY = "sprint-metodo-diagnostico-v1";

  var SECTIONS = [
    {num:"01", title:"Sobre você", note:"Pra eu te chamar certo e saber com quem estou falando."},
    {num:"02", title:"Seu momento no digital", note:"Onde você já pisou, o que já tentou, o que já existe hoje."},
    {num:"03", title:"Dores e contexto", note:"O que te trouxe até aqui — sem filtro."},
    {num:"04", title:"Minha História Real", note:"A matéria-prima mais importante do seu método. Sem filtro, sem se preocupar com o que vai virar depois — só o que é verdadeiro. Pode ir aos poucos, o que você escrever fica salvo."},
    {num:"05", title:"Meu Ikigai", note:"\"Razão de ser\": a interseção entre o que você ama, o que sabe fazer bem e o que o mundo pede de você. Puxa da história que você acabou de contar."},
    {num:"06", title:"Logística do Sprint", note:"Só falta combinar os detalhes práticos."}
  ];

  var QUESTIONS = [
    {id:"nome", section:0, type:"text", required:true,
      label:"Qual é o seu nome completo?"},
    {id:"profissao", section:0, type:"text", required:true,
      label:"Qual é a sua profissão ou área de atuação?"},
    {id:"anos", section:0, type:"choice", required:true,
      label:"Há quantos anos você atua nessa área?",
      options:["Menos de 3 anos","3 a 5 anos","5 a 10 anos","Mais de 10 anos"]},
    {id:"whatsapp", section:0, type:"text", required:true,
      label:"Qual o melhor WhatsApp pra falar com você durante o Sprint?",
      placeholder:"(DD) 9XXXX-XXXX"},
    {id:"atuacao", section:1, type:"choice", required:true,
      label:"Como você atua hoje — mais presencial ou mais online?",
      options:["100% presencial / offline","Mais presencial do que online","Meio a meio","Mais online do que presencial","100% online"]},
    {id:"instagram", section:1, type:"text", required:false,
      label:"Qual é o seu @ no Instagram (ou principal rede, se usar outra)?",
      placeholder:"@seuusuario"},
    {id:"tentou", section:1, type:"choice_other", required:true,
      label:"Você já tentou entrar no digital antes? O que aconteceu?",
      options:["Não tentei ainda","Tentei, mas não saiu do planejamento","Tentei, investi, mas não tive resultado","Tentei e tive algum resultado, mas não foi o que esperava"],
      otherLabel:"Outro"},
    {id:"oferta", section:1, type:"textarea", required:false,
      label:"Hoje você já tem algum produto, serviço ou oferta estruturada? Se sim, descreva — nome, formato, preço."},
    {id:"atende", section:1, type:"textarea", required:true,
      label:"Como você atende seus clientes ou pacientes hoje — e como eles chegam até você?"},
    {id:"dor", section:2, type:"textarea", required:true,
      label:"Qual foi a dor ou situação específica que te trouxe pro Sprint do Método agora?"},
    {id:"tentativa", section:2, type:"textarea", required:true,
      label:"O que você já tentou pra resolver isso por conta própria — e não funcionou?"},
    {id:"uma_coisa", section:2, type:"textarea", required:true,
      label:"Se pudesse sair das 5 semanas com UMA coisa resolvida, qual seria?"},

    {id:"hr_padroes", section:3, type:"essay", required:true,
      label:"Olhando para sua vida inteira até aqui — infância, adolescência, vida adulta — quais padrões você consegue identificar?",
      help:"Padrão não é o que você escolheu conscientemente. É o que aparece sem você chamar. A criança que resolvia os problemas dos amigos. Quem, já adulto, sempre foi chamado pra aquele tipo específico de conversa. Anote o que aparecer — mesmo que pareça óbvio demais ou pequeno demais."},
    {id:"hr_forcas", section:3, type:"essay", required:true,
      label:"Das suas dores e experiências difíceis, quais habilidades ou forças nasceram? Liste pelo menos 3 situações e a força que veio de cada uma.",
      help:"Cada dor vivida com profundidade te deu um conhecimento que só quem passou por aquilo tem. Vá além da resposta fácil — se a primeira coisa que vem é \"aprendi a ser mais forte\", vai fundo: mais forte como? Para fazer o quê? Em que situação isso aparece?"},
    {id:"hr_territorios", section:3, type:"essay", required:true,
      label:"Sobre quais territórios — espiritual, financeiro, emocional, relacional, técnico — você ganhou autoridade por ter passado por isso?",
      help:"Território de autoridade não é onde você tem diploma. É onde você tem história. Dá pra ter autoridade emocional sem pós em psicologia. Dá pra ter autoridade financeira sem MBA. Mapear esses territórios é entender onde o seu método pode falar com verdade."},
    {id:"hr_chamado", section:3, type:"essay", required:true,
      label:"Você já sentiu algum \"chamado\" — um incômodo, algo que te convocou a agir? Descreva.",
      help:"Chamado não é motivação. Motivação vem e vai. Chamado é o incômodo que não te larga — aquela coisa que você vê acontecendo no mundo e que te incomoda de um jeito específico, como se você soubesse que pode fazer algo a respeito. Pode ter aparecido uma vez. Pode aparecer sempre."},
    {id:"hr_performance", section:3, type:"essay", required:true,
      label:"Você já teve um momento de alta performance + satisfação ao mesmo tempo? Descreva.",
      help:"Não estou perguntando sobre quando alguém reconheceu seu trabalho. Estou perguntando quando você estava tão dentro do que estava fazendo que o tempo passou diferente — e quando terminou, veio as duas coisas ao mesmo tempo: \"fiz bem\" e \"quero fazer de novo\". Esse estado é um marcador de onde o seu método vive naturalmente."},
    {id:"hr_trabalho", section:3, type:"essay", required:true,
      label:"O trabalho é recompensa por si só ou mal necessário para ganhar dinheiro?",
      help:"Não tem resposta certa. Tem uma resposta honesta — e ela importa para o que você vai construir. Se o trabalho é recompensa: o método vai viver naturalmente naquele território, mesmo quando for difícil. Se o trabalho é meio: o método precisa ser estruturado de um jeito que o processo em si compense. As duas respostas levam a um método."},
    {id:"hr_fechamento", section:3, type:"essay", required:true,
      label:"Pelo que você passou que te deu força ou autoridade?",
      help:"Esta é a pergunta de fechamento — propositalmente a mais aberta. Depois de seis perguntas específicas, agora você tem permissão de colocar qualquer coisa que ainda não apareceu. O que ficou de fora? O que você viveu que não tem nome ainda, mas que te moldou?"},

    {id:"ik_talentos", section:4, type:"essay", required:true,
      label:"Quais são os seus talentos naturais? Liste pelo menos 5.",
      help:"Talento natural é o que você faz bem sem precisar se esforçar muito — o que pra outros parece difícil e pra você é automático. Liste sem hierarquia, sem filtrar por \"isso não é profissional\"."},
    {id:"ik_paixoes", section:4, type:"essay", required:true,
      label:"E as suas paixões? Liste pelo menos 5.",
      help:"Paixão é o que te puxa mesmo quando ninguém está pedindo. Não filtre por \"isso não tem nada a ver com meu trabalho\" — cinco é o mínimo, pode ir além."},
    {id:"ik_demanda", section:4, type:"essay", required:true,
      label:"Qual é a demanda que o mundo está pedindo que tem a ver com você?",
      help:"Não estou perguntando o que o mercado paga. Estou perguntando o que as pessoas ao seu redor pedem de você — mesmo sem você ter colocado placa. Qual é o problema que as pessoas te trazem? Qual é a conversa que você tem repetida, com pessoas diferentes, onde você sempre sabe o que dizer?"},
    {id:"ik_intersecao", section:4, type:"essay", required:true,
      label:"Na interseção dos seus talentos, paixões e demanda do mundo, o que aparece?",
      help:"Esta é a pergunta de síntese. Não pede uma resposta nova — pede que você olhe pro que escreveu nas duas anteriores e encontre o ponto de convergência. Não precisa ser preciso. Pode ser uma frase incompleta, uma ideia em formação, um território."},
    {id:"ik_frase", section:4, type:"essay", required:true,
      label:"Escreva uma primeira frase (rascunho): por que você existe?",
      help:"Essa frase é um rascunho. Não é a frase final da sua bio, não é o tagline do seu método. É uma tentativa honesta de responder, em uma frase, por que você — com essa trajetória, esses talentos, essa paixão, essa demanda que o mundo traz pra você — existe como especialista. Escreva o que vier, você vai refinar mais pra frente."},
    {id:"ik_algo_hoje", section:4, type:"essay", required:true,
      label:"Existe algo que você está fazendo hoje que poderia ser \"a coisa certa no momento certo\"?",
      help:"Às vezes o método já está acontecendo — só ainda não tem nome, ainda não tem forma. Você já ajuda alguém de um jeito específico? Tem uma forma de trabalhar que sempre gera resultado, mesmo sem ter formalizado? Se existir, nomeie. Se não existir ainda, nomeie o que está mais próximo."},
    {id:"ik_faz_bem", section:4, type:"essay", required:true,
      label:"O que você faz bem sem esforço, que pra outros parece difícil?",
      help:"Essa pergunta captura o que é tão natural pra você que você nem considera valioso — exatamente porque é automático. Presta atenção nos elogios que você descarta. No que as pessoas te pedem ajuda repetidamente. Isso é autoridade — mesmo sem placa, mesmo sem certificado."},
    {id:"ik_brilho", section:4, type:"essay", required:true,
      label:"O que brilha — ou brilhava — o seu olho?",
      help:"\"Brilhava\" está aí por um motivo. Às vezes o que nos move mais profundamente é algo que ficou represado — que você parou de fazer por responsabilidade, por julgamento, por falta de espaço. O que brilhava antes da vida ficar ocupada demais? O que ainda brilha quando você se permite pensar nisso?"},
    {id:"ik_admira", section:4, type:"essay", required:true,
      label:"Quais pessoas você admira e o que elas têm que espelha algo que já está em você?",
      help:"Você não admira o que é completamente estranho a você. Admira o que reconhece. O que essas pessoas têm que você vê em si mesmo, mesmo que ainda em forma de semente? Que qualidade, que postura, que forma de fazer que você reconhece porque já existe em você, mesmo que não tão desenvolvida?"},

    {id:"horario", section:5, type:"textarea", required:true,
      label:"Qual o melhor dia e horário pra suas sessões semanais nas próximas 5 semanas?",
      placeholder:"Ex.: terças de manhã, ou depois das 19h nos dias de semana..."}
  ];

  var steps = [{type:"intro"}];
  SECTIONS.forEach(function(sec, si){
    steps.push({type:"section", section:si});
    QUESTIONS.filter(function(q){return q.section===si;}).forEach(function(q){
      steps.push({type:"question", q:q});
    });
  });
  steps.push({type:"outro"});

  var totalQuestions = QUESTIONS.length;

  var state = {stepIndex:0, answers:{}};
  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(saved && typeof saved.stepIndex === "number"){ state = saved; }
  }catch(e){}

  var stage = document.getElementById("stage");
  var progressFill = document.getElementById("progressFill");
  var stepCount = document.getElementById("stepCount");
  var restartBtn = document.getElementById("restartBtn");

  restartBtn.addEventListener("click", function(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = {stepIndex:0, answers:{}};
    render();
  });

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === "class") node.className = attrs[k];
      else if(k === "text") node.textContent = attrs[k];
      else if(k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) node.appendChild(c); });
    return node;
  }

  function questionIndexOf(step){
    var qOnly = steps.filter(function(s){return s.type==="question";});
    return qOnly.indexOf(step) + 1;
  }

  function go(delta){
    var next = state.stepIndex + delta;
    if(next < 0) next = 0;
    if(next > steps.length - 1) next = steps.length - 1;
    state.stepIndex = next;
    saveState();
    render();
  }

  function updateChrome(step){
    var answeredQ = QUESTIONS.filter(function(q){
      var a = state.answers[q.id];
      return a !== undefined && a !== null && String(a).trim() !== "";
    }).length;
    var pct = Math.round((answeredQ / totalQuestions) * 100);
    if(step.type === "intro") pct = 0;
    if(step.type === "outro") pct = 100;
    progressFill.style.width = pct + "%";

    if(step.type === "question"){
      var n = questionIndexOf(step);
      stepCount.textContent = String(n).padStart(2,"0") + " / " + String(totalQuestions).padStart(2,"0");
    } else if(step.type === "section"){
      stepCount.textContent = "PARTE " + SECTIONS[step.section].num;
    } else {
      stepCount.textContent = "";
    }
  }

  function isAnswered(q){
    var a = state.answers[q.id];
    if(q.type === "choice_other"){
      if(a && a.value === "__other__") return !!(a.other && a.other.trim());
      return !!(a && a.value);
    }
    return a !== undefined && a !== null && String(a).trim() !== "";
  }

  function buildIntro(){
    var s = el("div", {class:"screen intro"});
    s.appendChild(el("p", {class:"eyebrow", text:"Sprint do Método · Semana 01"}));
    s.appendChild(el("h1", {text:"Vamos começar pelo Levantamento Estratégico."}));
    s.appendChild(el("p", {class:"lede", text:"Antes da nossa imersão, preciso entender seu contexto de negócio e conhecer sua história — a base de tudo que vamos construir juntos. São 6 partes: seu contexto, sua história real, seu ikigai e a logística das sessões."}));
    s.appendChild(el("p", {class:"lede small", text:"Pode ir aos poucos — o que você escrever fica salvo sozinho no navegador. Fecha, volta amanhã, continua de onde parou."}));
    var btn = el("button", {class:"btn-primary", type:"button", text:"Começar diagnóstico →"});
    btn.addEventListener("click", function(){ go(1); });
    s.appendChild(btn);
    return s;
  }

  function buildSection(step){
    var sec = SECTIONS[step.section];
    var s = el("div", {class:"screen section"});
    s.appendChild(el("p", {class:"eyebrow", text:"Parte " + sec.num + " de " + String(SECTIONS.length).padStart(2,"0")}));
    s.appendChild(el("h2", {text:sec.title}));
    s.appendChild(el("p", {class:"lede", text:sec.note}));
    var actions = el("div", {class:"actions"});
    var backBtn = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    backBtn.addEventListener("click", function(){ go(-1); });
    actions.appendChild(backBtn);
    var btn = el("button", {class:"btn-primary", type:"button", text:"Seguir →"});
    btn.addEventListener("click", function(){ go(1); });
    actions.appendChild(btn);
    s.appendChild(actions);
    return s;
  }

  function buildQuestion(step){
    var q = step.q;
    var sec = SECTIONS[q.section];
    var s = el("div", {class:"screen question"});
    s.appendChild(el("p", {class:"qmeta", text:sec.title.toUpperCase() + (q.required ? "" : " · OPCIONAL")}));
    s.appendChild(el("h2", {text:q.label}));
    if(q.help){ s.appendChild(el("p", {class:"qhelp", text:q.help})); }

    var input;
    var errorMsg = el("p", {class:"error-msg"});

    function refreshButton(){
      nextBtn.disabled = q.required && !isAnswered(q);
    }

    if(q.type === "text"){
      input = el("input", {class:"field-text", type:"text", placeholder:q.placeholder || "Sua resposta"});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      input.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){ ev.preventDefault(); if(!nextBtn.disabled) advance(); }
      });
      s.appendChild(input);
    } else if(q.type === "textarea"){
      input = el("textarea", {class:"field-textarea", rows:"4", placeholder:q.placeholder || "Escreva sem filtro..."});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      input.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); if(!nextBtn.disabled) advance(); }
      });
      s.appendChild(input);
      s.appendChild(el("p", {class:"hint", text:"Enter para continuar · Shift+Enter para quebrar linha"}));
    } else if(q.type === "essay"){
      input = el("textarea", {class:"field-textarea essay", rows:"8", placeholder:q.placeholder || "Escreva sem filtro. Não tem tamanho mínimo nem máximo..."});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      s.appendChild(input);
      s.appendChild(el("p", {class:"hint", text:"Sem pressa — escreva o que vier. Enter quebra linha normalmente aqui."}));
    } else if(q.type === "choice" || q.type === "choice_other"){
      var wrap = el("div", {class:"choices"});
      var current = state.answers[q.id] || {value:null, other:""};
      if(typeof current === "string"){ current = {value:current, other:""}; }

      function renderChoices(){
        wrap.innerHTML = "";
        q.options.forEach(function(opt){
          var btn = el("div", {class:"choice" + (current.value===opt ? " selected" : "")});
          btn.appendChild(el("span", {class:"mark"}));
          btn.appendChild(el("span", {text:opt}));
          btn.addEventListener("click", function(){
            current.value = opt;
            state.answers[q.id] = q.type === "choice_other" ? current : opt;
            saveState();
            renderChoices();
            refreshButton();
          });
          wrap.appendChild(btn);
        });
        if(q.type === "choice_other"){
          var otherBtn = el("div", {class:"choice" + (current.value==="__other__" ? " selected" : "")});
          otherBtn.appendChild(el("span", {class:"mark"}));
          otherBtn.appendChild(el("span", {text:q.otherLabel || "Outro"}));
          otherBtn.addEventListener("click", function(){
            current.value = "__other__";
            state.answers[q.id] = current;
            saveState();
            renderChoices();
            refreshButton();
            var oi = wrap.parentNode.querySelector(".other-input");
            if(oi) oi.focus();
          });
          wrap.appendChild(otherBtn);
        }
      }
      renderChoices();
      s.appendChild(wrap);

      if(q.type === "choice_other"){
        var otherField = el("input", {class:"field-text other-field other-input", type:"text", placeholder:"Conta o que aconteceu..."});
        otherField.value = current.other || "";
        otherField.style.display = current.value === "__other__" ? "block" : "none";
        otherField.addEventListener("input", function(){
          current.other = otherField.value;
          state.answers[q.id] = current;
          saveState();
          refreshButton();
        });
        s.appendChild(otherField);
        var origRenderChoices = renderChoices;
        renderChoices = function(){
          origRenderChoices();
          otherField.style.display = current.value === "__other__" ? "block" : "none";
        };
      }
    }

    var actions = el("div", {class:"actions"});
    var backBtn2 = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    backBtn2.addEventListener("click", function(){ go(-1); });
    actions.appendChild(backBtn2);
    var nextBtn = el("button", {class:"btn-primary", type:"button", text:"Continuar →"});
    nextBtn.addEventListener("click", advance);
    actions.appendChild(nextBtn);
    if(!q.required){
      var skipBtn = el("button", {class:"btn-ghost", type:"button", text:"Pular"});
      skipBtn.addEventListener("click", function(){ go(1); });
      actions.appendChild(skipBtn);
    }
    s.appendChild(actions);
    s.appendChild(errorMsg);
    if(q.type === "text"){
      s.appendChild(el("p", {class:"hint", text:"pressione Enter ↵"}));
    }

    function advance(){
      if(q.required && !isAnswered(q)){
        errorMsg.textContent = "Essa aqui eu preciso saber pra te atender direito.";
        return;
      }
      go(1);
    }

    refreshButton();
    setTimeout(function(){ if(input && input.focus) input.focus(); }, 10);
    return s;
  }

  function answerText(q){
    var a = state.answers[q.id];
    if(!isAnswered(q)) return "";
    if(q.type === "choice_other"){
      return String(a.value === "__other__" ? a.other : a.value).trim();
    }
    return String(a).trim();
  }

  function sectionsText(indexes){
    var lines = [];
    SECTIONS.forEach(function(sec, si){
      if(indexes && indexes.indexOf(si) === -1) return;
      var qs = QUESTIONS.filter(function(q){return q.section===si;});
      var any = qs.some(isAnswered);
      if(!any) return;
      lines.push("— " + sec.title.toUpperCase() + " —");
      qs.forEach(function(q){
        if(!isAnswered(q)) return;
        lines.push(q.label);
        lines.push(answerText(q));
        lines.push("");
      });
    });
    return lines.join("\n").trim();
  }

  function formatAnswersText(){
    return "Diagnóstico de Início — Sprint do Método\n\n" + sectionsText(null);
  }

  function buildSheetRow(){
    var today = new Date();
    var dd = String(today.getDate()).padStart(2,"0");
    var mm = String(today.getMonth()+1).padStart(2,"0");
    var yyyy = today.getFullYear();
    var row = [dd + "/" + mm + "/" + yyyy];
    QUESTIONS.forEach(function(q){ row.push(answerText(q)); });
    return row;
  }

  function sendToSheet(){
    if(!SHEETS_ENDPOINT_URL || SHEETS_ENDPOINT_URL.indexOf("COLE_AQUI") === 0) return;
    fetch(SHEETS_ENDPOINT_URL, {
      method:"POST",
      body: JSON.stringify({row: buildSheetRow()})
    }).catch(function(){});
  }

  function formatWhatsappPing(){
    var nomeQ = QUESTIONS.filter(function(q){return q.id==="nome";})[0];
    var nome = answerText(nomeQ);
    return "Oi Karol! " + (nome ? ("Aqui é " + nome + ". ") : "") + "Acabei de terminar meu diagnóstico do Sprint do Método. 🙂";
  }

  function slug(s){
    var base = (s || "cliente").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
    return base || "cliente";
  }

  function buildOutro(){
    var s = el("div", {class:"screen outro"});
    s.appendChild(el("p", {class:"eyebrow", text:"Prontinho"}));
    s.appendChild(el("h1", {text:"Recebido. Sua Semana 01 já começou."}));
    s.appendChild(el("p", {class:"lede", text:"Suas respostas já foram registradas — não precisa fazer mais nada daqui. Se quiser, me manda um alô no WhatsApp ou guarda uma cópia pra você."}));

    var actions = el("div", {class:"actions"});
    var outroBackBtn = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    outroBackBtn.addEventListener("click", function(){ go(-1); });
    actions.appendChild(outroBackBtn);

    var waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(formatWhatsappPing());
    var sendBtn = el("a", {class:"btn-primary", href:waUrl, target:"_blank", rel:"noopener noreferrer", text:"Avisar a Karol no WhatsApp →"});
    actions.appendChild(sendBtn);

    var dlStatus = el("p", {class:"status-msg"});
    var dlBtn = el("button", {class:"btn-ghost", type:"button", text:"Baixar uma cópia pra mim"});
    dlBtn.addEventListener("click", function(){
      if(!window.claude || !window.claude.downloads){
        dlStatus.textContent = "Download não disponível aqui.";
        return;
      }
      window.claude.downloads.save({
        filename:"diagnostico-sprint-do-metodo-" + slug(state.answers.nome) + ".txt",
        data: formatAnswersText()
      }).then(function(){
        dlStatus.textContent = "Baixado.";
        dlStatus.className = "status-msg ok";
      }).catch(function(err){
        if(err && err.code === "declined"){ dlStatus.textContent = ""; return; }
        dlStatus.textContent = "Não consegui baixar agora.";
      });
    });
    actions.appendChild(dlBtn);

    s.appendChild(actions);
    s.appendChild(el("p", {class:"hint", text:"O navegador vai pedir confirmação antes de abrir o WhatsApp — é só clicar em \"Open link\"."}));
    s.appendChild(dlStatus);

    var review = el("details", {class:"review"});
    var summary = el("summary", {text:"Ver minhas respostas"});
    var dl = el("dl");
    QUESTIONS.forEach(function(q){
      if(!isAnswered(q)) return;
      dl.appendChild(el("dt", {text:q.label}));
      dl.appendChild(el("dd", {text:answerText(q)}));
    });
    review.appendChild(summary);
    review.appendChild(dl);
    s.appendChild(review);

    return s;
  }

  function render(){
    var step = steps[state.stepIndex];
    updateChrome(step);
    stage.innerHTML = "";
    var screen;
    if(step.type === "intro") screen = buildIntro();
    else if(step.type === "section") screen = buildSection(step);
    else if(step.type === "question") screen = buildQuestion(step);
    else {
      if(!state.submitted){
        sendToSheet();
        state.submitted = true;
        saveState();
      }
      screen = buildOutro();
    }
    stage.appendChild(screen);
  }

  render();
})();
</script>
