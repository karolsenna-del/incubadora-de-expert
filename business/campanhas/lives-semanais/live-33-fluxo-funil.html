<title>Funil de Vendas Secretas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: palco escuro no visual da Live Expert360 — fluxo das 9 etapas em cima, painel da etapa escolhida embaixo com o link da ferramenta real. */
  :root{
    --laranja:#f85627;
    --preto:#090a0b;
    --preto-2:#141517;
    --cinza:#ddddde;
    --branco:#fcfcfc;
    --linha:rgba(252,252,252,.16);
    --display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{margin:0; background:var(--preto); color:var(--branco); font-family:var(--body);
    background:radial-gradient(70vw 50vw at 90% 110%, rgba(248,86,39,.14), transparent 60%), var(--preto);}
  .wrap{max-width:1280px; margin:0 auto; padding-inline:clamp(16px,4vw,56px); padding-block:clamp(28px,5vw,64px); display:flex; flex-direction:column; gap:clamp(24px,3.5vw,44px);}

  header{display:flex; flex-direction:column; gap:10px;}
  .eyebrow{font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; opacity:.6; font-weight:600;}
  h1{font-family:var(--display); font-weight:800; font-size:clamp(2rem,4.6vw,3.6rem); line-height:1.05; margin:0; text-wrap:balance;}
  h1 span{color:var(--laranja);}
  header p{margin:0; max-width:60ch; line-height:1.55; opacity:.8; font-size:clamp(1rem,1.3vw,1.15rem);}

  /* fluxo */
  .flow{display:flex; align-items:center; gap:8px;}
  .flow-main{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
  .step{flex:1; min-width:0; appearance:none; font:inherit; color:inherit; cursor:pointer;
    background:rgba(252,252,252,.05); border:1px solid var(--linha); border-radius:14px;
    padding:16px 8px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    transition:background .15s, border-color .15s, transform .15s;}
  .step:hover{border-color:rgba(248,86,39,.6); transform:translateY(-2px);}
  .step:focus-visible{outline:3px solid var(--laranja); outline-offset:3px;}
  .step svg{width:28px; height:28px; color:var(--laranja);}
  .step .n{font-family:var(--display); font-size:.7rem; font-weight:800; opacity:.5; font-variant-numeric:tabular-nums;}
  .step b{font-family:var(--display); font-size:clamp(.72rem,.95vw,.95rem); line-height:1.2;}
  .step[aria-pressed="true"]{background:var(--laranja); border-color:var(--laranja);}
  .step[aria-pressed="true"] svg{color:var(--preto);}
  .step[aria-pressed="true"] .n{opacity:.8; color:var(--preto);}
  .arrow{color:var(--laranja); font-weight:800; flex:none;}
  .branch{display:flex; flex-direction:column; gap:10px; flex:none; width:clamp(130px,12vw,170px);}
  .branch .step{flex-direction:row; justify-content:flex-start; gap:10px; padding:12px;}
  .pill{font-family:var(--display); font-size:.66rem; font-weight:800; letter-spacing:.06em; padding:3px 8px; border-radius:20px; background:var(--laranja); color:var(--preto); flex:none;}
  .step[aria-pressed="true"] .pill{background:var(--preto); color:var(--laranja);}

  /* painel */
  .panel{border:1px solid var(--linha); border-radius:20px; background:var(--preto-2);
    padding:clamp(20px,3vw,40px); display:grid; grid-template-columns:auto 1fr; gap:clamp(16px,3vw,40px); align-items:start;}
  .panel .big{font-family:var(--display); font-weight:800; font-size:clamp(3rem,7vw,5.5rem); line-height:.9; color:var(--laranja); font-variant-numeric:tabular-nums;}
  .panel-body{display:flex; flex-direction:column; gap:14px; min-width:0;}
  .panel .tag{font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; opacity:.6; font-weight:600;}
  .panel h2{font-family:var(--display); font-weight:800; font-size:clamp(1.5rem,2.8vw,2.3rem); margin:0; line-height:1.15; text-wrap:balance;}
  .panel p{margin:0; line-height:1.6; font-size:clamp(1rem,1.3vw,1.2rem); max-width:62ch; opacity:.88;}
  .panel .tool{font-family:var(--display); font-weight:700; color:var(--laranja); font-size:.95rem;}
  .open{align-self:flex-start; display:inline-flex; align-items:center; gap:10px; margin-top:6px;
    padding:14px 22px; border-radius:999px; background:var(--laranja); color:var(--branco); text-decoration:none;
    font-family:var(--display); font-weight:700; font-size:1rem;}
  .open:hover{background:var(--branco); color:var(--preto);}
  .open:focus-visible{outline:3px solid var(--branco); outline-offset:3px;}
  .open svg{width:18px; height:18px;}
  .nolink{align-self:flex-start; font-size:.92rem; opacity:.6; border:1px dashed var(--linha); border-radius:999px; padding:10px 18px;}
  .local{display:flex; flex-direction:column; gap:6px; align-self:stretch;}
  .local code{font-size:.8rem; background:rgba(252,252,252,.06); border:1px solid var(--linha); border-radius:10px; padding:10px 12px; overflow-x:auto; white-space:nowrap; user-select:all;}

  .hint{font-size:.85rem; opacity:.5; margin:0;}

  @media (max-width:900px){
    .flow,.flow-main{flex-direction:column; align-items:stretch;}
    .flow-main .step{flex-direction:row; justify-content:flex-start; padding:12px 14px;}
    .arrow{transform:rotate(90deg); align-self:center;}
    .branch{width:100%;}
    .panel{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){ .step{transition:none;} .step:hover{transform:none;} }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"/><circle cx="16" cy="15" r="3.5"/><path d="M18.6 17.6L21 20M7.5 8h6M7.5 11.5h3"/></g></symbol>
    <symbol id="i-offer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14.5 10.5c-.5-.8-1.4-1.2-2.5-1.2-1.4 0-2.4.7-2.4 1.8 0 2.4 5 1.3 5 3.8 0 1.1-1.1 1.8-2.6 1.8-1.1 0-2.1-.5-2.6-1.3M12 8v1.3M12 16.2v1.3"/></g></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M2 12l4-4 4 2 3-2 4 1 5 3"/><path d="M6 8l-4 4 6 6 2-1M22 12l-5 6-3 1-4-3"/><path d="M10 10l3 3M12 13.5l2 2"/></g></symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M14 4c3-1 6-1 6-1s0 3-1 6l-6 6-5-5 6-6z"/><circle cx="15.5" cy="8.5" r="1.4"/><path d="M8 10l-4 1-1 3 4-1M14 16l-1 4-3 1 1-4"/></g></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></g></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </defs>
</svg>

<main class="wrap">
  <header>
    <span class="eyebrow">Live 33 · Incubadora de Expert</span>
    <h1>Funil de Vendas <span>Secretas</span></h1>
    <p>O caminho que a pessoa percorre do primeiro contato até a decisão. Clica numa etapa pra ver a ferramenta que eu uso nela.</p>
  </header>

  <nav class="flow" aria-label="Etapas do funil">
    <div class="flow-main">
      <button class="step" data-i="0" aria-pressed="true"><svg><use href="#i-people"/></svg><span class="n">01</span><b>Captar leads</b></button><span class="arrow" aria-hidden="true">→</span>
      <button class="step" data-i="1" aria-pressed="false"><svg><use href="#i-chat"/></svg><span class="n">02</span><b>Abordagem</b></button><span class="arrow" aria-hidden="true">→</span>
      <button class="step" data-i="2" aria-pressed="false"><svg><use href="#i-clip"/></svg><span class="n">03</span><b>Pré-diagnóstico</b></button><span class="arrow" aria-hidden="true">→</span>
      <button class="step" data-i="3" aria-pressed="false"><svg><use href="#i-cal"/></svg><span class="n">04</span><b>Agenda sessão</b></button><span class="arrow" aria-hidden="true">→</span>
      <button class="step" data-i="4" aria-pressed="false"><svg><use href="#i-search"/></svg><span class="n">05</span><b>Aplica diagnóstico</b></button><span class="arrow" aria-hidden="true">→</span>
      <button class="step" data-i="5" aria-pressed="false"><svg><use href="#i-offer"/></svg><span class="n">06</span><b>Oferta</b></button><span class="arrow" aria-hidden="true">→</span>
      <button class="step" data-i="6" aria-pressed="false"><svg><use href="#i-hand"/></svg><span class="n">07</span><b>Fechamento</b></button>
    </div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="branch">
      <button class="step" data-i="7" aria-pressed="false"><span class="pill">SIM</span><b>Onboarding</b></button>
      <button class="step" data-i="8" aria-pressed="false"><span class="pill">NÃO</span><b>Follow-up 5x</b></button>
    </div>
  </nav>

  <section class="panel" aria-live="polite">
    <div class="big" id="pNum">01</div>
    <div class="panel-body">
      <span class="tag" id="pTag">Antes da sessão</span>
      <h2 id="pTitle">Captar leads</h2>
      <p id="pText"></p>
      <span class="tool" id="pTool"></span>
      <div id="pAction"></div>
    </div>
  </section>

  <p class="hint">Use as setas ← → do teclado pra andar pelas etapas.</p>
</main>

<script>
  const ETAPAS = [
    { tag:'Antes da sessão', title:'Captar leads', tool:'Rastreador de Leads',
      text:'Tudo começa com gente: quem já te conhece, ex-clientes, gente da sua área, quem você encontra no dia a dia. Organizado por categoria, pra saber na véspera com quem eu vou falar.',
      url:'https://docs.google.com/spreadsheets/d/1Z_jaMNQeoFdYq30eUvJJS4Q5W23lCoqE/edit?usp=sharing&ouid=110301229786299249013&rtpof=true&sd=true' },
    { tag:'Antes da sessão', title:'Abordagem', tool:'Roteiro de Abordagem',
      text:'O objetivo da abordagem não é vender, é marcar a sessão. Um roteiro, não um script decorado, adaptado ao perfil de cada pessoa.',
      url:'https://docs.google.com/document/d/1EwRezeJs_Eju-oEA5FEt_KXwRqQ4BK1p2kvclns7rOo/edit?usp=sharing' },
    { tag:'Antes da sessão', title:'Pré-diagnóstico', tool:'Página da sessão + pré-diagnóstico',
      text:'Quem aceita recebe o link dessa página: como a sessão funciona, pra quem é e pra quem não é. Responde o pré-diagnóstico em uns 10 minutos. Ela não chega numa "call de venda", chega numa sessão que já sabe que vale.',
      url:'https://diagnostico.incubadoradeexpert.com.br' },
    { tag:'Antes da sessão', title:'Agenda a sessão', tool:'',
      text:'Sessão individual de 45 minutos. Data, horário e canal confirmados.',
      url:'' },
    { tag:'Na sessão', title:'Aplica o diagnóstico', tool:'Radar do Expert',
      text:'As áreas que eu investigo são as fases do meu método, os 5 Ps. O que ela respondeu no pré-diagnóstico chega marcado. O radar cresce na tela e mostra onde ela está mais travada. Diagnóstico sempre antes da oferta.',
      url:'https://claude.ai/artifact/AgwbWdzWbfo5QWgxuy9wVb' },
    { tag:'Na sessão', title:'Oferta', tool:'Roteiro da Sessão + apresentação da oferta',
      text:'Antes de cada sessão eu preparo três coisas a partir do pré-diagnóstico: a abertura com as palavras dela, o gargalo provável e a oferta que deve fazer sentido. A sessão segue um roteiro em cinco etapas e termina numa apresentação feita pra ela.',
      url:'https://claude.ai/artifact/WeV7CVV38uBV7YTjvDzmc4', urlLabel:'Abrir o Roteiro da Sessão',
      local:'C:\\Users\\karol\\OneDrive\\Documentos\\Incubadora-de-expert\\business\\campanhas\\incubadora-de-expert-individual\\apresentacao-oferta-individual.html' },
    { tag:'Na sessão', title:'Fechamento', tool:'',
      text:'A decisão. E aqui o funil se divide em dois.',
      url:'' },
    { tag:'Depois do sim', title:'Onboarding', tool:'Onboarding da Incubadora',
      text:'Ela não fica perdida esperando o primeiro encontro: já sabe o que vem e o que precisa fazer.',
      url:'https://onboarding.incubadoradeexpert.com.br/' },
    { tag:'Depois do não', title:'Follow-up 5x', tool:'',
      text:'Não agora não é não pra sempre. Cinco contatos, cada um com um ângulo diferente. Não é cobrança, é continuar presente pra quando a hora dela chegar.',
      url:'' }
  ];

  const steps = [...document.querySelectorAll('.step')];
  const $ = id => document.getElementById(id);
  let atual = 0;

  function link(url, label){
    const a = document.createElement('a');
    a.className = 'open'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<svg aria-hidden="true"><use href="#i-ext"/></svg>';
    a.append(document.createTextNode(label));
    return a;
  }

  function mostrar(i){
    atual = (i + ETAPAS.length) % ETAPAS.length;
    const e = ETAPAS[atual];
    steps.forEach((s, k) => s.setAttribute('aria-pressed', String(k === atual)));
    $('pNum').textContent = String(atual + 1).padStart(2, '0');
    $('pTag').textContent = e.tag;
    $('pTitle').textContent = e.title;
    $('pText').textContent = e.text;
    $('pTool').textContent = e.tool ? 'Ferramenta: ' + e.tool : '';
    $('pTool').hidden = !e.tool;
    const box = $('pAction'); box.replaceChildren();
    if (e.url) box.append(link(e.url, e.urlLabel || 'Abrir ' + e.tool));
    else { const s = document.createElement('span'); s.className = 'nolink'; s.textContent = 'Acontece na conversa'; box.append(s); }
    if (e.local){
      const d = document.createElement('div'); d.className = 'local'; d.style.marginTop = '8px';
      const t = document.createElement('span'); t.className = 'hint'; t.style.opacity = '.7'; t.textContent = 'Apresentação da oferta (arquivo no computador):';
      const c = document.createElement('code'); c.textContent = e.local;
      d.append(t, c); box.append(d);
    }
  }

  steps.forEach(s => s.addEventListener('click', () => mostrar(+s.dataset.i)));
  document.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight') mostrar(atual + 1);
    if (ev.key === 'ArrowLeft') mostrar(atual - 1);
  });
  mostrar(0);
</script>
