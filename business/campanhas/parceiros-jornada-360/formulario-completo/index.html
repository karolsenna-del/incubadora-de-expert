:root{
  --ink:#0B0B0C;
  --ink-2:#151517;
  --ink-3:#1C1C1F;
  --paper:#FFFFFF;
  --fog:#F4F4F5;
  --mist:#D4D4D8;
  --ash:#71717A;
  --line:#3F3F46;
  --ember:#f85627;
  --ember-dark:#E04A1E;
  --ember-wash: rgba(248,86,39,0.10);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --dur:220ms;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.progress-track{
  position:fixed;
  top:0;left:0;right:0;
  height:2px;
  background:var(--line);
  z-index:20;
}
.progress-fill{
  height:100%;
  width:0%;
  background:var(--ember);
  transition:width .45s ease;
}

.chrome{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:clamp(16px,3vw,28px) clamp(20px,5vw,56px) 0;
  flex-shrink:0;
}
.wordmark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:0.8125rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--mist);
}
.chrome-right{
  display:flex;
  align-items:center;
  gap:16px;
}
.stepcount{
  font-variant-numeric:tabular-nums;
  font-size:0.75rem;
  letter-spacing:0.06em;
  color:var(--ash);
}
.restart{
  font-size:0.75rem;
  color:var(--ash);
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0;
  text-decoration:underline;
  text-decoration-color:transparent;
  transition:text-decoration-color var(--dur) ease, color var(--dur) ease;
}
.restart:hover{color:var(--mist);text-decoration-color:var(--ash);}

main#stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px clamp(20px,5vw,56px) 64px;
}

.screen{
  width:100%;
  max-width:640px;
  animation:enter var(--dur) ease-out;
}
@keyframes enter{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@media (prefers-reduced-motion:reduce){
  .screen{animation:none;}
  .progress-fill{transition:none;}
}

.eyebrow{
  font-family:var(--font-display);
  font-weight:600;
  font-size:0.75rem;
  letter-spacing:0.10em;
  text-transform:uppercase;
  color:var(--ember);
  margin-bottom:14px;
}
.qmeta{
  font-size:0.8125rem;
  letter-spacing:0.04em;
  color:var(--ash);
  margin-bottom:14px;
  font-variant-numeric:tabular-nums;
}
.qhelp{
  font-size:0.9375rem;
  font-style:italic;
  line-height:1.6;
  color:var(--ash);
  max-width:56ch;
  margin-bottom:22px;
}

.screen.intro h1, .screen.outro h1{
  font-size:clamp(2rem,4.4vw + 1rem,3.125rem);
  font-weight:700;
  line-height:1.08;
  color:var(--paper);
  margin-bottom:22px;
}
.screen.section h2, .screen.question h2{
  font-size:clamp(1.5rem,2.6vw + 1rem,2.125rem);
  font-weight:600;
  line-height:1.2;
  color:var(--paper);
  margin-bottom:28px;
}

.lede{
  font-size:1.0625rem;
  line-height:1.65;
  color:var(--mist);
  max-width:52ch;
}
.lede.small{
  font-size:0.9375rem;
  color:var(--ash);
  margin-top:14px;
}

.btn-primary{
  display:inline-block;
  font-family:var(--font-display);
  font-weight:600;
  font-size:0.9375rem;
  letter-spacing:0.01em;
  color:var(--ink);
  background:var(--ember);
  border:1px solid var(--ember);
  border-radius:3px;
  padding:15px 26px;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  transition:background var(--dur) ease, border-color var(--dur) ease, opacity var(--dur) ease, transform var(--dur) ease;
}
.btn-primary:hover:not(:disabled){background:var(--ember-dark);border-color:var(--ember-dark);}
.btn-primary:active:not(:disabled){transform:translateY(1px);}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;}

.btn-ghost{
  display:inline-block;
  font-family:var(--font-body);
  font-weight:500;
  font-size:0.875rem;
  color:var(--mist);
  background:none;
  border:1px solid var(--line);
  border-radius:3px;
  padding:13px 22px;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  transition:border-color var(--dur) ease, color var(--dur) ease;
}
.btn-ghost:hover{border-color:var(--ash);color:var(--paper);}

.screen.intro .btn-primary{margin-top:34px;}

.actions{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:34px;
  flex-wrap:wrap;
}

.hint{
  margin-top:16px;
  font-size:0.75rem;
  color:var(--ash);
}

.field-text, .field-textarea{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1.5px solid var(--line);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:1.25rem;
  line-height:1.5;
  padding:8px 2px 14px;
  transition:border-color var(--dur) ease;
  resize:vertical;
}
.field-text:focus, .field-textarea:focus{
  border-color:var(--ember);
  outline:none;
}
.field-text::placeholder, .field-textarea::placeholder{color:var(--ash);}
.field-textarea{min-height:110px;}

.choices{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.choice{
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  width:100%;
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:3px;
  color:var(--fog);
  font-size:1rem;
  padding:16px 18px;
  cursor:pointer;
  transition:border-color var(--dur) ease, background var(--dur) ease, color var(--dur) ease;
}
.choice:hover{border-color:var(--ash);}
.choice .mark{
  flex-shrink:0;
  width:18px;height:18px;
  border-radius:50%;
  border:1.5px solid var(--ash);
  position:relative;
  transition:border-color var(--dur) ease;
}
.choice.selected{border-color:var(--ember);background:var(--ember-wash);color:var(--paper);}
.choice.selected .mark{border-color:var(--ember);}
.choice.selected .mark::after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--ember);
}

.other-field{
  margin-top:6px;
  margin-left:2px;
}

.review{
  margin-top:40px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.review summary{
  cursor:pointer;
  font-size:0.875rem;
  color:var(--ash);
  letter-spacing:0.02em;
}
.review summary:hover{color:var(--mist);}
.review dl{
  margin-top:18px;
  display:grid;
  gap:14px;
}
.review dt{
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ash);
  margin-bottom:4px;
}
.review dd{
  margin:0;
  font-size:0.9375rem;
  color:var(--fog);
  line-height:1.5;
}

.status-msg{
  font-size:0.8125rem;
  color:var(--ash);
  margin-top:10px;
}
.status-msg.ok{color:var(--ember);}

.error-msg{
  font-size:0.8125rem;
  color:var(--ember);
  margin-top:10px;
  min-height:1em;
}

/* banner "PARCEIROS" — mesma identidade do form original (preto + laranja, foguete) */
.parceiros-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:clamp(18px,3vw,32px) clamp(20px,4vw,40px);
  margin-bottom:32px;
  overflow:hidden;
  position:relative;
}
.parceiros-banner::before{
  content:"";
  position:absolute;
  width:220px;height:220px;
  border-radius:50%;
  border:1.5px solid var(--ember);
  opacity:.14;
  top:-90px; right:-60px;
}
.parceiros-wordmark{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(28px,5.5vw,46px);
  letter-spacing:-0.01em;
  color:var(--paper);
  line-height:1;
  position:relative;
}
.parceiros-badge{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  position:relative;
}
.parceiros-badge img{width:clamp(64px,10vw,92px);height:auto;display:block;}

@media (max-width:520px){
  .actions{flex-direction:column;align-items:stretch;}
  .btn-primary, .btn-ghost{width:100%;text-align:center;}
  .parceiros-banner{flex-direction:column;text-align:center;}
}
</style>

<body>

<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <header class="chrome">
    <span class="wordmark">Incubadora de Expert</span>
    <div class="chrome-right">
      <span class="stepcount" id="stepCount"></span>
      <button class="restart" id="restartBtn" type="button">recomeçar</button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<script>
(function(){
  "use strict";

  // Depois de rodar o Setup (materiais/setup-planilha-triagem.md), cole aqui a URL do Web App.
  var SHEETS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbx-7XrdKaZBrnqWLe2kuEbJkEuAvuKivNSWOUfxAnzx1fMMSqLcAQmjKb0VlEFY7ZSWCw/exec";
  var STORAGE_KEY = "parceiro-completo-v1";
  var SHEET_FORM_ID = "completo";

  var SECTIONS = [
    {num:"01", title:"Qualificação básica", note:"Vamos começar com suas informações principais."},
    {num:"02", title:"Alinhamento de persona", note:"Preciso entender se sua persona está alinhada com os alunos da Incubadora."},
    {num:"03", title:"Método e expertise", note:"Quero entender seu método e o que você ensinaria na Incubadora."},
    {num:"04", title:"Prova social e resultados", note:"Preciso validar seus resultados e credibilidade."},
    {num:"05", title:"Capacidade de entrega", note:"Preciso entender sua disponibilidade e formato de trabalho."},
    {num:"06", title:"Alinhamento de valores", note:"Quero garantir que estamos alinhados em valores e abordagem."},
    {num:"07", title:"Informações finais", note:"Últimas perguntas!"}
  ];

  var QUESTIONS = [
    {id:"nome", section:0, type:"text", required:true,
      label:"Qual é o seu nome completo?"},
    {id:"email", section:0, type:"text", required:true, inputType:"email",
      label:"Qual é o seu e-mail principal?"},
    {id:"instagram", section:0, type:"text", required:true,
      label:"Qual é o seu Instagram?"},
    {id:"area", section:0, type:"textarea", required:true,
      label:"Em qual área você é especialista?", placeholder:"Ex: Oratória Digital, Produtividade para Experts, Mindset Empreendedor, cenário"},
    {id:"tempo_especialidade", section:0, type:"choice", required:true,
      label:"Há quanto tempo você trabalha com essa especialidade?",
      options:["Menos de 1 ano","1-2 anos","3-5 anos","Mais de 5 anos"]},

    {id:"persona_hoje", section:1, type:"textarea", required:true,
      label:"Quem é sua persona principal hoje?", placeholder:"Descreva quem você atende atualmente: perfil, dores, objetivos"},
    {id:"trabalha_especialistas_digitais", section:1, type:"choice", required:true,
      label:'Você trabalha com "especialistas digitais" ou "profissionais que querem entrar no digital"?',
      options:["Sim, é minha persona principal","Sim, é uma das minhas personas","Não, mas tenho conhecimento que agrega para essa persona","Não trabalho com essa persona"]},
    {id:"conteudo_fala_tema", section:1, type:"choice", required:true,
      label:"Seu conteúdo nas redes sociais fala sobre o tema que você quer ensinar na Incubadora?",
      options:["Sim, falo frequentemente sobre isso","Falo ocasionalmente","Não, meu conteúdo é sobre outro tema"]},

    {id:"tem_metodo", section:2, type:"textarea", required:true,
      label:"Você tem um método?", placeholder:"Se sim, qual o nome e como funciona? Descreva seu método, framework ou processo único. Se não tem método formal, explique sua abordagem estruturada."},
    {id:"diferencial", section:2, type:"textarea", required:true,
      label:"O que torna seu método/abordagem diferente de outros no mercado?", placeholder:"Qual é o seu mecanismo único? O que só você faz?"},
    {id:"tema_aula", section:2, type:"textarea", required:true,
      label:"Qual seria o tema/aula que você ensinaria na Incubadora de Expert?", placeholder:'Ex: "Como gravar vídeos profissionais sem estúdio", "Oratória para vendas digitais", "Produtividade para criadores de conteúdo"...'},
    {id:"transformacao", section:2, type:"textarea", required:true,
      label:"Qual seria a transformação que os alunos teriam após essa aula?", placeholder:'Seja específico: de onde para onde? Ex: "De inseguro na frente da câmera para gravando vídeos com naturalidade e profissionalismo"'},

    {id:"ja_vendeu", section:3, type:"choice", required:true,
      label:"Você já vendeu infoproduto (curso, mentoria, consultoria online)?",
      options:["Sim, vendo regularmente","Sim, já vendi algumas vezes","Não, mas tenho outros produtos/serviços","Ainda não"]},
    {id:"cases", section:3, type:"textarea", required:true,
      label:"Compartilhe 2-3 cases ou depoimentos de resultados que você gerou", placeholder:"Cole links de posts com depoimentos, prints de mensagens, ou descreva os resultados específicos que seus clientes/alunos tiveram"},
    {id:"links_conteudo", section:3, type:"textarea", required:true,
      label:"Compartilhe links de conteúdos seus sobre o tema que quer ensinar", placeholder:"Posts, vídeos, artigos — queremos ver como você comunica esse conhecimento. Cole 3-5 links relevantes."},

    {id:"disponibilidade_gravar", section:4, type:"choice", required:true,
      label:"Você teria disponibilidade para gravar essa aula para a Incubadora no prazo de 30 dias após fecharmos parceria?",
      options:["Sim","Não"]},
    {id:"material_apoio", section:4, type:"choice", required:true,
      label:"Tem disponibilidade para criar um material de apoio para anexar à aula?",
      options:["Sim","Não"]},
    {id:"interagir_alunos", section:4, type:"choice", required:true,
      label:"Você teria interesse em interagir com os alunos (ser tutor em uma sessão no tema da sua especialidade)?",
      options:["Sim","Não, prefiro apenas entregar a aula gravada"]},

    {id:"espera_ganhar", section:5, type:"textarea", required:true,
      label:"O que você espera ganhar com essa parceria?", placeholder:"Ex: autoridade, audiência qualificada, networking, receita, aprendizado, cases, etc. Seja honesto e específico."},
    {id:"abordagem_ensino", section:5, type:"textarea", required:true,
      label:"Como você descreveria sua abordagem de ensino?", placeholder:"Queremos entender seu estilo, valores e como você trabalha com seus alunos/clientes"},
    {id:"compromete_qualidade", section:5, type:"choice", required:true,
      label:"Você se compromete a entregar conteúdo de qualidade, sem promessas milagrosas ou atalhos duvidosos?",
      options:["Sim, totalmente alinhado com essa abordagem","Sim, mas gostaria de entender melhor os critérios","Preciso pensar melhor sobre isso"]},
    {id:"motivacao", section:5, type:"textarea", required:true,
      label:"Por que você quer ser parceiro da Incubadora de Expert?", placeholder:"Queremos entender sua motivação genuína para essa parceria"},

    {id:"algo_mais", section:6, type:"textarea", required:true,
      label:"Tem algo mais que você gostaria de compartilhar sobre você, seu trabalho ou sua proposta?", placeholder:"Espaço livre pra qualquer informação relevante que não foi coberta antes (inclusive suas dúvidas)"},
    {id:"como_conheceu", section:6, type:"choice", required:true,
      label:"Como você conheceu a Incubadora de Expert?",
      options:["Grupo de mentoria do Euriler","Indicação de alguém","Redes sociais"]}
  ];

  var steps = [{type:"intro"}];
  SECTIONS.forEach(function(sec, si){
    steps.push({type:"section", section:si});
    QUESTIONS.filter(function(q){return q.section===si;}).forEach(function(q){
      steps.push({type:"question", q:q});
    });
  });
  steps.push({type:"outro"});

  var totalQuestions = QUESTIONS.length;

  var state = {stepIndex:0, answers:{}};
  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(saved && typeof saved.stepIndex === "number"){ state = saved; }
  }catch(e){}

  var stage = document.getElementById("stage");
  var progressFill = document.getElementById("progressFill");
  var stepCount = document.getElementById("stepCount");
  var restartBtn = document.getElementById("restartBtn");

  restartBtn.addEventListener("click", function(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = {stepIndex:0, answers:{}};
    render();
  });

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === "class") node.className = attrs[k];
      else if(k === "text") node.textContent = attrs[k];
      else if(k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) node.appendChild(c); });
    return node;
  }

  function questionIndexOf(step){
    var qOnly = steps.filter(function(s){return s.type==="question";});
    return qOnly.indexOf(step) + 1;
  }

  function go(delta){
    var next = state.stepIndex + delta;
    if(next < 0) next = 0;
    if(next > steps.length - 1) next = steps.length - 1;
    state.stepIndex = next;
    saveState();
    render();
  }

  function updateChrome(step){
    var answeredQ = QUESTIONS.filter(function(q){
      var a = state.answers[q.id];
      return a !== undefined && a !== null && String(a).trim() !== "";
    }).length;
    var pct = Math.round((answeredQ / totalQuestions) * 100);
    if(step.type === "intro") pct = 0;
    if(step.type === "outro") pct = 100;
    progressFill.style.width = pct + "%";

    if(step.type === "question"){
      var n = questionIndexOf(step);
      stepCount.textContent = String(n).padStart(2,"0") + " / " + String(totalQuestions).padStart(2,"0");
    } else if(step.type === "section"){
      stepCount.textContent = "PARTE " + SECTIONS[step.section].num;
    } else {
      stepCount.textContent = "";
    }
  }

  function isAnswered(q){
    var a = state.answers[q.id];
    if(q.type === "choice_other"){
      if(a && a.value === "__other__") return !!(a.other && a.other.trim());
      return !!(a && a.value);
    }
    return a !== undefined && a !== null && String(a).trim() !== "";
  }

  function buildSection(step){
    var sec = SECTIONS[step.section];
    var s = el("div", {class:"screen section"});
    s.appendChild(el("p", {class:"eyebrow", text:"Parte " + sec.num + " de " + String(SECTIONS.length).padStart(2,"0")}));
    s.appendChild(el("h2", {text:sec.title}));
    s.appendChild(el("p", {class:"lede", text:sec.note}));
    var actions = el("div", {class:"actions"});
    var backBtn = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    backBtn.addEventListener("click", function(){ go(-1); });
    actions.appendChild(backBtn);
    var btn = el("button", {class:"btn-primary", type:"button", text:"Seguir →"});
    btn.addEventListener("click", function(){ go(1); });
    actions.appendChild(btn);
    s.appendChild(actions);
    return s;
  }

  function buildQuestion(step){
    var q = step.q;
    var sec = SECTIONS[q.section];
    var s = el("div", {class:"screen question"});
    s.appendChild(el("p", {class:"qmeta", text:sec.title.toUpperCase()}));
    s.appendChild(el("h2", {text:q.label}));
    if(q.help){ s.appendChild(el("p", {class:"qhelp", text:q.help})); }

    var input;
    var errorMsg = el("p", {class:"error-msg"});

    function refreshButton(){
      nextBtn.disabled = q.required && !isAnswered(q);
    }

    if(q.type === "text"){
      input = el("input", {class:"field-text", type:q.inputType || "text", placeholder:q.placeholder || "Sua resposta"});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      input.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){ ev.preventDefault(); if(!nextBtn.disabled) advance(); }
      });
      s.appendChild(input);
    } else if(q.type === "textarea"){
      input = el("textarea", {class:"field-textarea", rows:"4", placeholder:q.placeholder || "Escreva sem filtro..."});
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function(){
        state.answers[q.id] = input.value;
        saveState();
        refreshButton();
      });
      input.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); if(!nextBtn.disabled) advance(); }
      });
      s.appendChild(input);
      s.appendChild(el("p", {class:"hint", text:"Enter para continuar · Shift+Enter para quebrar linha"}));
    } else if(q.type === "choice" || q.type === "choice_other"){
      var wrap = el("div", {class:"choices"});
      var current = state.answers[q.id] || {value:null, other:""};
      if(typeof current === "string"){ current = {value:current, other:""}; }

      function renderChoices(){
        wrap.innerHTML = "";
        q.options.forEach(function(opt){
          var btn = el("div", {class:"choice" + (current.value===opt ? " selected" : "")});
          btn.appendChild(el("span", {class:"mark"}));
          btn.appendChild(el("span", {text:opt}));
          btn.addEventListener("click", function(){
            current.value = opt;
            state.answers[q.id] = q.type === "choice_other" ? current : opt;
            saveState();
            renderChoices();
            refreshButton();
          });
          wrap.appendChild(btn);
        });
        if(q.type === "choice_other"){
          var otherBtn = el("div", {class:"choice" + (current.value==="__other__" ? " selected" : "")});
          otherBtn.appendChild(el("span", {class:"mark"}));
          otherBtn.appendChild(el("span", {text:q.otherLabel || "Outro"}));
          otherBtn.addEventListener("click", function(){
            current.value = "__other__";
            state.answers[q.id] = current;
            saveState();
            renderChoices();
            refreshButton();
            var oi = wrap.parentNode.querySelector(".other-input");
            if(oi) oi.focus();
          });
          wrap.appendChild(otherBtn);
        }
      }
      renderChoices();
      s.appendChild(wrap);

      if(q.type === "choice_other"){
        var otherField = el("input", {class:"field-text other-field other-input", type:"text", placeholder:"Conta rapidinho..."});
        otherField.value = current.other || "";
        otherField.style.display = current.value === "__other__" ? "block" : "none";
        otherField.addEventListener("input", function(){
          current.other = otherField.value;
          state.answers[q.id] = current;
          saveState();
          refreshButton();
        });
        s.appendChild(otherField);
        var origRenderChoices = renderChoices;
        renderChoices = function(){
          origRenderChoices();
          otherField.style.display = current.value === "__other__" ? "block" : "none";
        };
      }
    }

    var actions = el("div", {class:"actions"});
    var backBtn2 = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    backBtn2.addEventListener("click", function(){ go(-1); });
    actions.appendChild(backBtn2);
    var nextBtn = el("button", {class:"btn-primary", type:"button", text:"Continuar →"});
    nextBtn.addEventListener("click", advance);
    actions.appendChild(nextBtn);
    s.appendChild(actions);
    s.appendChild(errorMsg);
    if(q.type === "text"){
      s.appendChild(el("p", {class:"hint", text:"pressione Enter ↵"}));
    }

    function advance(){
      if(q.required && !isAnswered(q)){
        errorMsg.textContent = "Essa aqui eu preciso saber pra entender seu encaixe.";
        return;
      }
      go(1);
    }

    refreshButton();
    setTimeout(function(){ if(input && input.focus) input.focus(); }, 10);
    return s;
  }

  function answerText(q){
    var a = state.answers[q.id];
    if(!isAnswered(q)) return "";
    if(q.type === "choice_other"){
      return String(a.value === "__other__" ? a.other : a.value).trim();
    }
    return String(a).trim();
  }

  function buildSheetRow(){
    var today = new Date();
    var dd = String(today.getDate()).padStart(2,"0");
    var mm = String(today.getMonth()+1).padStart(2,"0");
    var yyyy = today.getFullYear();
    var row = [dd + "/" + mm + "/" + yyyy];
    QUESTIONS.forEach(function(q){ row.push(answerText(q)); });
    return row;
  }

  function sendToSheet(){
    if(!SHEETS_ENDPOINT_URL || SHEETS_ENDPOINT_URL.indexOf("COLE_AQUI") === 0) return;
    fetch(SHEETS_ENDPOINT_URL, {
      method:"POST",
      body: JSON.stringify({form: SHEET_FORM_ID, row: buildSheetRow()})
    }).catch(function(){});
  }

  function buildOutro(){
    var s = el("div", {class:"screen outro"});
    s.appendChild(el("p", {class:"eyebrow", text:"Prontinho"}));
    s.appendChild(el("h1", {text:"Recebido. Vou analisar seu perfil com calma."}));
    s.appendChild(el("p", {class:"lede", text:"Suas respostas já foram registradas. Vou fazer uma curadoria cuidadosa pra garantir que todos os parceiros agreguem valor real aos alunos, e te dou um retorno em até 7 dias úteis."}));

    var actions = el("div", {class:"actions"});
    var outroBackBtn = el("button", {class:"btn-ghost", type:"button", text:"← Voltar"});
    outroBackBtn.addEventListener("click", function(){ go(-1); });
    actions.appendChild(outroBackBtn);
    s.appendChild(actions);

    var review = el("details", {class:"review"});
    var summary = el("summary", {text:"Ver minhas respostas"});
    var dl = el("dl");
    QUESTIONS.forEach(function(q){
      if(!isAnswered(q)) return;
      dl.appendChild(el("dt", {text:q.label}));
      dl.appendChild(el("dd", {text:answerText(q)}));
    });
    review.appendChild(summary);
    review.appendChild(dl);
    s.appendChild(review);

    return s;
  }

  function render(){
    var step = steps[state.stepIndex];
    updateChrome(step);
    stage.innerHTML = "";
    var screen;
    if(step.type === "intro") screen = buildIntro();
    else if(step.type === "section") screen = buildSection(step);
    else if(step.type === "question") screen = buildQuestion(step);
    else {
      if(!state.submitted){
        sendToSheet();
        state.submitted = true;
        saveState();
      }
      screen = buildOutro();
    }
    stage.appendChild(screen);
  }

  render();
})();
</script>

</body>
</html>
