<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#111;overflow:hidden}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#111}
.photo{position:absolute;inset:0;background:url('image.png') center 8%/cover no-repeat}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 32%,rgba(0,0,0,.15) 58%,rgba(0,0,0,0) 72%)}
.handle{position:absolute;top:50px;right:70px;font-family:Inter;font-weight:700;font-size:34px;color:#F7F7F5;background:rgba(0,0,0,.35);padding:12px 28px;border-radius:100px}
.content{position:absolute;left:0;right:0;bottom:90px;padding:0 70px}
.rule{width:90px;height:8px;background:#F05A28;margin-bottom:30px;border-radius:2px}
.l1{font-family:Lato;font-weight:700;font-size:46px;line-height:1.3;color:#F7F7F5;margin-bottom:22px}
.l2{font-family:Inter;font-weight:900;font-size:66px;line-height:1.1;color:#F05A28;letter-spacing:-.5px}
</style></head><body><div class="slide"><div class="photo"></div><div class="overlay"></div>
<div class="handle">@karolsenna._</div>
<div class="content"><div class="rule"></div>
<div class="l1">Fui auditora numa big four. Coordenei projeto premiado de gestão.</div>
<div class="l2">E meus alunos não aplicavam nada do que eu ensinava.</div></div></div></body></html>
