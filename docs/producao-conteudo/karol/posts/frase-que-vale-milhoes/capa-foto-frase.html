<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    background: linear-gradient(135deg, #4a4a4a 0%, #1a1a1a 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .photo {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url('image.png');
    background-size: cover;
    background-position: center;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 45%, rgba(0,0,0,0) 70%);
  }

  .handle {
    position: absolute;
    top: 50px;
    right: 70px;
    z-index: 2;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: #F7F7F5;
    background: rgba(0,0,0,0.35);
    padding: 12px 28px;
    border-radius: 100px;
  }

  .content {
    position: relative;
    padding: 0 70px 80px;
    z-index: 2;
  }

  .accent-rule {
    width: 90px;
    height: 8px;
    background: #F05A28;
    margin-bottom: 30px;
    border-radius: 2px;
  }

  .headline {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 86px;
    line-height: 1.05;
    color: #F7F7F5;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .subline {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 48px;
    color: #F7F7F5;
    opacity: 0.9;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="photo"></div>
  <div class="overlay"></div>

  <div class="handle">@karolsenna._</div>

  <div class="content">
    <div class="accent-rule"></div>
    <div class="headline">Essa frase sustenta R$ 214 milhões</div>
    <div class="subline">o que foi investido pra construir esse resort</div>
  </div>
</div>
</body>
</html>
